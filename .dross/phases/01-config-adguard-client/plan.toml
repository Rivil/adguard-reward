[phase]
  id = "01-config-adguard-client"

[[task]]
  id = "t-1"
  wave = 1
  title = "Config package with Secret redaction"
  files = ["internal/config/config.go", "internal/config/secret.go", "internal/config/config_test.go", "internal/config/testdata/full.yaml", "go.mod", "go.sum"]
  description = "config.Load(path, explicit, lookupEnv) (*Config, error). Struct mirrors the PLAN.md key set\n(listen, base_url, tls.cert/key, adguard.url/username/password/password_file, data_dir,\nai.provider/api_key/api_key_file/base_url/model, log_level). Parse with gopkg.in/yaml.v3\nKnownFields(true). Precedence defaults < YAML < env via an explicit env-name table; a\nset-but-empty env var overrides to empty and fails validation. *_file read after merge,\ntrailing newline trimmed, relative paths resolved against the config file's directory (CWD\nwhen env-only); password + password_file both set is an error naming both. Validation names\nthe dotted key: adguard.url (http/https, no userinfo), adguard.username, adguard.password,\nlog_level. Missing default file runs env-only; missing explicit path errors with the path.\ntype Secret string: String/GoString/Format/MarshalText/MarshalJSON/LogValue all yield\n\"[redacted]\", Reveal() is the only way out; used for adguard.password and ai.api_key.\nConfig.SlogLevel() maps log_level.\n"
  covers = ["c-1", "c-2"]
  test_contract = ["if validation stops naming the dotted key, TestLoad_MissingRequired fails: removing any of adguard.url / adguard.username / adguard.password from a valid yaml must yield an error whose text contains that exact key", "if env precedence breaks, TestLoad_EnvOverridesYAML fails: yaml password yamlpw + ADGUARD_REWARD_ADGUARD_PASSWORD=envpw gives Reveal()==envpw; env set to empty string gives an error naming adguard.password (blank env does not fall through)", "if a config leaf gains or loses its env name, TestEnvTable fails: a table pins every leaf's env name (ADGUARD_REWARD_LISTEN, _BASE_URL, _TLS_CERT, _TLS_KEY, _ADGUARD_URL, _ADGUARD_USERNAME, _ADGUARD_PASSWORD, _ADGUARD_PASSWORD_FILE, _DATA_DIR, _AI_PROVIDER, _AI_API_KEY, _AI_API_KEY_FILE, _AI_BASE_URL, _AI_MODEL, _LOG_LEVEL) and a reflection walk asserts every yaml-tagged leaf has a row", "if *_file indirection breaks, TestLoad_SecretFile fails: ADGUARD_REWARD_ADGUARD_PASSWORD_FILE pointing at a temp file containing 's3cret\\n' gives Reveal()==s3cret; empty or unreadable file errors naming adguard.password_file; ADGUARD_REWARD_AI_API_KEY_FILE behaves identically; a relative password_file resolves against the config file's directory, not CWD", "if the both-set guard breaks, TestLoad_PasswordAndFileConflict fails: password and password_file both set errors naming both keys", "if KnownFields is dropped, TestLoad_UnknownKey fails: yaml key 'passwrod:' under adguard errors mentioning passwrod; a yaml syntax error carries a line number", "if the explicit-vs-default path rule breaks, TestLoad_MissingFile fails: Load('/nope/config.yaml', explicit=true) errors containing the path; Load(same, explicit=false) with the three required env vars set succeeds", "if Secret redaction breaks, TestSecret_Redacted fails: fmt %v/%+v/%#v/%s/%q, json.Marshal(cfg), and slog TextHandler and JSONHandler at Debug logging cfg as an attr all lack the password and api key and contain '[redacted]'; Reveal() returns the original", "if log level mapping breaks, TestSlogLevel fails: 'debug' maps to slog.LevelDebug and 'bogus' errors naming log_level"]
  status = "done"

[[task]]
  id = "t-2"
  wave = 1
  title = "Fake AdGuard server and v0.107.x fixtures"
  files = ["internal/adguard/adguardtest/server.go", "internal/adguard/adguardtest/server_test.go", "internal/adguard/adguardtest/testdata/clients.json", "internal/adguard/adguardtest/testdata/blocked_services_get.json", "internal/adguard/adguardtest/testdata/blocked_services_all.json", "internal/adguard/adguardtest/testdata/status.json"]
  description = "Importable (non-_test) package wrapping httptest.Server: adguardtest.New(t, Options{User, Pass}).\nFixtures go:embed'd in the v0.107.x shape: per-client blocked_services: [ids] +\nblocked_services_schedule; global /control/blocked_services/get -> {ids, schedule}; /all ->\n{blocked_services: [{id, name, icon_svg, rules}]}; /status -> {version, ...}. icon_svg values are\nplaceholders (\"<svg/>\"), never AdGuard's real icons (r-01); the fixture note says so. Fixture\nclients: one with use_global_blocked_services=true, one \"Kid phone\" with [\"youtube\",\"tiktok\"]\ncarrying \"future_field\": 42, a safe_search object and upstreams_cache_size: null, one with\n\"blocked_services\": null. Each fixture notes the version/openapi tag it was checked against\n(confirm against nora or the pinned openapi.yaml before landing). Enforces basic auth on every\n/control/* except /control/login (401 otherwise); /control/login takes JSON {name, password},\n403 on mismatch (overridable). POST /control/clients/update strict-decodes {name, data} (400 on\nunknown top-level key), stores data verbatim so the next GET /control/clients reflects it.\nRecords every request (method, path, Authorization present?, raw body) via Requests().\nKnobs: SetStatus(path, code), Hang(path, d), SetAuth(ok), MutateClient(name, fn),\nMaxInFlightUpdates(), LastUpdate(), Close()."
  covers = ["c-3", "c-4", "c-5", "c-6"]
  test_contract = ["if basic-auth enforcement breaks, TestFake_RequiresBasicAuth fails: GET /control/clients without Authorization is 401, wrong password is 401, right password returns the embedded fixture bytes verbatim", "if the login handler breaks, TestFake_Login fails: POST /control/login with configured creds and no Authorization is 200; wrong password is 403 with body 'invalid username or password'; SetStatus('/control/login', 400) makes the rejection 400", "if the update echo breaks, TestFake_UpdateEcho fails: POST /control/clients/update {name, data} then GET /control/clients returns data verbatim, unknown keys included; an unknown top-level key in the update is 400", "if Hang breaks, TestFake_Hang fails: after Hang('/control/status', 1s) a GET takes at least 1s", "if a fixture drifts from the v0.107.x shape, TestFixtures_Shape fails: every fixture decodes; every client in clients.json has use_global_blocked_services, blocked_services (array or null) and blocked_services_schedule; blocked_services_get has ids and schedule; blocked_services_all.blocked_services[0] has id, name, icon_svg; status has version", "if request recording breaks, TestFake_Requests fails: Requests() returns entries in arrival order with raw bodies preserved"]
  status = "done"

[[task]]
  id = "t-3"
  wave = 2
  title = "AdGuard client core, Login, Status"
  files = ["internal/adguard/client.go", "internal/adguard/errors.go", "internal/adguard/client_test.go"]
  description = "adguard.New(baseURL, username, password, opts ...Option) (*Client, error) with WithHTTPClient /\nWithLogger. New validates the URL (http/https, no userinfo, trailing slash stripped).\nWithHTTPClient copies the injected client and forces CheckRedirect to ErrUseLastResponse so the\nno-redirect policy survives injection. Unexported do(ctx, method, path, in, out) sets basic auth\non every call, never follows redirects, reads error bodies through a 1 KiB LimitReader, 10s\ndefault timeout. Mapping: 2xx ok; 401/403 -> ErrBadCredentials wrapping *StatusError; 429 ->\nErrRateLimited; every other non-2xx (including 400) -> plain *StatusError{Method, Path, Code,\nSnippet}; transport -> wrapped *url.Error. Debug log per request: method, path, status,\nduration_ms, never headers. Login(ctx, user, pass) POSTs /control/login {name, password}\nWITHOUT the service basic-auth header (the one documented exception to adguard_auth), discards\nthe cookie; Login alone additionally maps 400 -> ErrBadCredentials (older AdGuard builds answer a\nbad password with 400). Status(ctx) (Status{Version, Running, ProtectionEnabled}, error) GETs\n/control/status."
  covers = ["c-3", "c-7", "c-2"]
  depends_on = ["t-2"]
  test_contract = ["if credential classification breaks, TestLogin_BadCredentials fails: fake login rejecting with 403, 400 and 401 each yield errors.Is(err, ErrBadCredentials); correct creds yield nil", "if transport/status errors are conflated with credentials, TestLogin_ServerError fails: fake 502/503 yields !errors.Is(ErrBadCredentials) and errors.As *StatusError with Code and Path '/control/login'; fake closed before Login yields !ErrBadCredentials and errors.As *url.Error", "if 429 is mapped to bad credentials, TestLogin_RateLimited fails: SetStatus('/control/login', 429) yields ErrRateLimited, not ErrBadCredentials", "if Login starts sending the service credential, TestLogin_NoBasicAuth fails: the recorded /control/login request has no Authorization header and its body decodes to exactly {name: u, password: p}", "if basic auth is dropped from service calls, TestStatus_BasicAuth fails: the recorded /control/status request carries 'Basic ' + base64(user:pass)", "if Status mapping breaks, TestStatus fails: SetStatus('/control/status', 401) returns ErrBadCredentials; 503 returns *StatusError Code 503; fixture returns Version == the fixture value", "if the error-body bound is removed, TestStatus_SnippetBound fails: a 503 with a 10 KiB body yields StatusError.Snippet of at most 1024 bytes", "if redirects are followed, TestDo_NoRedirect fails: fake responding 302 yields *StatusError Code 302", "if context is ignored, TestDo_Deadline fails: Hang('/control/status', 200ms) with a 50ms ctx deadline yields errors.Is(err, context.DeadlineExceeded)", "if the request log leaks secrets, TestLog_NoSecrets fails: WithLogger at Debug into a buffer across a 200, 500, 401 and closed-port call plus every returned Error() string contains 'GET' and '/control/status' (positive control) and contains neither the password nor base64(user:pass)", "if URL validation breaks, TestNew_BadURL fails: New('://bad'), New('127.0.0.1:80') and New('http://u:p@host') each error naming adguard.url; New without WithHTTPClient has Timeout > 0", "if the redirect policy is lost on injection, TestDo_NoRedirect_Injected fails: a Client built with WithHTTPClient(&http.Client{}) against a fake responding 302 still yields *StatusError Code 302"]
  status = "done"

[[task]]
  id = "t-4"
  wave = 3
  title = "Clients, Services, SetBlockedServices read-modify-write"
  files = ["internal/adguard/clients.go", "internal/adguard/services.go", "internal/adguard/clients_test.go", "internal/adguard/services_test.go", "internal/adguard/client.go"]
  description = "Clients(ctx) (ClientsResult, error) = GET /control/clients (clients; auto_clients ignored) +\nGET /control/blocked_services/get -> []PersistentClient{Name, IDs, BlockedServices,\nUseGlobalBlockedServices} + GlobalBlockedServices []string; each PersistentClient keeps its raw\nobject as unexported map[string]json.RawMessage. Nil JSON lists become empty non-nil slices.\nServices(ctx) ([]Service{ID, Name, Icon}, error) from /control/blocked_services/all (Icon =\nicon_svg). SetBlockedServices(ctx, clientName, ids) under a client-wide sync.Mutex: fresh GET,\nfind by exact name (else ErrClientNotFound, no write), copy raw, replace only \"blocked_services\"\nwith the sorted deduplicated ids (nil/empty -> [], never null), POST /control/clients/update\n{name, data: raw}. Warn-level log (not a refusal) when use_global_blocked_services=true.\n"
  covers = ["c-4", "c-5", "c-6"]
  depends_on = ["t-3"]
  test_contract = ["if client typing breaks, TestClients_Fixture fails: Clients() returns the fixture's client count; 'Kid phone' Name/IDs/BlockedServices/UseGlobalBlockedServices equal the fixture literals; GlobalBlockedServices equals blocked_services_get.json ids", "if null handling breaks, TestClients_Null fails: the fixture client with 'blocked_services': null decodes to an empty non-nil slice; fake serving {clients: null} gives an empty slice with no panic", "if the RMW stops preserving fields, TestSetBlockedServices_Preserves fails: after SetBlockedServices('Kid phone', [youtube, tiktok]) the echoed update body has name == 'Kid phone' and data with blocked_services deleted deep-equals the original raw object with blocked_services deleted (future_field 42, blocked_services_schedule, safe_search, upstreams_cache_size null, tags, upstreams all preserved); data.blocked_services == [youtube, tiktok]", "if id normalisation breaks, TestSetBlockedServices_Normalise fails: ids [b, a, a] are written as [a, b]; nil ids are written as [] not null", "if the RMW reads a cached client, TestSetBlockedServices_FreshRead fails: MutateClient changes the ids between Clients() and SetBlockedServices() and the echoed body carries the mutated ids", "if an unknown client triggers a write, TestSetBlockedServices_NotFound fails: SetBlockedServices('nobody', ...) yields errors.Is(ErrClientNotFound) and the fake recorded zero /control/clients/update requests", "if the mutex is removed, TestSetBlockedServices_Serialised fails: Hang('/control/clients', 20ms) with 5 concurrent goroutines yields MaxInFlightUpdates() == 1 and the recorded sequence never interleaves GET,GET,POST,POST", "if write-path errors are swallowed, TestSetBlockedServices_Errors fails: SetStatus('/control/clients/update', 400) yields *StatusError Code 400 with a snippet; SetAuth(false) yields ErrBadCredentials", "if the use_global warning is dropped, TestSetBlockedServices_GlobalWarn fails: a client with use_global_blocked_services=true produces a warn-level log line containing 'use_global_blocked_services' and the write still happens", "if the second read's failure is swallowed, TestClients_PartialFailure fails: fake 401 on /control/blocked_services/get only makes Clients() return ErrBadCredentials with no partial result", "if the catalogue is vendored instead of fetched, TestServices fails: against the 3-entry fixture Services() returns 3 with Icon == icon_svg; fake serving exactly two services, one with id 'zzz-not-in-any-catalogue', returns exactly those two; {blocked_services: null} returns an empty slice and nil error", "if a 400 on a service call is misreported as a credential rejection, TestSetBlockedServices_Errors fails: the SetStatus(/control/clients/update, 400) branch also asserts !errors.Is(err, ErrBadCredentials)"]
  status = "done"

[[task]]
  id = "t-5"
  wave = 3
  title = "Health prober and /healthz handler"
  files = ["internal/health/health.go", "internal/health/health_test.go", "Makefile"]
  description = "health.New(status StatusClient, appVersion string, log *slog.Logger) *Prober where StatusClient\nis interface{ Status(ctx) (adguard.Status, error) }. Probe(ctx) Result{State, Version, Err}\nclassifies: nil -> \"ok\"; errors.Is(ErrBadCredentials) -> \"unauthorized\"; anything else ->\n\"unreachable\"; snapshot stored under a sync.RWMutex; one Info line (adguard_version attr) on\nsuccess, one Error line on failure. Handler() always writes 200 application/json {status: \"ok\",\nadguard, adguard_version, version} from stored state only, never calling AdGuard. Run(ctx,\ninterval) re-probes on a ticker until ctx is done; a later \"unauthorized\" only changes the body,\nnever exits. Tested against a stub StatusClient (the fake is exercised end-to-end in t-6).\nMakefile test target gains -race.\n"
  covers = ["c-7"]
  depends_on = ["t-3"]
  test_contract = ["if the healthz body shape breaks, TestHandler_OK fails: stub returning Status{Version: v0.107.52} then GET yields 200, Content-Type application/json, body decoding to exactly {status: ok, adguard: ok, adguard_version: v0.107.52, version: test-1}", "if classification breaks or the status code stops being 200, TestHandler_Classify fails: stub returning an ErrBadCredentials-wrapped error yields 200 with adguard == unauthorized; *StatusError{503} or *url.Error yields 200 with adguard == unreachable; in both adguard_version is '' (not null) and status is ok", "if last-probe-wins breaks or Run exits on failure, TestRun_Transitions fails: Run(ctx, 10ms) against a stub flipped ok -> 503 -> ok -> ErrBadCredentials transitions through unreachable/ok/unauthorized within 200ms each and Run keeps running", "if the enum is opened, TestHandler_BeforeProbe fails: Handler before any Probe yields 200 with adguard == unreachable", "if the handler awaits AdGuard, TestHandler_NonBlocking fails: a stub blocking on a channel while a probe is in flight still lets a concurrent GET /healthz return within 100ms", "if the RWMutex is removed, TestHandler_Race fails under go test -race: 50 goroutines hitting Handler while Run probes at 1ms", "if the ticker or logging breaks, TestRun_Ticker fails: Run(ctx, 5ms) with a counting stub records at least 2 calls after 50ms; cancelling ctx returns from Run; the Info log on success contains v0.107.52 and the Error log on failure contains the error text"]
  status = "done"

[[task]]
  id = "t-6"
  wave = 4
  title = "Wire main: --config, startup probe, healthz JSON"
  files = ["cmd/adguard-reward/main.go", "cmd/adguard-reward/main_test.go", "Makefile", "deploy/config.example.yaml", "deploy/Dockerfile"]
  description = "Replace --listen and envOr with --config (default: config.yaml beside os.Executable();\nexplicit-vs-default detected via flag.Visit). Extract run(ctx, args, lookupEnv, stderr,\nonListen) int; main() calls os.Exit(run(...)). Sequence: config.Load -> slog handler at\ncfg.SlogLevel() on stderr -> adguard.New -> health.New -> Probe: ErrBadCredentials -> Error log\n\"adguard rejected the service credential (adguard.username / adguard.password)\" + AdGuard URL,\nreturn 1; any other error -> Error log, continue; success -> Info with adguard_version. Mount\nGET /healthz -> prober.Handler(); start prober.Run(ctx, 60s); net.Listen(cfg.Listen) then Serve\nwith the existing graceful shutdown. var version = \"dev\"; Makefile gains VERSION ?= git\ndescribe and -X main.version=$(VERSION) in LDFLAGS, a smoke target (make build then\n./bin/adguard-reward --config missing.yaml must exit 1), and dev passes --config config.yaml.\ndeploy/Dockerfile CMD drops the explicit --config so an env-only container start does not hit\nthe locked config_path missing-explicit-path error (a mounted /data/config.yaml is passed by\nthe operator). Delete envOr and TestEnvOr. Replace the example config's \"see docs/\" header with\nthe env-naming rule and the *_file keys (comment only, no key changes)."
  covers = ["c-1", "c-2", "c-7"]
  depends_on = ["t-1", "t-3", "t-5"]
  test_contract = ["if missing required config stops exiting non-zero, TestRun_MissingKey fails: run with --config at a temp yaml lacking adguard.password returns 1 with stderr containing adguard.password; env-only run lacking ADGUARD_REWARD_ADGUARD_URL returns 1 with stderr containing adguard.url", "if the explicit-vs-default path rule breaks in main, TestRun_ConfigPath fails: --config /nonexistent/config.yaml returns 1 with stderr containing that path; no --config, no config.yaml beside the test binary, three ADGUARD_REWARD_ADGUARD_* env vars set proceeds to the probe (fake records /control/status)", "if a rejected service credential stops being fatal, TestRun_StartupUnauthorized fails: SetStatus(/control/status, 401) makes run return 1 with stderr containing rejected, adguard.username and the AdGuard URL, and not the password", "if an unreachable AdGuard becomes fatal, TestRun_StartupUnreachable fails: SetStatus(/control/status, 503) does not make run return; onListen fires (waited on a channel, generous timeout); GET /healthz yields 200 with adguard == unreachable; cancelling ctx makes run return 0", "if healthz wiring breaks, TestRun_Healthz fails: fake healthy yields /healthz adguard == ok, adguard_version == the fixture value, version == test-1 (test sets the package var), Content-Type application/json", "if any startup or request log leaks a secret, TestRun_NoSecretsInLogs fails: yaml password pw-CANARY-9f3a, ai.api_key sk-CANARY-77b1, ADGUARD_REWARD_LOG_LEVEL=debug, stderr captured through startup and one /healthz request contains listening and /control/status (positive control) and none of pw-CANARY-9f3a, sk-CANARY-77b1, base64(svc:pw-CANARY-9f3a)", "if version stops being ldflags-bindable, TestVersionVar fails: main_test.go takes &version so a const or removed var no longer compiles", "if the Dockerfile regains an explicit --config, TestDockerfileCMD fails: deploy/Dockerfile CMD line does not contain --config"]
  status = "pending"
