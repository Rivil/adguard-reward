[[criterion]]
  id = "c-2"
  status = "covered"
  tests = ["internal/auth/auth_test.go:TestIssue_Token", "internal/auth/auth_test.go:TestCookie_Attrs", "cmd/adguard-reward/main_test.go:TestRun_CookieSecure", "cmd/adguard-reward/main_test.go:TestRun_TLS", "internal/api/login_test.go:TestLogin_NoTokenInLogs", "internal/auth/auth_test.go:TestNoTokenInLogs"]
  notes = "TestIssue_Token: 43-char strict base64url (32 bytes = 256 bits), two issues differ, stored TokenHash == sha256(raw), raw absent from the stored row. TestCookie_Attrs: HttpOnly, SameSite=Strict, Path=/, Secure only with the option. TestRun_TLS/TestRun_CookieSecure: Secure set on the TLS listener (and https base_url), not on plain. TestLogin_NoTokenInLogs: debug JSON log buffer across login -> GET /me -> POST /logout never contains the cookie value (with positive controls)."

