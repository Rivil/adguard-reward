  text = "stryker leg is measured for the first time this phase: [mutation.stryker] workdir = \"web\" in project.toml, @stryker-mutator/core + vitest-runner 9.6.1 as web devDependencies, web/stryker.config.mjs (explicit plugins list — pnpm's isolated store hides sibling plugins from the @stryker-mutator/* glob; concurrency 2 — more runners race on the sandbox's vite deps cache), and vite.config.ts server.fs.allow includes the real node_modules so @testing-library/svelte's noExternal setup file loads from the sandbox. Without the fs.allow fix the DOM suites failed to load in the sandbox while stryker still reported the dry run as succeeded (9 of 16 tests ran) — check 'Ran N tests' against pnpm test on every future run."

[[finding]]
  severity = "NOTE"
  text = "dross gap: the stryker adapter passes every changed .ts file to --mutate, including *.test.ts, vite.config.ts and main.ts (107 meaningless survivors on the first measured run). Worked around with '// Stryker disable all' headers on those five files (reported Ignored, not counted). gremlins never has this problem because go tooling excludes _test.go; the adapter should filter test sources the same way."

[[finding]]
  severity = "NOTE"
  text = "score 0.80 over 332 in-scope mutants: go 170/196 killed with all 26 not-covered accepted/routed (efficacy over reachable = 1.00); typescript 94/136 killed, 42 survived (38 unique) of which 6 accepted as equivalent, 13 routed, 19 unclassified."
