  notes = "TestRequireSession: no cookie / random / deleted / expired -> 401 and next never runs. TestRouter_Fallthrough: unknown /api/v1 path -> 401 without a cookie (catch-all), 404 with one. TestRun_Healthz: /healthz answers with no session on the wired binary. TestLogout_Replay: logout 204 with one Max-Age=0 Set-Cookie, replaying the old cookie -> 401. Server side is tight; see the FLAG on the SPA's logout() method (api.ts:125) — the client half is not pinned to POST."

