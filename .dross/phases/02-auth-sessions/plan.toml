[[task]]
  id = "t-9"
  wave = 3
  title = "Login, logout, me handlers with login event log"
  files = ["internal/api/login.go", "internal/api/login_test.go", "internal/api/api.go"]
  description = "POST /api/v1/login: body via http.MaxBytesReader(4 KiB) strict-decoded {username, password};\nmalformed JSON, unknown key, or empty field -> 400 bad_request with no AdGuard call, no budget\nconsumed and no login event. ip := Deps.ClientIP(r). Limiter.Check(ip) false -> 429\nrate_limited, Retry-After: <seconds>, outcome rate_limited, no AdGuard call (fast path).\nOtherwise acquire a single global in-flight slot (buffered chan of 1, select on r.Context())\nand run Limiter.Check(ip) AGAIN while holding it — a request that became limited while queued\nreturns 429 without calling AdGuard; this second check is what bounds a parallel burst to the\nbudget. The slot is held for the whole critical section and released (deferred) only after\nFail or Issue has run — releasing it as soon as AdGuard answers would let the next queued\nrequest pass its second Check before the failure is counted. Then call AdGuard.Login: nil ->\nauth.Issue, SetCookie, 204, outcome ok;\nErrBadCredentials -> Limiter.Fail(ip), 401 {bad_credentials, \"invalid username or password\"}\n(identical body for every rejection); anything else (StatusError 5xx, *url.Error,\nErrRateLimited) -> 502 {adguard_unavailable, \"AdGuard Home did not accept the login attempt —\ntry again shortly\"} (neutral: AdGuard may be down or throttling), outcome adguard_unreachable,\nno budget consumed. Every outcome logs exactly one Info line slog.Info(\"login\", \"event\",\n\"login\", \"username\", u, \"ip\", ip.String(), \"outcome\", o) — the password value is never an\nattr. POST /api/v1/logout (RequireSession): store.Delete(sess.ID), auth.Clear(w) (replaces\nthe refresh RequireSession wrote, so exactly one Set-Cookie goes out), 204. GET /api/v1/me\n(RequireSession): 200 {username, expires_at RFC3339}. Deps gains Auth *auth.Manager,\nLimiter *ratelimit.Limiter, Sessions auth.SessionStore. Routes mounted in api.go inside the\nt-5 chain, plus a catch-all \"/api/v1/\" ->\nRequireSession(http.NotFoundHandler()) so an unknown path is 401 without a session and 404\nwith one. Tests run against store.Open in t.TempDir(), the adguardtest fake, a fake clock\nshared by Manager and Limiter, and a JSON slog handler into a buffer.\n"
  covers = ["c-1", "c-2", "c-3", "c-4", "c-6", "c-8", "c-10", "c-11"]
  depends_on = ["t-2", "t-3", "t-4", "t-5", "t-6"]
  test_contract = ["if the login round-trip breaks, TestLogin_OK fails: fake AdGuard with Options{User:'mum',Pass:'pw'}; POST /api/v1/login {'username':'mum','password':'pw'} with the header -> 204, Set-Cookie named adguard_reward_session with HttpOnly/SameSite=Strict/Path=/; the fake's recorded /control/login body decodes to {name: mum, password: pw} with no Authorization header", "if the credential/transport split breaks, TestLogin_Outcomes fails: right creds -> 204 with a Set-Cookie for adguard_reward_session; wrong password -> 401 body exactly {error: bad_credentials, message: 'invalid username or password'}; fake SetStatus(/control/login, 503) -> 502 with error adguard_unavailable; fake Close()d -> 502 adguard_unavailable; fake SetStatus(/control/login, 429) -> 502, not 401; the 502 message does not contain the word 'unreachable'", "if the fake is called while limited, TestLogin_RateLimited fails: 5 wrong-password posts from 203.0.113.1, then the fake's Requests() /control/login count is snapshotted; 3 more posts each return 429 with a numeric Retry-After >= 1 and the count is unchanged; a post from 203.0.113.2 still reaches the fake", "if successes or 502s consume budget, TestLogin_BudgetOnlyOnFailure fails: 4 failures + 10 successes + 3 fake-503 outcomes from one IP leave the next wrong-password post reaching the fake (401, not 429)", "if a parallel burst overruns the budget, TestLogin_Burst fails: Hang(/control/login, 30ms), 12 concurrent wrong-password posts from one IP yield exactly 5 recorded /control/login hits and 7 responses of 429", "if the global limit is not wired, TestLogin_Global fails: 20 wrong-password posts from 20 distinct IPs (via a stub ClientIP reading a test header) make a 21st IP's post 429 with no new fake hit", "if the escalation is not surfaced through Retry-After, TestLogin_RetryAfterEscalates fails (Manager and Limiter share a fake clock): trip #1 Retry-After '60'; advance 61s, trip #2 -> '120'; advance 30s -> '90'", "if trusted_proxies is ignored at the HTTP layer, TestLogin_ProxiedIP fails: trusted [127.0.0.0/8], RemoteAddr 127.0.0.1, XFF '198.51.100.7': 5 failures lock out XFF 198.51.100.7 but XFF 198.51.100.8 from the same peer is still 401 (not 429); with trusted nil, the same two XFF values share one budget (the 6th is 429)", "if the event line breaks or leaks, TestLogin_EventLog fails: one line with event=login and the matching outcome exists for each of ok, bad_credentials, adguard_unreachable, rate_limited, with username and ip attrs; the captured Debug-level buffer never contains the submitted password 'pw-CANARY-4c1e'", "if the raw token reaches any log, TestLogin_NoTokenInLogs fails: Debug-level buffer across login -> GET /me -> POST /logout contains '/control/login' and event=login (positive control) and never the cookie value from Set-Cookie", "if logout does not revoke server-side, TestLogout_Replay fails: login, logout (204, exactly one Set-Cookie header for adguard_reward_session and it has Max-Age=0), then GET /me with the old cookie -> 401", "if /me or the auth gate breaks, TestMe fails: with cookie -> 200 {username == fake user, expires_at parses and is ~ now+30d}; without cookie -> 401 unauthorized; both responses carry Cache-Control: no-store", "if bad bodies reach AdGuard, TestLogin_BadBody fails: '{', {'username':'a'}, {'username':'','password':''}, a 5 KiB body and {'username':'a','password':'b','extra':1} each -> 400 with zero fake hits and no event=login line", "if the CSRF ordering is lost on the real route, TestLogin_CSRF fails: a well-formed login POST without X-Requested-With -> 403 with zero fake hits; the same with the header -> 204", "if the router lets unknown or unauthenticated routes through, TestRouter_Fallthrough fails: GET /api/v1/does-not-exist without a cookie -> 401 (not 404); with a cookie -> 404; GET /healthz through api.Handler() returns 404 (Handler only mounts /api/v1/)"]
  status = "done"

