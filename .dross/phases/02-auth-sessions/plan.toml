[[task]]
  id = "t-1"
  wave = 1
  title = "Found internal/store: open, pragmas, migrations"
  files = ["internal/store/store.go", "internal/store/migrate.go", "internal/store/migrations/0001_sessions.sql", "internal/store/store_test.go", "go.mod", "go.sum"]
  description = "Add modernc.org/sqlite. store.Open(dataDir string, log *slog.Logger) (*Store, error):\nMkdirAll(dataDir, 0o700), opens <dataDir>/adguard-reward.db with _pragma=journal_mode(WAL),\nbusy_timeout(5000), foreign_keys(ON), synchronous(NORMAL); db.SetMaxOpenConns(1) so modernc\nnever sees two writers. The DB file (and its -wal / -shm siblings once they exist) is\nchmod'd to 0600 after the first Ping, so the umask never leaves it world-readable\n(PLAN.md specifies 0600). Migrations are go:embed'd *.sql files applied in name order, each in\nits own transaction, tracked in schema_migrations(name TEXT PRIMARY KEY, applied_at INTEGER);\na failing statement rolls back that migration and Open returns an error naming the file.\n0001_sessions.sql: sessions(id INTEGER PRIMARY KEY, username TEXT NOT NULL, token_hash BLOB\nNOT NULL UNIQUE, created_at INTEGER NOT NULL, last_seen_at INTEGER NOT NULL, expires_at\nINTEGER NOT NULL) + index on (username), index on (expires_at). id is the SQLite rowid, not a\nrandom hex string. Store exposes DB() *sql.DB for the query files, Close(), and Migrations()\n[]string. Errors from Open name data_dir so the operator sees the config key. The migration\nrunner takes its fs.FS as a parameter (default: the embedded FS) so TestMigrate_Order can\ninject a stub.\n"
  covers = ["c-3", "c-9"]
  test_contract = ["if MaxOpenConns/busy_timeout are dropped, TestOpen_ConcurrentWriters fails: 20 goroutines each doing 20 INSERTs into a scratch table under go test -race finish with zero errors (no SQLITE_BUSY / 'database is locked')", "if migrations are re-run on reopen, TestOpen_Idempotent fails: Open, Close, Open on the same dir succeeds and schema_migrations has exactly one row per embedded file", "if a failing migration leaves partial state, TestMigrate_Rollback fails: an injected migration whose second statement is invalid SQL makes Open error naming that file, and the table its first statement created does not exist afterwards", "if the schema drifts, TestSchema_Sessions fails: PRAGMA table_info(sessions) lists exactly id, username, token_hash, created_at, last_seen_at, expires_at with the stated types and NOT NULL flags, id being INTEGER PRIMARY KEY; PRAGMA index_list shows token_hash UNIQUE", "if data_dir handling breaks, TestOpen_DataDir fails: a nonexistent nested dir is created with mode 0700; adguard-reward.db has mode 0600 after Open even under umask 0000; a data_dir that is a regular file errors containing 'data_dir'", "if the WAL pragma is lost, TestOpen_Pragmas fails: PRAGMA journal_mode returns 'wal' and PRAGMA foreign_keys returns 1", "if a migration is skipped or applied out of order, TestMigrate_Order fails: an embedded-FS stub with 0002 before 0001 in insertion order still lands 0001 first (schema_migrations rows are the file names 0001..., 0002... in applied order)"]
  status = "done"

[[task]]
  id = "t-2"
  wave = 1
  title = "Login rate limiter with escalating lockout"
  files = ["internal/ratelimit/limiter.go", "internal/ratelimit/limiter_test.go"]
  description = "ratelimit.New(Config{PerIPFailures: 5, Window: 1m, BaseLockout: 1m, MaxLockout: 1h,\nEscalationReset: 1h, GlobalFailures: 20, Now func() time.Time}) *Limiter. Check(ip) (allowed\nbool, retryAfter time.Duration) and Fail(ip) under one sync.Mutex. Per IP: failures counted in\na fixed 1-minute window that starts at the first failure after the previous window or lockout\nended (not calendar-aligned, not sliding); recording the 5th failure trips the IP: trips++\nfirst, then shift := min(trips-1, 6) (clamped so the shift can never overflow int64 however\nmany trips accumulate), lockedUntil = now + min(BaseLockout<<shift, MaxLockout); the failure\ncounter clears when the lockout ends. Escalation reset is anchored at lockout expiry: on Check/Fail, an IP\nwhose lockedUntil is >= EscalationReset in the past (and has not tripped since) has trips\nreset to 0 — an IP cannot \"go 1h without a trip\" while it is locked out, so the 1h cap is\nsticky for an attacker who retries as soon as each lockout ends. Global: one fixed 1-minute\nwindow (same first-failure anchor); the 20th failure denies every IP until the window ends,\nnever escalates. retryAfter is ceil'd to whole seconds and >= 1s whenever allowed==false.\nPrune() (also run lazily inside Fail) drops IPs with no active lockout, no failures in the\ncurrent window and lockedUntil older than EscalationReset. Len() for tests. There is no Success or\nRejected method: only Fail consumes budget, so successes and 429s cannot count by\nconstruction. No logging, no net/http — pure policy with an injected clock.\n"
  covers = ["c-4", "c-11"]
  test_contract = ["if the trip threshold is off by one, TestPerIP_Threshold fails: 5 Fail() calls within 1m leave Check false (retryAfter 60s); 4 Fail() calls leave Check true", "if doubling or the cap breaks, TestPerIP_Doubling fails: with a fake clock, tripping the same IP repeatedly immediately after each unlock yields lockouts of exactly 1m, 2m, 4m, 8m, 16m, 32m, 1h, 1h (capped); continuing to trip #40 still yields exactly 1h each time (no shift overflow, lockedUntil never in the past)", "if escalation never resets, TestPerIP_Reset fails: after a 4m trip, advancing 1h past the lockout's end with no failures and tripping again yields a 1m lockout, not 8m", "if Retry-After does not track the current window, TestPerIP_RetryAfter fails: during a 4m lockout Check at +90s returns retryAfter == 150s; at +239.2s returns 1s (ceil), never 0", "if the global limit escalates or is miscounted, TestGlobal_Flat fails: 20 failures spread over 20 distinct IPs deny a 21st fresh IP with retryAfter == remaining window; after the window, 20 more failures deny again with a 1m-bounded retryAfter (no doubling)", "if the failure counter survives a lockout, TestPerIP_ClearOnUnlock fails: after a lockout ends, a single Fail() does not re-lock (needs 5 fresh failures)", "if pruning breaks, TestPrune fails: 100 IPs tripped once (1m lockouts), clock advanced 1h + 2m, Prune() leaves Len() == 0; an IP still inside a 1h lockout survives Prune()", "if the mutex is removed, TestLimiter_Race fails under go test -race: 50 goroutines interleaving Check/Fail on 5 IPs", "if the reset is missing or too eager, TestLimiter_Reset fails (reset is anchored at lockout expiry, not at the trip): after trip #3 (4m lockout) at time L, advance to L+4m+59m59s and trip again -> 8m (no reset); in a fresh limiter reach a 4m lockout at L, advance to L+4m+1h and trip -> 1m (reset); after a 1h lockout ending at E, tripping at E+1s -> 1h again (cap is sticky)", "if the window is calendar-aligned instead of first-failure-anchored, TestPerIP_WindowAnchor fails: 4 failures at t, then 4 more at t+59s trip the IP on the 5th cumulative failure (t+59s is inside the window that opened at t); 4 failures at t and 1 at t+61s do not trip", "if rate-limited or successful attempts consume budget, TestLimiter_BudgetIsFailuresOnly fails: 100 Check calls with no Fail never block; 4 failures then 50 Check calls still allowed (compile-level: no Success/Rejected method exists)"]
  status = "done"

[[task]]
  id = "t-3"
  wave = 1
  title = "trusted_proxies config and client IP resolver"
  files = ["internal/config/config.go", "internal/config/config_test.go", "internal/config/testdata/full.yaml", "deploy/config.example.yaml", "internal/api/clientip.go", "internal/api/clientip_test.go"]
  description = "Config gains TrustedProxies []string `yaml:\"trusted_proxies\"`; env row\nADGUARD_REWARD_TRUSTED_PROXIES splits on commas (trimmed, empties dropped; set-but-empty ->\nempty list). validate() parses every entry with net.ParseCIDR (a bare IP is accepted as /32 or\n/128) and errors naming trusted_proxies and the bad entry. Config.TrustedProxyNets()\n[]*net.IPNet. validate() also gains the TLS both-or-neither rule: tls.cert set without\ntls.key (or vice versa) errors naming both keys, alongside the existing password /\npassword_file cross-field check — main (t-11) then only reads cfg.TLS. TestEnvTable's\nset-every-var round-trip (which sets each var to \"v:<key>\") gains an override of\nADGUARD_REWARD_TRUSTED_PROXIES to \"\" in its mergeMaps block, since \"v:trusted_proxies\" would\nfail CIDR validation; TestLoad_Full's pinned want struct gains the TrustedProxies value\nadded to full.yaml. api.ClientIP(trusted []*net.IPNet)\nfunc(*http.Request) netip.Addr: peer = host of r.RemoteAddr (port stripped, IPv6 brackets\nremoved, zone dropped, 4-in-6 mapped addresses unmapped). With an empty list or a peer outside\nevery net, X-Forwarded-For is ignored. Otherwise the XFF hops (all header values concatenated\nin order) are walked right to left; the first hop not inside a trusted net is the client; if\nevery hop is trusted or a hop fails to parse, fall back to the peer. Unparseable RemoteAddr ->\nnetip.Addr{} and the caller keys on \"invalid\" (no panic). config.example.yaml gains\n`trusted_proxies: []` with a one-line comment on X-Forwarded-For; full.yaml gains the key.\n"
  covers = ["c-4"]
  test_contract = ["if the reflection env-table test is bypassed, TestEnvTable fails: the want map gains trusted_proxies -> ADGUARD_REWARD_TRUSTED_PROXIES and walkLeaves reports the new []string leaf", "if list parsing breaks, TestLoad_TrustedProxies fails: yaml list [10.0.0.0/8, ::1] loads both; env '10.0.0.1, 192.168.0.0/16' yields [10.0.0.1/32, 192.168.0.0/16]; env set to '' yields an empty list overriding yaml", "if validation stops naming the key, TestLoad_TrustedProxiesInvalid fails: entry '10.0.0.0/33' and entry 'proxy' each error containing trusted_proxies and the entry", "if the TLS pair rule is missing, TestLoad_TLSPair fails: tls.cert set without tls.key errors containing both 'tls.cert' and 'tls.key'; tls.key alone errors the same way; both set or both empty load cleanly", "if XFF is honoured without opt-in, TestClientIP_Spoof fails: no trusted nets, RemoteAddr 203.0.113.9:4444, XFF '1.2.3.4' -> 203.0.113.9", "if hop selection breaks, TestClientIP_Proxied fails: trusted [10.0.0.0/8], RemoteAddr 10.0.0.5:1, XFF '1.2.3.4, 5.6.7.8, 10.0.0.7' -> 5.6.7.8; XFF '10.0.0.7' (all trusted) -> 10.0.0.5; XFF 'garbage, 10.0.0.7' -> 10.0.0.5; untrusted peer 198.51.100.2 with the same XFF -> 198.51.100.2; two separate XFF header lines '1.2.3.4' and '5.6.7.8' -> 5.6.7.8", "if IPv6 handling breaks, TestClientIP_V6 fails: RemoteAddr '[2001:db8::1]:5' -> 2001:db8::1; '[fe80::1%eth0]:5' -> fe80::1; RemoteAddr '[::ffff:10.0.0.2]:80' matches trusted 10.0.0.0/8", "if a bad RemoteAddr panics, TestClientIP_Malformed fails: RemoteAddr 'pipe' and 'nonsense' each return an invalid Addr and no panic", "if the example config drifts from the loader, TestExampleConfigLoads fails: config.Load('../../deploy/config.example.yaml') with only the three required ADGUARD_REWARD_ADGUARD_* env vars set succeeds and TrustedProxyNets() is empty"]
  status = "done"

[[task]]
  id = "t-4"
  wave = 1
  title = "Session tokens, cookie policy, RequireSession middleware"
  files = ["internal/auth/token.go", "internal/auth/auth.go", "internal/auth/middleware.go", "internal/auth/auth_test.go"]
  description = "auth.SessionStore interface: Insert(ctx, Session) (id int64, err error); ByTokenHash(ctx,\n[32]byte) (Session, error) returning ErrNotFound; Touch(ctx, id int64, lastSeen, expires\ntime.Time) error; Delete(ctx, id int64) error; ListByUser(ctx, user) ([]Session, error);\nDeleteByUser(ctx, user, id int64) (bool, error); DeleteOthers(ctx, user, keepID int64) (int,\nerror); DeleteExpired(ctx, now) (int, error). Session{ID int64, Username, TokenHash, CreatedAt,\nLastSeenAt, ExpiresAt}. Tests use an in-package fake SessionStore; the SQLite implementation\nlands in t-6. auth.New(store, Options{Secure bool, Lifetime: 30*24h, Now func() time.Time,\nLog}) *Manager. Issue(ctx, username) (rawToken string, Session, error): 32 bytes crypto/rand\n-> base64.RawURLEncoding (43 chars); ID is assigned by the store (rowid); only sha256(raw) is\nstored. Authenticate(ctx, raw) (Session, error): decode with base64.RawURLEncoding.Strict()\nand reject anything that is not exactly 32 decoded bytes (non-strict decoding ignores the\nfinal character's two padding bits, which would let two distinct strings name one session)\n-> hash -> ByTokenHash; ExpiresAt <=\nnow -> Delete + ErrNoSession; otherwise Touch(now, now+Lifetime) and return the refreshed\nsession (sliding, on every request per the locked decision, no coalescing). Cookie(raw)\n*http.Cookie: Name \"adguard_reward_session\", HttpOnly, SameSite=Strict, Path=/,\nSecure=Options.Secure, MaxAge = Lifetime seconds. ClearCookie() same attrs with MaxAge -1.\nSetCookie(w, c) / Clear(w) are the only writers: both first delete any existing Set-Cookie\nheader for adguard_reward_session from w.Header() before http.SetCookie, so a handler that\nclears the cookie after RequireSession refreshed it leaves exactly one Set-Cookie on the\nresponse. RequireSession(next) http.Handler: missing/invalid cookie -> 401 via the injected\nerrorWriter (func(w, status, code, msg)) so the JSON envelope stays in internal/api, plus\nClear(w) when a cookie was present; success re-issues Cookie(raw) via SetCookie with a fresh\nMaxAge (so the browser's expiry slides with the server's) and puts the Session in ctx\n(auth.FromContext). RunSweeper(ctx, interval) calls DeleteExpired on a ticker. The raw token is never passed to\nslog; Session has no field holding it and Session.LogValue() emits only id and username.\n"
  covers = ["c-2", "c-3", "c-6"]
  test_contract = ["if token entropy or the hash-only rule breaks, TestIssue_Token fails: two Issue() calls return distinct 43-char base64url tokens; the fake store's inserted TokenHash equals sha256(raw) and no stored field equals raw", "if cookie attributes drift, TestCookie_Attrs fails: Secure=false gives HttpOnly, SameSite=Strict, Path=/, no Secure; Secure=true adds Secure; ClearCookie has MaxAge -1 and identical Name/Path", "if the cookie writers append instead of replace, TestSetCookie_Single fails: SetCookie then Clear on one ResponseWriter leaves exactly one Set-Cookie header for adguard_reward_session and it has Max-Age=0; an unrelated Set-Cookie header is untouched", "if sliding expiry breaks, TestAuthenticate_Sliding fails: Issue at t0, Authenticate at t0+29d -> ok and the fake store's Touch recorded expires == t0+59d; Authenticate at t0+58d+23h -> ok and Touch recorded expires == t0+88d+23h; then a 31-day gap -> ErrNoSession and the fake store recorded Delete(id)", "if expiry is not enforced, TestAuthenticate_Expired fails: Issue at t0, Authenticate at t0+30d+1s -> ErrNoSession", "if a revoked session is still accepted, TestAuthenticate_Revoked fails: Issue, store.Delete(id), Authenticate -> ErrNoSession", "if a tampered token is accepted, TestAuthenticate_Garbage fails: '', 'notbase64!', a 44-char token, a valid-looking token from another Manager, raw with character 10 flipped, and raw with its final character's low padding bits changed (e.g. trailing 'A' -> 'B') each yield ErrNoSession with no Touch call", "if the middleware leaks through, TestRequireSession fails: a spy next handler sees zero calls for (no cookie), (cookie with random value), (cookie from a session deleted via store.Delete), and all three get 401 application/json; the deleted-session response carries a Set-Cookie clearing the cookie; expired -> 401; a valid cookie reaches next once with auth.FromContext(r.Context()).Username == the issued username and the response carries a refreshed Set-Cookie with Max-Age=2592000", "if the token reaches the logs, TestNoTokenInLogs fails: a Debug-level JSON slog handler into a buffer across Issue, Authenticate, RequireSession and a slog.Info('s', 'session', sess) contains the session id (positive control) and never the raw token or its base64url/hex hash", "if the sweeper stops running, TestRunSweeper fails: RunSweeper(ctx, 5ms) records >= 2 DeleteExpired calls on the fake store within 100ms and returns on cancel"]
  status = "done"

[[task]]
  id = "t-5"
  wave = 1
  title = "API router skeleton, CSRF header, no-store, error envelope"
  files = ["internal/api/api.go", "internal/api/middleware.go", "internal/api/errors.go", "internal/api/middleware_test.go"]
  description = "api.New(Deps) *API with Handler() http.Handler. Deps is declared now but typed only against\napi-local interfaces so this task compiles with no import of internal/store, internal/auth\nor internal/ratelimit (it runs in parallel with them): AdGuard interface{ Login(ctx, u, p)\nerror }, ClientIP func(*http.Request) netip.Addr, Log *slog.Logger; the Auth / Limiter /\nSessions fields are added by t-9 and t-10 when those packages exist. Handler() =\nnoStore(csrf(mux)) mounted under /api/v1/ so the chain wraps 404s and 405s too. noStore sets\nCache-Control: no-store before calling next (header set first, so every path incl. errors\ncarries it; in-house handlers never set Cache-Control themselves). csrf: methods other than\nGET/HEAD/OPTIONS require X-Requested-With == \"adguard-reward\" (exact, case-sensitive value)\nelse 403 forbidden before any route matches. errors.go: writeError(w, status, code, message)\nemits application/json {\"error\": code, \"message\": message}; codes: bad_request,\nunauthorized, forbidden, bad_credentials, adguard_unavailable, rate_limited, not_found.\nunauthorizedWriter(w, status, code, msg) is the func value t-9 hands to\nauth.RequireSession's errorWriter option. No business routes yet — the test mounts a stub\nroute via API.mux for ordering assertions. The \"/api/v1/\" catch-all ->\nRequireSession(NotFound) lands in t-9.\n"
  covers = ["c-5", "c-10"]
  test_contract = ["if the CSRF check misses a method, TestCSRF_Methods fails: POST, PUT, PATCH, DELETE to a stub /api/v1/x without the header -> 403 and the stub never runs; GET, HEAD, OPTIONS without the header reach the stub; POST with the header reaches it", "if the header value is loosely matched, TestCSRF_Value fails: 'AdGuard-Reward', 'adguard-reward ' and 'XMLHttpRequest' are all 403", "if the check runs after the route, TestCSRF_BeforeHandler fails: POST to an unmounted /api/v1/nope without the header is 403 (not 404); a stub that panics is never reached", "if no-store is set inside handlers instead of the outer layer, TestNoStore fails: the 403 from csrf, an unmounted /api/v1/ path (asserting only the header, not the status — t-9's catch-all later turns this 404 into a 401), a 405 from the mux and a 200 stub all carry Cache-Control: no-store", "if the envelope drifts, TestWriteError fails: writeError(w, 401, 'unauthorized', 'm') yields status 401, Content-Type application/json and body decoding to exactly {error: unauthorized, message: m}"]
  status = "done"

[[task]]
  id = "t-6"
  wave = 2
  title = "Sessions queries implementing auth.SessionStore"
  files = ["internal/store/sessions.go", "internal/store/sessions_test.go"]
  description = "*store.Store implements every auth.SessionStore method with parameterised SQL over the 0001\ntable; times stored as Unix seconds UTC; Insert returns LastInsertId as the session id.\nByTokenHash returns auth.ErrNotFound (not sql.ErrNoRows) on miss. DeleteByUser deletes only\nwhen both username and id match, returning whether a row went. DeleteOthers deletes the user's\nrows except keepID and returns the count. ListByUser orders by created_at ASC then id.\nDeleteExpired removes expires_at <= now. A compile-time `var _ auth.SessionStore =\n(*Store)(nil)` pins the contract.\n"
  covers = ["c-3", "c-9"]
  depends_on = ["t-1", "t-4"]
  test_contract = ["if the compile-time assertion is dropped, the package no longer proves the interface: sessions_test.go references auth.SessionStore via the var line so a signature drift fails `go vet ./...`", "if the unique constraint is lost, TestSessions_UniqueHash fails: two Inserts with the same TokenHash — the second errors and ListByUser shows one row", "if cross-user revocation is possible, TestSessions_DeleteByUser fails: DeleteByUser('bob', aliceID) returns false and alice's row remains; DeleteByUser('alice', aliceID) returns true", "if revoke-all keeps the wrong row, TestSessions_DeleteOthers fails: alice has 3 sessions, bob 1; DeleteOthers('alice', a2) returns 2, ListByUser('alice') == [a2], bob's row untouched", "if Touch stops writing both columns, TestSessions_Touch fails: after Touch(id, ls, ex), ByTokenHash returns LastSeenAt == ls and ExpiresAt == ex to the second", "if expiry sweep is off by one, TestSessions_DeleteExpired fails: rows expiring at t, t+1s with now = t deletes exactly one (the <= row)", "if sessions do not survive a restart, TestSessions_Persist fails: Insert, Close, Open same dir, ByTokenHash returns the row with all fields equal", "if a miss is reported as a driver error, TestSessions_NotFound fails: ByTokenHash(unknown) yields errors.Is(err, auth.ErrNotFound)"]
  status = "done"

[[task]]
  id = "t-7"
  wave = 2
  title = "SPA fetch layer with CSRF header and 401 routing"
  files = ["web/src/lib/api.ts", "web/src/lib/api.test.ts", "web/package.json", "web/pnpm-lock.yaml", "web/vite.config.ts", "Makefile"]
  description = "api.ts exports request<T>(method, path, body?) that always sends credentials: 'same-origin'\nand X-Requested-With: adguard-reward, parses the {error, message} envelope into\nApiError{status, code, message, retryAfter?} (Retry-After header read on 429), and on 401 for\nany path other than /api/v1/login invokes an injectable onUnauthorized() (default: navigate to\n/login) exactly once per response. Typed helpers login(u, p), logout(), me(), plus a route\nstore (writable<'login'|'home'>) driven by location.pathname and history.pushState. Adds\nvitest (devDependency, `test` script \"vitest run\", vite.config.ts test.environment = 'node')\nand Makefile targets test-go (go test -race ./...) and test-web (cd web && pnpm test) with\n`test` depending on both, so a broken fetch layer fails the phase gate. Adding vitest changes\npnpm-lock.yaml (run `pnpm install`), and from this task on `make test` needs web/node_modules\nin every environment that runs the gate, CI included. The depends_on t-5 is a deliberate\ncontract freeze — nothing here imports Go — so the envelope shape, header value and\nRetry-After convention are settled before the client that consumes them is written.\n"
  covers = ["c-5", "c-7"]
  depends_on = ["t-5"]
  test_contract = ["if the CSRF header is dropped, api.test.ts 'sends X-Requested-With' fails: a mocked fetch sees the header on POST login and on GET me", "if 401 handling loops, api.test.ts '401 on /login does not redirect' fails: a 401 from /api/v1/login resolves to ApiError{code: bad_credentials} and onUnauthorized is not called; a 401 from /api/v1/me calls it exactly once", "if 502 and 401 collapse, api.test.ts 'distinguishes adguard_unavailable' fails: a 502 {error: adguard_unavailable} yields ApiError.code adguard_unavailable, a 401 {error: bad_credentials} yields bad_credentials, and the two messages differ", "if Retry-After is ignored, api.test.ts '429 carries retryAfter' fails: a 429 with Retry-After: 120 yields ApiError.retryAfter === 120", "if login stops posting JSON credentials, api.test.ts 'login posts credentials' fails: login('a','b') calls fetch with method POST to /api/v1/login, Content-Type application/json and body '{\"username\":\"a\",\"password\":\"b\"}'", "if the web tests fall out of the gate, `make test` no longer runs `pnpm test`: the Makefile test target's prerequisites include test-web"]
  status = "done"

