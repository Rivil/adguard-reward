    "if the credential/transport split breaks, TestLogin_Outcomes fails: right creds -> 204 with a Set-Cookie for adguard_reward_session; wrong password -> 401 body exactly {error: bad_credentials, message: 'invalid username or password'}; fake SetStatus(/control/login, 503) -> 502 with error adguard_unavailable; fake Close()d -> 502 adguard_unavailable; fake SetStatus(/control/login, 429) -> 502, not 401; the 502 message does not contain the word 'unreachable'",
    "if the fake is called while limited, TestLogin_RateLimited fails: 5 wrong-password posts from 203.0.113.1, then the fake's Requests() /control/login count is snapshotted; 3 more posts each return 429 with a numeric Retry-After >= 1 and the count is unchanged; a post from 203.0.113.2 still reaches the fake",
    "if successes or 502s consume budget, TestLogin_BudgetOnlyOnFailure fails: 4 failures + 10 successes + 3 fake-503 outcomes from one IP leave the next wrong-password post reaching the fake (401, not 429)",
    "if a parallel burst overruns the budget, TestLogin_Burst fails: Hang(/control/login, 30ms), 12 concurrent wrong-password posts from one IP yield exactly 5 recorded /control/login hits and 7 responses of 429",
    "if the global limit is not wired, TestLogin_Global fails: 20 wrong-password posts from 20 distinct IPs (via a stub ClientIP reading a test header) make a 21st IP's post 429 with no new fake hit",
    "if the escalation is not surfaced through Retry-After, TestLogin_RetryAfterEscalates fails (Manager and Limiter share a fake clock): trip #1 Retry-After '60'; advance 61s, trip #2 -> '120'; advance 30s -> '90'",
    "if trusted_proxies is ignored at the HTTP layer, TestLogin_ProxiedIP fails: trusted [127.0.0.0/8], RemoteAddr 127.0.0.1, XFF '198.51.100.7': 5 failures lock out XFF 198.51.100.7 but XFF 198.51.100.8 from the same peer is still 401 (not 429); with trusted nil, the same two XFF values share one budget (the 6th is 429)",
    "if the event line breaks or leaks, TestLogin_EventLog fails: one line with event=login and the matching outcome exists for each of ok, bad_credentials, adguard_unreachable, rate_limited, with username and ip attrs; the captured Debug-level buffer never contains the submitted password 'pw-CANARY-4c1e'",
    "if the raw token reaches any log, TestLogin_NoTokenInLogs fails: Debug-level buffer across login -> GET /me -> POST /logout contains '/control/login' and event=login (positive control) and never the cookie value from Set-Cookie",
    "if logout does not revoke server-side, TestLogout_Replay fails: login, logout (204, exactly one Set-Cookie header for adguard_reward_session and it has Max-Age=0), then GET /me with the old cookie -> 401",
    "if /me or the auth gate breaks, TestMe fails: with cookie -> 200 {username == fake user, expires_at parses and is ~ now+30d}; without cookie -> 401 unauthorized; both responses carry Cache-Control: no-store",
