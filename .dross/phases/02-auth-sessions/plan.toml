  description = "After the startup probe: store.Open(cfg.DataDir) (error -> Error log naming data_dir, return\n1); ratelimit.New with the locked thresholds; tlsOn := cfg.TLS.Cert != \"\" (config.validate in\nt-3 already guarantees both-or-neither, so main only reads it); auth.New(store, Secure: tlsOn\n|| strings.HasPrefix(cfg.BaseURL, \"https://\")); api.New with\nClientIP built from cfg.TrustedProxyNets() and AdGuard = the phase-01 client;\nmux.Handle(\"/api/v1/\", api.Handler()); go auth.RunSweeper(ctx, sweepInterval) where `var\nsweepInterval = time.Hour` is a new package var (probeInterval is a const, so there is no\nexisting var pattern — this introduces one so tests can lower it); srv.ServeTLS(ln, cert, key)\nwhen tlsOn, srv.Serve otherwise, and the \"listening\" line gains tls=<bool>; store.Close after\nServe returns. /healthz stays on the plain mux outside the API chain. main_test's writeConfig\nhelper adds data_dir: <t.TempDir()> so no existing test writes ./data, and gains a login helper\nposting with the CSRF header against a running run().\n"
  covers = ["c-1", "c-2", "c-3", "c-10"]
  depends_on = ["t-1", "t-2", "t-3", "t-9"]
  test_contract = ["if sessions do not survive a restart, TestRun_SessionSurvivesRestart fails: start run() with data_dir in t.TempDir(), login, GET /me 200, cancel ctx (run returns 0), start run() again on the same dir and port, GET /me with the same cookie -> 200", "if the Secure flag is not derived from base_url, TestRun_CookieSecure fails: plain config -> Set-Cookie lacks Secure; config with base_url https://... and no TLS -> Secure present", "if Secure does not follow TLS or the TLS listener is not wired, TestRun_TLS fails: a self-signed cert/key pair generated in the test, tls.cert/tls.key set -> run listens and an https client with InsecureSkipVerify gets a 204 login whose Set-Cookie has Secure; the plain-http config's cookie lacks Secure; tls.cert set without tls.key -> run returns 1 with stderr containing tls.key (the config-load error surfacing through main)", "if the API chain is mounted wrong, TestRun_ApiChain fails: POST /api/v1/login without the header -> 403; GET /api/v1/me without cookie -> 401 with Cache-Control: no-store; GET /healthz without cookie -> 200 (still open)", "if a failed store open is not fatal, TestRun_StoreOpenFails fails: data_dir pointing at a regular file makes run return 1 with stderr containing data_dir", "if the limiter or client IP are not plumbed, TestRun_RateLimitWired fails: 6 wrong-password logins over the real listener -> the 6th is 429 with Retry-After and the fake recorded 5 /control/login hits", "if trusted_proxies is not plumbed through, TestRun_TrustedProxies fails: with trusted_proxies [127.0.0.0/8] and X-Forwarded-For: 203.0.113.7, five wrong logins -> the 6th is 429 and the login log lines carry ip=203.0.113.7; without trusted_proxies the same header leaves ip=127.0.0.1 in the log lines", "if any startup or request log leaks a secret, TestRun_NoSecretsInLogs (extended) fails: the existing canaries plus a login with password 'pw-LOGIN-CANARY-1d7f' and the resulting cookie value are absent from stderr at LOG_LEVEL=debug, while 'listening', '/control/login' and event=login are present", "if the sweeper is not started, TestRun_Sweeper fails: a session row inserted directly with expires_at in the past is gone from the DB within 2s when run() is started with the package var sweepInterval lowered by the test"]
  status = "done"

