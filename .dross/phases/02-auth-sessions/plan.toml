store.DeleteByUser(user, id): true -> 204 (and auth.Clear(w) when id is the caller's own, so
the response carries exactly one Set-Cookie, not the RequireSession refresh plus a clear); false
-> 404 not_found (never 403, so foreign ids are indistinguishable from unknown ones). POST
/api/v1/sessions/revoke-all -> DeleteOthers(user, current) -> 200 {revoked: n}. Tests log in
twice as the fake user and once as a second user (fake accepts one user, so the second
identity is inserted directly through the store).
