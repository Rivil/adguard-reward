[[task]]
  id = "t-1"
  wave = 1
  title = "Found internal/store: open, pragmas, migrations"
  files = ["internal/store/store.go", "internal/store/migrate.go", "internal/store/migrations/0001_sessions.sql", "internal/store/store_test.go", "go.mod", "go.sum"]
  description = """
Add modernc.org/sqlite. store.Open(dataDir string, log *slog.Logger) (*Store, error):
MkdirAll(dataDir, 0o700), opens <dataDir>/adguard-reward.db with _pragma=journal_mode(WAL),
busy_timeout(5000), foreign_keys(ON), synchronous(NORMAL); db.SetMaxOpenConns(1) so modernc
never sees two writers. The DB file (and its -wal / -shm siblings once they exist) is
chmod'd to 0600 after the first Ping, so the umask never leaves it world-readable
(PLAN.md specifies 0600). Migrations are go:embed'd *.sql files applied in name order, each in
its own transaction, tracked in schema_migrations(name TEXT PRIMARY KEY, applied_at INTEGER);
a failing statement rolls back that migration and Open returns an error naming the file.
0001_sessions.sql: sessions(id INTEGER PRIMARY KEY, username TEXT NOT NULL, token_hash BLOB
NOT NULL UNIQUE, created_at INTEGER NOT NULL, last_seen_at INTEGER NOT NULL, expires_at
INTEGER NOT NULL) + index on (username), index on (expires_at). id is the SQLite rowid, not a
random hex string. Store exposes DB() *sql.DB for the query files, Close(), and Migrations()
[]string. Errors from Open name data_dir so the operator sees the config key. The migration
runner takes its fs.FS as a parameter (default: the embedded FS) so TestMigrate_Order can
inject a stub.
"""
  covers = ["c-3", "c-9"]
  test_contract = [
    "if MaxOpenConns/busy_timeout are dropped, TestOpen_ConcurrentWriters fails: 20 goroutines each doing 20 INSERTs into a scratch table under go test -race finish with zero errors (no SQLITE_BUSY / 'database is locked')",
    "if migrations are re-run on reopen, TestOpen_Idempotent fails: Open, Close, Open on the same dir succeeds and schema_migrations has exactly one row per embedded file",
    "if a failing migration leaves partial state, TestMigrate_Rollback fails: an injected migration whose second statement is invalid SQL makes Open error naming that file, and the table its first statement created does not exist afterwards",
    "if the schema drifts, TestSchema_Sessions fails: PRAGMA table_info(sessions) lists exactly id, username, token_hash, created_at, last_seen_at, expires_at with the stated types and NOT NULL flags, id being INTEGER PRIMARY KEY; PRAGMA index_list shows token_hash UNIQUE",
    "if data_dir handling breaks, TestOpen_DataDir fails: a nonexistent nested dir is created with mode 0700; adguard-reward.db has mode 0600 after Open even under umask 0000; a data_dir that is a regular file errors containing 'data_dir'",
    "if the WAL pragma is lost, TestOpen_Pragmas fails: PRAGMA journal_mode returns 'wal' and PRAGMA foreign_keys returns 1",
    "if a migration is skipped or applied out of order, TestMigrate_Order fails: an embedded-FS stub with 0002 before 0001 in insertion order still lands 0001 first (schema_migrations rows are the file names 0001..., 0002... in applied order)",
  ]
  status = "pending"

[[task]]
  id = "t-2"
  wave = 1
  title = "Login rate limiter with escalating lockout"
  files = ["internal/ratelimit/limiter.go", "internal/ratelimit/limiter_test.go"]
  description = """
ratelimit.New(Config{PerIPFailures: 5, Window: 1m, BaseLockout: 1m, MaxLockout: 1h,
EscalationReset: 1h, GlobalFailures: 20, Now func() time.Time}) *Limiter. Check(ip) (allowed
bool, retryAfter time.Duration) and Fail(ip) under one sync.Mutex. Per IP: failures counted in
a fixed 1-minute window that starts at the first failure after the previous window or lockout
ended (not calendar-aligned, not sliding); recording the 5th failure trips the IP: lockedUntil
= now + BaseLockout << (trips-1) capped at MaxLockout, trips++; the failure counter clears
when the lockout ends. Escalation reset is anchored at lockout expiry: on Check/Fail, an IP
whose lockedUntil is >= EscalationReset in the past (and has not tripped since) has trips
reset to 0 — an IP cannot "go 1h without a trip" while it is locked out, so the 1h cap is
sticky for an attacker who retries as soon as each lockout ends. Global: one fixed 1-minute
window (same first-failure anchor); the 20th failure denies every IP until the window ends,
never escalates. retryAfter is ceil'd to whole seconds and >= 1s whenever allowed==false.
Prune() (also run lazily inside Fail) drops IPs with no active lockout, no failures in the
current window and lockedUntil older than EscalationReset. Len() for tests. There is no Success or
Rejected method: only Fail consumes budget, so successes and 429s cannot count by
construction. No logging, no net/http — pure policy with an injected clock.
"""
  covers = ["c-4", "c-11"]
  test_contract = [
    "if the trip threshold is off by one, TestPerIP_Threshold fails: 5 Fail() calls within 1m leave Check false (retryAfter 60s); 4 Fail() calls leave Check true",
    "if doubling or the cap breaks, TestPerIP_Doubling fails: with a fake clock, tripping the same IP repeatedly immediately after each unlock yields lockouts of exactly 1m, 2m, 4m, 8m, 16m, 32m, 1h, 1h (capped)",
    "if escalation never resets, TestPerIP_Reset fails: after a 4m trip, advancing 1h past the lockout's end with no failures and tripping again yields a 1m lockout, not 8m",
    "if Retry-After does not track the current window, TestPerIP_RetryAfter fails: during a 4m lockout Check at +90s returns retryAfter == 150s; at +239.2s returns 1s (ceil), never 0",
    "if the global limit escalates or is miscounted, TestGlobal_Flat fails: 20 failures spread over 20 distinct IPs deny a 21st fresh IP with retryAfter == remaining window; after the window, 20 more failures deny again with a 1m-bounded retryAfter (no doubling)",
    "if the failure counter survives a lockout, TestPerIP_ClearOnUnlock fails: after a lockout ends, a single Fail() does not re-lock (needs 5 fresh failures)",
    "if pruning breaks, TestPrune fails: 100 IPs tripped once (1m lockouts), clock advanced 1h + 2m, Prune() leaves Len() == 0; an IP still inside a 1h lockout survives Prune()",
    "if the mutex is removed, TestLimiter_Race fails under go test -race: 50 goroutines interleaving Check/Fail on 5 IPs",
    "if the reset is missing or too eager, TestLimiter_Reset fails (reset is anchored at lockout expiry, not at the trip): after trip #3 (4m lockout) at time L, advance to L+4m+59m59s and trip again -> 8m (no reset); in a fresh limiter reach a 4m lockout at L, advance to L+4m+1h and trip -> 1m (reset); after a 1h lockout ending at E, tripping at E+1s -> 1h again (cap is sticky)",
    "if the window is calendar-aligned instead of first-failure-anchored, TestPerIP_WindowAnchor fails: 4 failures at t, then 4 more at t+59s trip the IP on the 5th cumulative failure (t+59s is inside the window that opened at t); 4 failures at t and 1 at t+61s do not trip",
    "if rate-limited or successful attempts consume budget, TestLimiter_BudgetIsFailuresOnly fails: 100 Check calls with no Fail never block; 4 failures then 50 Check calls still allowed (compile-level: no Success/Rejected method exists)",
  ]
  status = "pending"

[[task]]
  id = "t-3"
  wave = 1
  title = "trusted_proxies config and client IP resolver"
  files = ["internal/config/config.go", "internal/config/config_test.go", "internal/config/testdata/full.yaml", "deploy/config.example.yaml", "internal/api/clientip.go", "internal/api/clientip_test.go"]
  description = """
Config gains TrustedProxies []string `yaml:"trusted_proxies"`; env row
ADGUARD_REWARD_TRUSTED_PROXIES splits on commas (trimmed, empties dropped; set-but-empty ->
empty list). validate() parses every entry with net.ParseCIDR (a bare IP is accepted as /32 or
/128) and errors naming trusted_proxies and the bad entry. Config.TrustedProxyNets()
[]*net.IPNet. validate() also gains the TLS both-or-neither rule: tls.cert set without
tls.key (or vice versa) errors naming both keys, alongside the existing password /
password_file cross-field check — main (t-11) then only reads cfg.TLS. TestEnvTable's
set-every-var round-trip (which sets each var to "v:<key>") gains an override of
ADGUARD_REWARD_TRUSTED_PROXIES to "" in its mergeMaps block, since "v:trusted_proxies" would
fail CIDR validation; TestLoad_Full's pinned want struct gains the TrustedProxies value
added to full.yaml. api.ClientIP(trusted []*net.IPNet)
func(*http.Request) netip.Addr: peer = host of r.RemoteAddr (port stripped, IPv6 brackets
removed, zone dropped, 4-in-6 mapped addresses unmapped). With an empty list or a peer outside
every net, X-Forwarded-For is ignored. Otherwise the XFF hops (all header values concatenated
in order) are walked right to left; the first hop not inside a trusted net is the client; if
every hop is trusted or a hop fails to parse, fall back to the peer. Unparseable RemoteAddr ->
netip.Addr{} and the caller keys on "invalid" (no panic). config.example.yaml gains
`trusted_proxies: []` with a one-line comment on X-Forwarded-For; full.yaml gains the key.
"""
  covers = ["c-4"]
  test_contract = [
    "if the reflection env-table test is bypassed, TestEnvTable fails: the want map gains trusted_proxies -> ADGUARD_REWARD_TRUSTED_PROXIES and walkLeaves reports the new []string leaf",
    "if list parsing breaks, TestLoad_TrustedProxies fails: yaml list [10.0.0.0/8, ::1] loads both; env '10.0.0.1, 192.168.0.0/16' yields [10.0.0.1/32, 192.168.0.0/16]; env set to '' yields an empty list overriding yaml",
    "if validation stops naming the key, TestLoad_TrustedProxiesInvalid fails: entry '10.0.0.0/33' and entry 'proxy' each error containing trusted_proxies and the entry",
    "if the TLS pair rule is missing, TestLoad_TLSPair fails: tls.cert set without tls.key errors containing both 'tls.cert' and 'tls.key'; tls.key alone errors the same way; both set or both empty load cleanly",
    "if XFF is honoured without opt-in, TestClientIP_Spoof fails: no trusted nets, RemoteAddr 203.0.113.9:4444, XFF '1.2.3.4' -> 203.0.113.9",
    "if hop selection breaks, TestClientIP_Proxied fails: trusted [10.0.0.0/8], RemoteAddr 10.0.0.5:1, XFF '1.2.3.4, 5.6.7.8, 10.0.0.7' -> 5.6.7.8; XFF '10.0.0.7' (all trusted) -> 10.0.0.5; XFF 'garbage, 10.0.0.7' -> 10.0.0.5; untrusted peer 198.51.100.2 with the same XFF -> 198.51.100.2; two separate XFF header lines '1.2.3.4' and '5.6.7.8' -> 5.6.7.8",
    "if IPv6 handling breaks, TestClientIP_V6 fails: RemoteAddr '[2001:db8::1]:5' -> 2001:db8::1; '[fe80::1%eth0]:5' -> fe80::1; RemoteAddr '[::ffff:10.0.0.2]:80' matches trusted 10.0.0.0/8",
    "if a bad RemoteAddr panics, TestClientIP_Malformed fails: RemoteAddr 'pipe' and 'nonsense' each return an invalid Addr and no panic",
    "if the example config drifts from the loader, TestExampleConfigLoads fails: config.Load('../../deploy/config.example.yaml') with only the three required ADGUARD_REWARD_ADGUARD_* env vars set succeeds and TrustedProxyNets() is empty",
  ]
  status = "pending"

[[task]]
  id = "t-4"
  wave = 1
  title = "Session tokens, cookie policy, RequireSession middleware"
  files = ["internal/auth/token.go", "internal/auth/auth.go", "internal/auth/middleware.go", "internal/auth/auth_test.go"]
  description = """
auth.SessionStore interface: Insert(ctx, Session) (id int64, err error); ByTokenHash(ctx,
[32]byte) (Session, error) returning ErrNotFound; Touch(ctx, id int64, lastSeen, expires
time.Time) error; Delete(ctx, id int64) error; ListByUser(ctx, user) ([]Session, error);
DeleteByUser(ctx, user, id int64) (bool, error); DeleteOthers(ctx, user, keepID int64) (int,
error); DeleteExpired(ctx, now) (int, error). Session{ID int64, Username, TokenHash, CreatedAt,
LastSeenAt, ExpiresAt}. Tests use an in-package fake SessionStore; the SQLite implementation
lands in t-6. auth.New(store, Options{Secure bool, Lifetime: 30*24h, Now func() time.Time,
Log}) *Manager. Issue(ctx, username) (rawToken string, Session, error): 32 bytes crypto/rand
-> base64.RawURLEncoding (43 chars); ID is assigned by the store (rowid); only sha256(raw) is
stored. Authenticate(ctx, raw) (Session, error): decode -> hash -> ByTokenHash; ExpiresAt <=
now -> Delete + ErrNoSession; otherwise Touch(now, now+Lifetime) and return the refreshed
session (sliding, on every request per the locked decision, no coalescing). Cookie(raw)
*http.Cookie: Name "adguard_reward_session", HttpOnly, SameSite=Strict, Path=/,
Secure=Options.Secure, MaxAge = Lifetime seconds. ClearCookie() same attrs with MaxAge -1.
SetCookie(w, c) / Clear(w) are the only writers: both first delete any existing Set-Cookie
header for adguard_reward_session from w.Header() before http.SetCookie, so a handler that
clears the cookie after RequireSession refreshed it leaves exactly one Set-Cookie on the
response. RequireSession(next) http.Handler: missing/invalid cookie -> 401 via the injected
errorWriter (func(w, status, code, msg)) so the JSON envelope stays in internal/api, plus
Clear(w) when a cookie was present; success re-issues Cookie(raw) via SetCookie with a fresh
MaxAge (so the browser's expiry slides with the server's) and puts the Session in ctx
(auth.FromContext). RunSweeper(ctx, interval) calls DeleteExpired on a ticker. The raw token is never passed to
slog; Session has no field holding it and Session.LogValue() emits only id and username.
"""
  covers = ["c-2", "c-3", "c-6"]
  test_contract = [
    "if token entropy or the hash-only rule breaks, TestIssue_Token fails: two Issue() calls return distinct 43-char base64url tokens; the fake store's inserted TokenHash equals sha256(raw) and no stored field equals raw",
    "if cookie attributes drift, TestCookie_Attrs fails: Secure=false gives HttpOnly, SameSite=Strict, Path=/, no Secure; Secure=true adds Secure; ClearCookie has MaxAge -1 and identical Name/Path",
    "if the cookie writers append instead of replace, TestSetCookie_Single fails: SetCookie then Clear on one ResponseWriter leaves exactly one Set-Cookie header for adguard_reward_session and it has Max-Age=0; an unrelated Set-Cookie header is untouched",
    "if sliding expiry breaks, TestAuthenticate_Sliding fails: Issue at t0, Authenticate at t0+29d -> ok and the fake store's Touch recorded expires == t0+59d; Authenticate at t0+58d+23h -> ok and Touch recorded expires == t0+88d+23h; then a 31-day gap -> ErrNoSession and the fake store recorded Delete(id)",
    "if expiry is not enforced, TestAuthenticate_Expired fails: Issue at t0, Authenticate at t0+30d+1s -> ErrNoSession",
    "if a revoked session is still accepted, TestAuthenticate_Revoked fails: Issue, store.Delete(id), Authenticate -> ErrNoSession",
    "if a tampered token is accepted, TestAuthenticate_Garbage fails: '', 'notbase64!', a valid-looking token from another Manager, and raw with one flipped character each yield ErrNoSession with no Touch call",
    "if the middleware leaks through, TestRequireSession fails: a spy next handler sees zero calls for (no cookie), (cookie with random value), (cookie from a session deleted via store.Delete), and all three get 401 application/json; the deleted-session response carries a Set-Cookie clearing the cookie; expired -> 401; a valid cookie reaches next once with auth.FromContext(r.Context()).Username == the issued username and the response carries a refreshed Set-Cookie with Max-Age=2592000",
    "if the token reaches the logs, TestNoTokenInLogs fails: a Debug-level JSON slog handler into a buffer across Issue, Authenticate, RequireSession and a slog.Info('s', 'session', sess) contains the session id (positive control) and never the raw token or its base64url/hex hash",
    "if the sweeper stops running, TestRunSweeper fails: RunSweeper(ctx, 5ms) records >= 2 DeleteExpired calls on the fake store within 100ms and returns on cancel",
  ]
  status = "pending"

[[task]]
  id = "t-5"
  wave = 1
  title = "API router skeleton, CSRF header, no-store, error envelope"
  files = ["internal/api/api.go", "internal/api/middleware.go", "internal/api/errors.go", "internal/api/middleware_test.go"]
  description = """
api.New(Deps) *API with Handler() http.Handler. Deps is declared now but typed only against
api-local interfaces so this task compiles with no import of internal/store, internal/auth
or internal/ratelimit (it runs in parallel with them): AdGuard interface{ Login(ctx, u, p)
error }, ClientIP func(*http.Request) netip.Addr, Log *slog.Logger; the Auth / Limiter /
Sessions fields are added by t-9 and t-10 when those packages exist. Handler() =
noStore(csrf(mux)) mounted under /api/v1/ so the chain wraps 404s and 405s too. noStore sets
Cache-Control: no-store before calling next (header set first, so every path incl. errors
carries it; in-house handlers never set Cache-Control themselves). csrf: methods other than
GET/HEAD/OPTIONS require X-Requested-With == "adguard-reward" (exact, case-sensitive value)
else 403 forbidden before any route matches. errors.go: writeError(w, status, code, message)
emits application/json {"error": code, "message": message}; codes: bad_request,
unauthorized, forbidden, bad_credentials, adguard_unavailable, rate_limited, not_found.
unauthorizedWriter(w, status, code, msg) is the func value t-9 hands to
auth.RequireSession's errorWriter option. No business routes yet — the test mounts a stub
route via API.mux for ordering assertions. The "/api/v1/" catch-all ->
RequireSession(NotFound) lands in t-9.
"""
  covers = ["c-5", "c-10"]
  test_contract = [
    "if the CSRF check misses a method, TestCSRF_Methods fails: POST, PUT, PATCH, DELETE to a stub /api/v1/x without the header -> 403 and the stub never runs; GET, HEAD, OPTIONS without the header reach the stub; POST with the header reaches it",
    "if the header value is loosely matched, TestCSRF_Value fails: 'AdGuard-Reward', 'adguard-reward ' and 'XMLHttpRequest' are all 403",
    "if the check runs after the route, TestCSRF_BeforeHandler fails: POST to an unmounted /api/v1/nope without the header is 403 (not 404); a stub that panics is never reached",
    "if no-store is set inside handlers instead of the outer layer, TestNoStore fails: the 403 from csrf, a 404 for an unknown route, a 405 from the mux and a 200 stub all carry Cache-Control: no-store",
    "if the envelope drifts, TestWriteError fails: writeError(w, 401, 'unauthorized', 'm') yields status 401, Content-Type application/json and body decoding to exactly {error: unauthorized, message: m}",
  ]
  status = "pending"

[[task]]
  id = "t-6"
  wave = 2
  title = "Sessions queries implementing auth.SessionStore"
  files = ["internal/store/sessions.go", "internal/store/sessions_test.go"]
  description = """
*store.Store implements every auth.SessionStore method with parameterised SQL over the 0001
table; times stored as Unix seconds UTC; Insert returns LastInsertId as the session id.
ByTokenHash returns auth.ErrNotFound (not sql.ErrNoRows) on miss. DeleteByUser deletes only
when both username and id match, returning whether a row went. DeleteOthers deletes the user's
