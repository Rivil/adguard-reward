    "if Touch stops writing both columns, TestSessions_Touch fails: after Touch(id, ls, ex), ByTokenHash returns LastSeenAt == ls and ExpiresAt == ex to the second",
    "if expiry sweep is off by one, TestSessions_DeleteExpired fails: rows expiring at t, t+1s with now = t deletes exactly one (the <= row)",
    "if sessions do not survive a restart, TestSessions_Persist fails: Insert, Close, Open same dir, ByTokenHash returns the row with all fields equal",
    "if a miss is reported as a driver error, TestSessions_NotFound fails: ByTokenHash(unknown) yields errors.Is(err, auth.ErrNotFound)",
