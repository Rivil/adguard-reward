[[task]]
  id = "t-6"
  wave = 2
  title = "Engine-owned region sync and custom-service CRUD"
  files = ["internal/grants/rules.go", "internal/grants/rules_test.go", "internal/grants/grants.go"]
  description = "syncRules(ctx, actx, exclude int64) under e.mu: reads custom services, children and active grants (dropping exclude), Render -> EditUserRules(Splice); any store read error aborts with no AdGuard call. Exported Engine.SyncRules(ctx) takes e.mu and calls it for API callers. Engine.CreateService/UpdateService/DeleteService do the store op then syncRules under e.mu and return {Service, Applied}; a region-write failure gives Applied=false and keeps the row. Store and AdGuard interfaces extended."
  covers = ["c-1", "c-3", "c-4", "c-9"]
  depends_on = ["t-1", "t-2", "t-3", "t-4"]
  test_contract = [
    '''if a read failure renders an empty region, TestSyncRules_ReadFailure fails: ListActiveGrants or custom-list read failure -> 0 set_rules POSTs (an empty region would unblock every kid)''',
    '''if block scope is wrong, TestCreateService_BlocksChildren fails: Create [a.com] with children on [kid-phone,kid-tablet] and unmapped adult dad-laptop -> ||a.com^$client='kid-phone'|'kid-tablet' and dad-laptop appears nowhere''',
    '''if edits leave stale rules, TestUpdateService_Domains fails: Update {a,b}->{b,c} under an active grant -> block and @@ lines name only b.com and c.com; no line contains a.com''',
    '''if delete leaves rules or touches foreign lines, TestDeleteService fails: delete without a grant -> no region line contains its domains and lines outside the markers are byte-identical; delete with an active grant -> ErrServiceInUse and 0 POSTs''',
    '''if a write failure loses the row or errors, TestCreateService_WriteFailure fails: set_rules failure -> service stored, Applied=false, nil error; a malformed region in the fake -> Applied=false, 0 POSTs, user_rules unchanged''',
  ]
  status = "done"

