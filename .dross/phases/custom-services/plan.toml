task_seq = 18

[phase]
  id = "custom-services"

# Wire conventions (agreed in panel synthesis, panel/synthesis.md):
# - custom catalogue id is "custom:<n>"; resource {id:n, service_id:"custom:n", name, domains[], applied}
#   at /api/v1/custom-services[/{n}]; applied=false = stored but region write failed (reconciler converges)
# - GET /api/v1/services entries gain custom:bool; custom entries carry icon ""
# - AdGuard: GET /control/filtering/status -> user_rules[]; POST /control/filtering/set_rules {"rules":[...]}
# - region order: begin marker, all ||d^$client=... block lines, all @@||d^$client=... exception lines
#   (each sorted by service id, domain), end marker; one @@ line per domain over the union of covered clients

[[task]]
  id = "t-1"
  wave = 1
  title = "Splice managed region into user_rules"
  files = ["internal/rules/region.go", "internal/rules/region_test.go"]
  description = '''Pure Splice(current, managed []string) ([]string, error): replaces lines between `! adguard-reward begin` / `! adguard-reward end` (markers kept) with managed; no region -> appends begin+managed+end at the tail. Lone begin, lone end, end-before-begin or a second pair -> ErrMalformedRegion, nil slice, no repair.'''
  covers = ["c-9"]
  test_contract = [
    '''if lines outside the markers are altered, TestSplice_PreservesOutside fails: a table of inputs with blank lines, duplicate lines, trailing spaces, ! and # comments, unicode, and a line containing "adguard-reward begin" as a substring (not the exact marker) keeps prefix and suffix reflect.DeepEqual; a version that trims, dedupes, sorts or substring-matches the marker fails''',
    '''if a missing region is not appended at the end, TestSplice_AppendsWhenAbsent fails: output == current ++ [begin, managed..., end]; prepending or inserting after the first comment fails''',
    '''if malformed markers are repaired instead of refused, TestSplice_Malformed fails: each of lone begin, lone end, end-before-begin and two pairs returns ErrMalformedRegion and a nil slice''',
    '''if Splice is not idempotent, TestSplice_Idempotent fails: Splice(Splice(x, m), m) == Splice(x, m)''',
  ]
  status = "done"

[[task]]
  id = "t-2"
  wave = 1
  title = "Validate domains and render region rules"
  files = ["internal/rules/domain.go", "internal/rules/domain_test.go", "internal/rules/render.go", "internal/rules/render_test.go"]
  description = "NormalizeDomain lowercases, strips one trailing dot, accepts only ASCII LDH labels (<=253 chars, >=2 labels, punycode ok, non-ASCII rejected). QuoteClient single-quotes a client name and backslash-escapes ' , | $ only. Amended 2026-11-02 (user-approved during execute) after reading urlfilter@347285f3f046's $client decoding: the options delimiter is the last `$` not preceded by `\\`; `\\,` and `\\|` are unescaped by the option and client splits; inside single quotes only `\\'` is unescaped, so `\"` and `\\` stay bare (escaping them leaves a literal backslash and the rule never matches). Names that are empty, contain a newline/CR, or have a backslash before ' , | $ or at the end are refused: dropped from the line and logged. Render(services, childClients, covers) returns deterministic body lines (no markers): per domain one block line over the union of mapped child clients and one @@ line over the union of clients any active grant covers that service on."
  covers = ["c-2", "c-6", "c-7"]
  test_contract = ["if any domain check is dropped, TestNormalizeDomain fails its row: https://a.com, a.com/x, a.com:443, *.a.com, \"a .com\", \" a.com\", \"a.com\\n\", ||a.com^, a.com^, a.com$important, /a\\.com/, @@a.com, com, \"\" and ä.com each return an error; Example.COM. -> example.com", "if client quoting is wrong, TestQuoteClient fails: QuoteClient(`Ann's \"tab\", |x`) == `'Ann\\'s \"tab\"\\, \\|x'` exactly (amended: \" stays bare per urlfilter) and every accepted name decodes back to itself through a decoder mirroring urlfilter@347285f3f046; a client name containing a newline is dropped from the line (and logged), never split across lines", "if backslash or dollar handling in client names is wrong, TestQuoteClient fails: QuoteClient(`a\\b`) == `'a\\b'` exactly (amended: urlfilter never unescapes \\\\), QuoteClient(`a$b`) == `'a\\$b'` (urlfilter skips \\$ when finding the options delimiter), and `a\\'b`, `a\\,b`, `a\\|b`, `a\\$b` and a trailing backslash are refused", "if block lines are mis-scoped, TestRender_Block fails: 1 service [a.com,b.com], child clients [kid-phone,tv], no covers -> exactly ||a.com^$client='kid-phone'|'tv' and the b.com twin; no adult client present", "if an empty client set yields an unscoped rule, TestRender_NoClients fails: zero mapped child clients -> no block line at all (an unscoped ||d^ would block adults)", "if grant exceptions are missing or duplicated, TestRender_Cover fails: cover {custom:1,[kid-phone,tv]} adds exactly one @@ line per domain", "if ref-counting by union breaks, TestRender_SharedCover fails: covers A{custom:1,[a-phone,tv]} + B{custom:1,[b-phone,tv]} then only B -> the a.com exception is 'b-phone'|'tv' (tv kept, a-phone gone); dropping both removes the line", "if output is order-dependent, TestRender_Deterministic fails: 100 shuffled-input runs produce byte-identical output"]
  status = "done"

[[task]]
  id = "t-3"
  wave = 1
  title = "AdGuard user_rules locked read-modify-write + fake"
  files = ["internal/adguard/rules.go", "internal/adguard/rules_test.go", "internal/adguard/adguardtest/server.go", "internal/adguard/adguardtest/testdata/filtering_status.json", "internal/adguard/client.go"]
  description = '''Client.EditUserRules(ctx, fn) runs under a dedicated mutex: GET /control/filtering/status .user_rules, apply fn, POST /control/filtering/set_rules only when the result differs. Confirm endpoint shapes against AdGuard's OpenAPI before coding. The fake serves both from mutable state with SetUserRules/UserRules knobs and an in-flight counter on the filtering paths; faults via SetStatus.'''
  covers = ["c-8", "c-9"]
  test_contract = [
    '''if a no-op edit still writes, TestEditUserRules_NoOp fails: fn returning identical lines -> 0 CountRequests("POST","/control/filtering/set_rules")''',
    '''if a read or fn failure still writes, TestEditUserRules_FailClosed fails: GET 502 -> fn never called, 0 POSTs, error returned; fn error -> 0 POSTs, error returned''',
    '''if null handling breaks, TestEditUserRules_Null fails: user_rules null decodes to []; appending a region posts {"rules":[...]}, never null''',
    '''if the mutex is removed, TestEditUserRules_Concurrent fails: 20 concurrent EditUserRules each appending a distinct line -> all 20 present and filtering in-flight max == 1''',
    '''if the body mangles existing lines, TestEditUserRules_Verbatim fails: set_rules body carries every original line byte-for-byte including blank lines and trailing whitespace''',
    '''if write errors are swallowed, TestEditUserRules_WriteError fails: set_rules 500 -> *StatusError''',
  ]
  status = "done"

