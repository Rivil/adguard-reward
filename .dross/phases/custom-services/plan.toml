[[task]]
  id = "t-11"
  wave = 3
  title = "Apply grant lifecycle to custom services"
  files = ["internal/grants/grants.go", "internal/grants/grants_test.go"]
  description = "Create, unblock, revert, End and expireLocked partition services: built-in ids keep the blocked_services path; custom ids never reach it. Create refuses an unknown custom id under mu, then syncs with the new grant included. End and expiry order: region sync with the grant excluded, then built-in revert, then the status CAS; any failure leaves the grant active (*ErrRevertFailed on End) and the reconciler re-converges both halves from intent (its region sync is t-13's). A malformed region makes End return ErrRevertFailed whose message names the malformed managed region. Extend writes nothing. Any custom:-prefixed id that is not canonical is refused as unknown, never treated as built-in."
  covers = ["c-6", "c-7", "c-9"]
  depends_on = ["t-6"]
  test_contract = ["if custom ids leak to blocked_services, TestGrant_CustomNoLeak fails: grant [custom:1] on [kid-phone,tv] -> @@||a.com^$client='kid-phone'|'tv' per domain and 0 POST /control/clients/update on create, end and expiry; any custom: in a clients/update body fails", "if mixed grants miss a half, TestGrant_Mixed fails: [youtube, custom:1] -> youtube removed from blocked_services AND the @@ lines written", "if shared-client ref-counting breaks, TestGrant_CustomShared fails: grants A and B on custom:1 sharing tv; End A -> exception keeps tv and B's phone, drops A's phone; expiring B via the fake clock -> no @@ line remains", "if lifecycle writes touch foreign lines, TestGrant_CustomPreservesOutside fails: seed [\"! mine\",\"||x^\",\"@@||y^\"] is identical outside the markers after Create, Extend, End and expiry; Extend issues 0 set_rules POSTs", "if a region-write failure is not fail-closed, TestGrant_CustomWriteFailure fails: set_rules fault on Create -> Result.Failed == the grant's clients; on End -> *ErrRevertFailed, grant still active, @@ lines still present", "if unknown custom ids are accepted, TestGrant_UnknownCustom fails: Create with custom:99 -> error and no grant row stored", "if delete can race a grant create, TestDeleteService_RaceGrant (-race) fails: concurrent DeleteService and grant Create on the same service end in exactly one of {grant exists + ErrServiceInUse, service gone + Create refused}, never a grant on a deleted service", "if a mixed grant half-ends, TestGrant_MixedEndPartialFailure fails: grant [youtube, custom:1]; set_rules fault on End -> ErrRevertFailed, grant active, youtube still unblocked and @@ lines present; clients/update fault on End after the region write -> ErrRevertFailed, grant active, the @@ lines are gone from the region, and a region convergence from intent (Engine.SyncRules) restores them while the grant stays active (amended 2026-11-02, user-approved: the Reconcile pass itself is proven by t-13's TestReconcile_HalfEndedGrant)", "if broken markers fail silently on End, TestGrant_EndMalformedRegion fails: fake user_rules with only a begin marker -> End returns ErrRevertFailed whose message contains \"managed rules region is malformed\", the grant stays active, 0 set_rules POSTs", "if non-canonical custom ids slip through as built-ins, TestGrant_UnknownCustom fails: custom:99, custom:01 and custom:abc each -> *ErrUnknownService and no grant stored; builtin() never passes any custom:-prefixed id to blocked_services"]
  status = "done"

