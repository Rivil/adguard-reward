[[task]]
  id = "t-3"
  wave = 1
  title = "Add pure filter parse, serialise, day-bounds helpers"
  files = ["web/src/lib/history.ts", "web/src/lib/history.test.ts", "web/vite.config.ts"]
  description = "HistoryFilters type {service, status, from, to}; parseFilters(search), filterParams(f) in fixed order, hasFilters(f), dayBounds(from, to) giving local-midnight instants as UTC ISO, with until the midnight after to. appendPage becomes generic over {id: number} so overview rows keep their child. Pin process.env.TZ = 'America/Havana' at the top of vite.config.ts so one zone holds in the main process and in Stryker's worker threads."
  covers = ["c-5", "c-8"]
  test_contract = ["if the pin is dropped or ignored, the zone control test fails: getTimezoneOffset reads 300 for 2026-01-15 and 240 for 2026-07-15, so a run that fell back to the host zone fails instead of passing by accident", "if a day is computed in UTC or as 24 hours, the dayBounds test fails: 2026-03-08..2026-03-08 gives 2026-03-08T05:00:00.000Z and 2026-03-09T04:00:00.000Z (23-hour day); 2026-11-01..2026-11-01 gives 2026-11-01T04:00:00.000Z and 2026-11-02T05:00:00.000Z (25-hour day)", "if a skipped or repeated midnight breaks, the same test fails: 2026-03-08 has no local midnight in this zone and 2026-11-01 has two, and the instants above are the required answers", "if a day string parses as UTC, the zone test fails: from=2026-03-01 gives 2026-03-01T05:00:00.000Z, not 2026-03-01T00:00:00.000Z", "if an open bound is invented, the dayBounds test fails: only from gives no until, only to gives no from, neither gives {}", "if bad URL values reach the screen, the parseFilters test fails: status=bogus, from=2026-02-31, from=2026-13-01, to=yesterday and service= all parse to null; 2026-02-31 never rolls over to March", "if extreme years leak through, the parseFilters test fails: 0099-01-01 (which new Date reads as 1999) and 9999-12-31 (whose until would serialise as +010000, unparseable by Go) drop to no date filter", "if serialising is lossy or order-dependent, the round-trip test fails: all 16 subsets survive parse(serialise(f)), including services custom:5 and 'a&b=c +', and params come out in one order whatever order they went in", "if appendPage loses row fields, the appendPage test fails: rows carrying a child field keep it after a dedupe by id, and the existing HistoryGrant callers still typecheck"]
  status = "done"

[[task]]
  id = "t-4"
  wave = 2
  title = "Add service, date, status filter predicates"
  files = ["internal/store/history.go", "internal/store/history_test.go"]
  description = '''ServiceID as EXISTS over grant_services and grant_service_removals, From/Until as started_at >= From AND < Until, Status as a predicate per wire status mapping to (status, end_reason), all inside the keyset query so has-more counts filtered rows.'''
  covers = ["c-4", "c-5", "c-6", "c-7"]
  depends_on = ["t-1"]
  test_contract = [
    '''if the removal log is skipped, TestListHistory_ServiceIncludesTrimmed fails: filtering on a service trimmed off a live two-service grant returns it, and so does a grant trimmed to empty (no grant_services rows left, permanent_block), while a grant without the service does not match''',
    '''if the filter narrows details, the same test fails: the matched grant still lists all its services, the trimmed one marked removed''',
    '''if the filter reads snapshot names, TestListHistory_ServiceFilter fails: a live service, a legacy grant with no name row and a deleted custom:N each match exactly once by id''',
    '''if a JOIN replaces EXISTS, TestListHistory_ServiceNoDuplicates fails: a service seeded in both tables lists its grant once''',
    '''if ids match loosely or unparameterised, TestListHistory_ServiceExactID fails: custom:1 does not return a custom:12 grant, and 'you', '%' and `' OR 1=1 --` match nothing against youtube''',
    '''if the range uses the wrong column or edge, TestListHistory_DateBounds fails: started_at == From is in, From-1 is out, Until-1 is in, Until is out, either bound alone works, and a grant that started before From but ended or was extended into the range is out''',
    '''if a status predicate is wrong, TestListHistory_StatusMatrix fails: each of the 12 cells (3 statuses x end_reason NULL, expired, ended_early, permanent_block) appears under exactly one of the five statuses per an explicit table; ('active',NULL) is only ongoing even when overdue, ('expired',NULL) and ('ended','expired') are only expired, and ('ended',NULL) is only ended_unknown''',
    '''if filters do not AND or arguments misalign in the dynamic SQL, TestListHistory_FiltersCombine fails: for all 32 subsets of child, service, from, until, status over a fixed grid, the result equals a brute-force Go filter and a walk at limit 3 repeats nothing''',
    '''if HasMore counts before filtering, TestListHistory_FilteredPaging fails: 120 grants with 60 matching give 50 + HasMore then 10, no overlap; 50 matches over one older non-match give HasMore false; 51 matches give HasMore true with the 50th id as cursor''',
    '''if a row changing mid-paging breaks the cursor, TestListHistory_StatusChangesBetweenPages fails: under status=ongoing, a page-1 grant that expires before page 2 causes no skip or repeat among the rest''',
    '''if a filter reopens hidden rows, TestListHistory_FiltersKeepVisibility fails: a service filter never returns a deleted or reused-id child's grant''',
  ]
  status = "done"

