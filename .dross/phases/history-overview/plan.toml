task_seq = 11

[phase]
  id = "history-overview"

# Wire conventions (agreed in panel synthesis, panel/synthesis.md; all 13 disagreements took the provisional default):
# - HTTP: GET /api/v1/history?child=&service=&status=&from=&until=&before= behind requireSession ->
#   { child:{id,name}|null, grants:[<per-child grant shape> + child:{id,name}], next_before:id|null }; page child is set
#   only under a child filter; newest first by id DESC, page 50; lists are [] never null.
# - status is one of ongoing, expired, ended_early, permanent_block, ended_unknown; service is an exact service id.
# - from is inclusive and until exclusive, both RFC 3339 instants the client computes; the server knows no time zone.
# - 404: unknown, deleted or non-numeric child. 400: bad before, status, from or until; empty service, status, from,
#   until or before; any repeated param. 401: no session. from after until is 200 with grants [].
# - GET /api/v1/history/services -> { services:[{id,name}] } sorted by name then id. Child options come from the existing
#   GET /api/v1/children.
# - GET /api/v1/children/{id}/history stays, byte-identical (no web client after t-11; kept as a regression net).
# - SPA URL: /history?child=N&service=ID&status=S&from=YYYY-MM-DD&to=YYYY-MM-DD, fixed param order, local calendar days,
#   never instants. SPA `to` is an inclusive day; API `until` is an exclusive instant - the names differ on purpose.
# - store: ListHistory(ctx, HistoryFilter{ChildID, ServiceID, Status, From, Until, Before}, limit) and
#   ListHistoryServices(ctx).
# - web tests: process.env.TZ = 'America/Havana' pinned at the top of web/vite.config.ts, because Stryker's worker threads
#   ignore a per-test TZ.
# Accepted gap on c-4: a service trimmed before migration 0009 left no removal row, so the service filter cannot find
# those grants. The data was never recorded.

[[task]]
  id = "t-1"
  wave = 1
  title = "Add cross-child history read with visibility"
  files = ["internal/store/history.go", "internal/store/history_test.go"]
  description = "ListHistory joins children in SQL on child_id AND g.id > history_after_grant_id, reads limit+1, reuses historyDetails. The visibility join is one named SQL fragment in history.go, shared with t-5. ListHistory fills per-grant ChildID and ChildName. HistoryFilter carries ChildID and Before here; ChildID 0 means all, a negative or unknown or deleted ChildID is ErrChildNotFound. ListGrantHistory keeps its own child lookup, so id 0 and below stay ErrChildNotFound, and it leaves per-grant ChildID and ChildName zero; its behaviour is unchanged."
  covers = ["c-1", "c-2", "c-3", "c-9"]
  test_contract = ["if child names or details are lost, TestListHistory_AllChildrenNewestFirst fails: interleaved Ada/Ben grants come back id DESC, each with ChildID, ChildName, services, removals and extensions equal to the per-child read", "if the cursor is per-child or the limit is off, TestListHistory_CrossChildPaging fails: 120 grants over 3 children walk 50/50/20 by Before, the union is every id exactly once, HasMore is false on the last page, 51 grants give HasMore true, and exactly 50 give HasMore false", "if the cursor must point at a visible grant or new grants shift the window, TestListHistory_StableCursorAcrossChildren fails: a grant created between pages appears neither in page 2 nor twice, and deleting the child that owns the cursor grant between pages still returns the next older grants with no skip", "if deleted children are dropped in Go after LIMIT, TestListHistory_DeletedChildOmitted fails: 60 newest grants on a deleted child (one still active) over 50 visible grants give a full first page of the 50 visible with HasMore false; 120 grants alternating Ada/Ben with Ben deleted give 50 of Ada's with HasMore true, then 10 with HasMore false", "if the join ignores the watermark, TestListHistory_ReusedIDOmitted fails: delete the highest-id child, create one that gets the same id (asserted), and the old grant is absent both unfiltered and with ChildID set, while the new grant shows the new name and no grant carries that name from before the watermark", "if the child filter conflates unknown with empty, TestListHistory_ChildFilter fails: unknown and deleted ChildID return ErrChildNotFound; a child with no grants returns an empty page with ChildName set; ChildID 0 returns all; an empty install returns an empty non-nil list", "if the shared read regresses the per-child path, the existing TestListGrantHistory_* suite and the internal/store/setup_test.go assertions fail unedited, including the DeepEqual in TestListGrantHistory_Legacy", "if the per-child wrapper forwards id 0 as no filter, TestListGrantHistory_NonPositiveID fails: ListGrantHistory with 0 and -1 returns ErrChildNotFound, and ListHistory with ChildID -1 returns ErrChildNotFound"]
  status = "done"

