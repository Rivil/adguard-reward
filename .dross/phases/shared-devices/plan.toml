[[task]]
  id = "t-5"
  wave = 2
  title = "Ref-counted revert in End, expiry, reconcile"
  files = ["internal/grants/grants.go", "internal/grants/grants_test.go", "internal/grants/reconcile.go", "internal/grants/reconcile_test.go"]
  description = """
revert re-reads ListActiveGrants under the mutex on every call and writes AddBlockedServices(client, revertPlan[client])
only. A failed read fails every client: the grant stays active and is retried, never re-blocked blind. Reconcile's overdue
loop goes through the same revert, so each expiry sees the statuses the previous one committed.
"""
  covers = ["c-4"]
  test_contract = ["if revert is not ref-counted, TestEngine_SharedExpiryKeepsOther fails: G1 (Ada, youtube, [Kid phone, Old laptop]) and G2 (Ben, youtube, [Kid phone]); advance past G1 -> Old laptop blocks youtube, Kid phone does not, G1 expired; advance past G2 -> Kid phone blocks youtube", "if End bypasses it, TestEngine_SharedEnd fails: End(G1) with G2 active -> nil, G1 ended, Kid phone still lacks youtube; End(G2) then re-blocks it", "if a different service is spared, TestEngine_EndSharedOtherService fails: Ada's grant is tiktok, Ben's is youtube, both on Kid phone; ending Ben's re-blocks youtube", "if reconcile uses its snapshot, TestReconcile_BothOverdueShared fails: G1 and G2 both past ends_at, no timer fired -> one Reconcile expires both, Reverted == 2, Kid phone blocks youtube", "if reconcile ignores a live owner, TestReconcile_OverdueSharedKeepsOther fails: an overdue Ben grant reverted while Ada's live grant covers Kid phone leaves youtube open there, Reverted == 1", "if timers race, TestExpire_SharedTimersSerial fails: both expiry callbacks fired concurrently -> youtube blocked on Kid phone and MaxInFlightUpdates() == 1", "if expired/ended grants count as cover, TestEngine_ExpiredGrantNoCover fails: an ended G0 on Kid phone does not keep youtube open when G1 expires", "if a fully covered client still gets a POST, TestEngine_CoveredNoWrite fails: G1 on [Kid phone] only with G2 active -> G1's expiry issues 0 /control/clients/update", "if the read fails open, TestEnd_ActiveReadFails fails: ListActiveGrants error -> *ErrRevertFailed, zero AdGuard update POSTs, grant still active", "if ownership is used, TestExpire_ClientUnassigned fails: Kid phone removed from Ada after her grant; expiry still re-blocks it", "if the unshared path regresses, the existing TestEngine_TimerReverts and TestReconcile_DriftRepaired fail unchanged", "if Writes still counts every stored client, TestReconcile_WritesCountsActual fails: G1 overdue on [Kid phone, Old laptop] while G2 covers youtube on Kid phone -> one Reconcile reports Writes == 1 (Old laptop only)", "if revert filters holders by current ownership, TestExpire_HolderUnassigned fails: G_Ada and G_Ben both youtube on [Kid phone]; Kid phone removed from Ada (case 2: Ada deleted); advance past G_Ben -> Kid phone still lacks youtube; advance past G_Ada -> Kid phone blocks youtube"]
  depends_on = ["t-2"]
  status = "done"

