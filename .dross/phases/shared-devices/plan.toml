task_seq = 17

[phase]
  id = "shared-devices"

# Pinned wire contract (backend tasks produce it; SPA tasks code against it from wave 1):
#   childRef  = {id, name}
#   sharedRef = {client: string, others: childRef[]}   others = current owners minus the grant's child, id ASC
#   GET  /api/v1/clients        clientView.child -> children: childRef[] (id ASC, never null); same clientView in
#                               POST /clients 201 and POST /clients/rename 200. `child` is added-alongside in t-4 and
#                               removed from the SPA type only in t-16.
#   PUT  /api/v1/children/{id}  shape unchanged; no client-ownership 409 (name-taken 409 stays)
#   POST /api/v1/children       shape unchanged; a client another child holds is accepted
#   POST /api/v1/grants 201     {id, ends_at, applied, failed, shared: sharedRef[]}  client ASC, never null
#   GET  /api/v1/grants         each grant + the same shared, computed from the current mapping
#   GET  /api/v1/children/{id}/blocked
#                               clients[] gains shared_with: childRef[] (other owners, id ASC, never null)
#                               services[] gains unblocked_by: [{client, grant_id, child: childRef}] — one per (present
#                               mapped client, active grant of ANOTHER child) where the grant covers the service on that
#                               client and the client does not effectively block it; sorted (client, grant_id); never null
#   GET/POST /api/v1/migration  shape unchanged; a shared client appears once, child = lowest-id owner
# Fixture convention: Ada (1), Ben (2), Cleo (3). Kid phone is the shared device (own list [youtube, tiktok]);
# Kid tablet inherits global [tiktok, roblox] and is MutateClient'd where a test needs an own list.
# Ref-count rule (locked shared_device_rule) is keyed on each grant's STORED clients, never on current ownership.
# Panel audit trail: panel/{risk,mvp,verification,synthesis}.md

[[task]]
  id = "t-1"
  wave = 1
  title = "Rebuild child_clients with composite key"
  files = ["internal/store/migrations/0005_shared_clients.sql", "internal/store/children.go", "internal/store/children_test.go", "internal/store/store_test.go", "internal/api/children_test.go"]
  description = "New migration 0005: create-copy-drop-rename rebuild to PRIMARY KEY (client_name, child_id), keeping FK ON DELETE CASCADE, the child_id index and an index on client_name, copying every row. checkConflicts keeps only the name check, so Create/UpdateChild accept a client another child holds. UpdateChild and DeleteChild touch only their own child_id rows. POST /children has no API-level client pre-check, so the \"taken client\" POST case of TestChildren_Conflicts flips here."
  covers = ["c-1", "c-7"]
  test_contract = ["if the rebuild drops rows, TestMigrate_0005PreservesClients fails: a DB at 0004 with Ada->[Kid phone], Ben->[Kid tablet] holds exactly those rows after Open, and 0005 applies after 0004_buttons.sql", "if the FK/cascade or child_id index is lost, TestSchema_ChildClientsCascade fails: DELETE FROM children leaves no orphan child_clients rows and the index exists", "if the composite key is missing, TestSchema_ChildClientsPK fails: a raw duplicate INSERT (Kid phone, 1) errors with a constraint violation", "if the client check survives in UpdateChild, TestUpdateChild_SharedClient fails: Ada holds Kid phone; UpdateChild(Ben, \"Ben\", [Kid phone]) returns nil and ListChildren shows Kid phone under Ada and Ben", "if the client check survives in CreateChild, TestCreateChild_SharedClient fails: CreateChild(\"Cleo\", [Kid phone]) while Ada holds it returns Cleo with [Kid phone]", "if UpdateChild deletes by client_name, TestUpdateChild_RemoveKeepsOtherOwner fails: Ben saved without Kid phone leaves Ada holding it", "if cascade is by client, TestDeleteChild_KeepsOtherOwner fails: DeleteChild(Ben) leaves Ada holding Kid phone and no row for Ben", "if the name check is lost, the existing ErrNameTaken cases in children_test.go fail unchanged", "if POST /children still conflicts on a held client, TestChildren_CreateShared (internal/api/children_test.go) fails: POST /children {Cy, [Kid phone]} while Ada holds it -> 201 and GET /children lists Kid phone under Ada and Cy; the \"taken client\" POST case is removed from TestChildren_Conflicts, whose name-taken and PUT-name cases stay unchanged"]
  status = "done"

[[task]]
  id = "t-2"
  wave = 1
  title = "Pure ref-count helpers for shared clients"
  files = ["internal/grants/shared.go", "internal/grants/shared_test.go"]
  description = """
New. revertPlan(g, active []store.Grant) -> map[client][]service: g.Services minus those covered by another active grant
(id != g.ID) whose stored Clients include that client; clients left empty are omitted. heldOpen(active, exclude, client)
-> sorted services any active grant other than `exclude` covers on that client, never nil. Keyed on stored grant
clients, never on current ownership.
"""
  covers = ["c-3", "c-4"]
  test_contract = [
    '''if g counts itself, TestRevertPlan_SelfNotCounted fails: g alone in active -> every client gets all of g's services''',
    '''if coverage is per-grant not per-client, TestRevertPlan_OtherClient fails: Ben's youtube grant on Kid tablet does not hold youtube open on Kid phone''',
    '''if coverage is per-grant not per-service, TestRevertPlan_OtherService fails: G1 [youtube, tiktok] and G2 [youtube] both on Kid phone -> G1's plan for Kid phone is [tiktok]''',
    '''if the fully-covered case still writes, TestRevertPlan_FullyHeld fails: Kid phone is absent from the map when another grant covers every one of g's services there''',
    '''if ownership is consulted, TestRevertPlan_StoredClients fails: the plan uses g.Clients verbatim, including a client no child now owns''',
    '''if heldOpen unions across clients or forgets exclude, TestHeldOpen fails: returns only services of grants whose Clients contain the client, minus `exclude`, sorted, [] not nil''',
  ]
  status = "done"

