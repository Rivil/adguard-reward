  wave = 2
  title = "Service worker: routing, precache build, registration"
  files = ["web/src/sw.ts", "web/src/sw.test.ts", "web/src/lib/sw-routing.ts", "web/src/lib/sw-routing.test.ts", "web/vite.config.ts", "web/src/main.ts", "web/tsconfig.sw.json", "web/tsconfig.app.json", "web/package.json"]
  description = "sw-routing.ts (pure, node env, no worker globals): PUBLIC_SHELL = ['/', '/manifest.webmanifest',\n'/favicon.svg', '/icon-192.png', '/icon-512.png']; decide({method, url, mode, origin}, precache:\nSet<string>) -> 'bypass' (non-GET, cross-origin, path starting /api/ or /healthz, or /sw.js) | 'shell'\n(mode navigate -> network-first, fall back to cached /) | 'asset' (path in precache -> cache-first) |\n'bypass' otherwise; cacheName(precache) = 'shell-' + FNV-1a hex of the sorted list so a deploy with\nidentical assets does not churn caches. sw.ts: install -> cache.addAll(self.__PRECACHE__) into\ncacheName, skipWaiting; activate -> delete every other cache, clients.claim(); fetch -> decide(); never\ncache.put anything at runtime (precache only). Typecheck: web/tsconfig.sw.json (lib [\"ES2023\",\n\"WebWorker\"], no DOM, include only src/sw.ts and src/lib/sw-routing.ts); tsconfig.app.json excludes\nsrc/sw.ts; package.json \"check\" becomes svelte-check --tsconfig ./tsconfig.app.json && tsc -p\ntsconfig.node.json && tsc -p tsconfig.sw.json so make typecheck covers the worker without\nduplicate-identifier errors. vite.config.ts (already Stryker-disabled): second rollup input sw:\nsrc/sw.ts, output.entryFileNames puts that chunk at /sw.js (unhashed); an inline precache plugin in\ngenerateBundle replaces the literal self.__PRECACHE__ in the sw chunk with JSON of every emitted\nchunk/asset fileName except sw.js plus PUBLIC_SHELL, and throws if the sw chunk still contains\n\"import \"/\"export \" (must be a classic script) or the token was not found (if rollup ever hoists a\nshared chunk into the worker, switch to compiling sw.ts standalone via transformWithEsbuild +\nemitFile). main.ts: register /sw.js only when import.meta.env.PROD && 'serviceWorker' in navigator\n(dev server stays uncached); main.ts keeps Stryker disable all; sw.ts is covered by sw.test.ts (stubbed\nself/caches/fetch under vitest's node env) so it carries no disable header.\n"
