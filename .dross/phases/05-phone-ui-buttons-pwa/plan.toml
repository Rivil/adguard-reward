[[task]]
  id = "t-7"
  wave = 1
  title = "GrantForm: child, services, duration fieldset"
  files = ["web/src/lib/GrantForm.svelte", "web/src/lib/GrantForm.test.ts"]
  description = "Presentational fieldset shared by the ad-hoc form (Home) and the settings page (Buttons) so validation\nlives once. Uses only the existing Child and Service types from api.ts, so it has no dependency on\nt-5. Props: children: Child[], services: Service[] | null (null = catalogue unavailable), value:\n{child_id: number | null, services: string[], minutes: number} ($bindable, minutes default 60),\ndisabled. Renders <select name=\"child\" aria-label=\"Child\"> (placeholder option when child_id is null;\nauto-selects the only child when exactly one exists), one <input type=\"checkbox\" name=\"service\"\nvalue=id> per catalogue service with its iconUrl image and name, <input type=\"number\" name=\"minutes\"\ninputmode=\"numeric\" min=1 max=1440 step=1 aria-label=\"Minutes\">. Exposes valid ($bindable, derived):\nchild chosen, services non-empty, 1 <= minutes <= 1440 and integer. Services are kept in tick order\n(the first service picks the icon — locked button_icon). A value.services id not in the catalogue\nrenders as a checked row labelled with the raw id and a \"not in AdGuard Home\" hint, still unticks like\nany other, and is never dropped silently. services === null -> a \"service list unavailable\" note, no\ncheckboxes, valid false unless value.services is already non-empty (a stored button can still be saved\nas-is). No submit button of its own; the label field lives in the page.\n"
  covers = ["c-4", "c-8"]
  test_contract = ["if the binding loses tick order or a field, GrantForm.test \"binds child, services and minutes\" fails: select Ada, tick YouTube then TikTok, type 90 -> value {child_id:1, services:['youtube','tiktok'] in tick order, minutes 90}; untick YouTube -> ['tiktok']", "if valid ignores a bound, GrantForm.test \"valid tracks the bounds\" fails: nothing selected -> false; child only -> false; child + service -> true; minutes 0 -> false; 1 -> true; 1440 -> true; 1441 -> false; 1.5 -> false; no services -> false", "if the single-child preselect breaks, GrantForm.test \"one child is preselected\" fails: children [Ada] -> select value '1' and child_id 1 on mount; children [Ada, Ben] -> select value '' and child_id null", "if an unknown service id is dropped silently, GrantForm.test \"unknown service id is kept and marked\" fails: value.services ['gone'] with catalogue [youtube] -> a checked row with text containing gone and \"not in AdGuard Home\"; value.services still ['gone']; unticking it -> []", "if disabled misses a control, GrantForm.test \"disabled greys every control\" fails: disabled true -> select, every checkbox and the minutes input have disabled === true", "if a null catalogue blocks saving a stored button, GrantForm.test \"null catalogue\" fails: services null with value.services ['youtube'] -> note visible, valid true; with [] -> valid false"]
  status = "done"

