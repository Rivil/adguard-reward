[[task]]
  id = "t-12"
  wave = 3
  title = "tap.ts: pure tap outcome and 409 offer orchestration"
  files = ["web/src/lib/tap.ts", "web/src/lib/tap.test.ts"]
  description = "Pure module (node env, per-test mutation attribution) that owns everything a tap does except DOM.\nTapSpec{key, child_id, services, duration, clients}. Deps{createGrant, extendGrant, refresh,\nmerge, grants(): Grant[]} — a fake in tests. runTap(spec, deps) -> Outcome: 'applied' {grant} |\n'partial' {grant, failed: string[]} | 'offer' {targets: Grant[], remaining: string[]} | 'error'\n{code, message}. A key already in the module-level inflight Set returns 'ignored' without a call\n(locked no_confirm: no dialog, but never a double POST). 201 -> merge(grant built from the 201 +\nspec + clients) then refresh(); applied=false -> the same merge plus 'partial' naming failed.\n409 -> await refresh() (its failure ignored), targets = overlapsFor(child, services,\ndeps.grants()).overlapping, falling back to [{id: err.grantId}] when empty (stale list), remaining\nfrom overlapsFor. Any other ApiError or TypeError -> 'error' via messageFor. acceptOffer(offer,\nspec, deps) -> Outcome: for each target in id order extendGrant(id, spec.duration) (404 -> drop\nthat target and add its services to remaining); if remaining is non-empty -> createGrant(remaining)\nthrough the same 201 handling; a 409 there -> 'error' (no second offer, no loop); then refresh().\nErrors name what failed (locked overlap_offer, extend_amount: the offer extends by the tapped\nbutton's duration). Home (t-15) only maps Outcome to DOM.\n"
  covers = ["c-2", "c-3", "c-8"]
  depends_on = ["t-5", "t-10"]
  test_contract = ["if a tap confirms, delays or double-posts (locked no_confirm), tap.test \"runTap posts once and merges the 201\" fails: runTap(b1) -> exactly one createGrant(1, ['youtube','tiktok'], 3600); 201 -> merge called with a Grant carrying the 201's id and ends_at plus spec.services and clients, then refresh once, outcome 'applied'; a second runTap with the same key before the first resolves -> 'ignored' and still one createGrant; after it resolves the key is free again", "if applied=false is swallowed, tap.test \"partial names the client\" fails: 201 {applied:false, failed:['Kid tablet']} -> merge still called, outcome 'partial' with failed ['Kid tablet']", "if a failure is swallowed or mis-coded, tap.test \"errors carry code and message\" fails: TypeError -> 'error' code 'network'; 422 unknown service \"gone\" -> 'error' whose message contains that text; 502 -> code 'adguard_unavailable'; no merge and no refresh in any of the three", "if a 409 does not become an offer (c-3), tap.test \"409 refreshes and computes targets\" fails: createGrant -> 409 grantId 5; refresh resolves and grants() returns [A(id 5, ada, [youtube])] -> outcome 'offer' {targets [A], remaining []}; with grants() returning [] (stale) -> targets [{id:5}] and remaining = spec.services; refresh rejecting does not change the outcome", "if accepting the offer under-delivers (locked overlap_offer), tap.test \"acceptOffer extends each target then creates the rest\" fails: spec [youtube,tiktok,roblox], targets [A(id 3,[youtube]), B(id 1,[tiktok])] -> extendGrant(1, 3600), extendGrant(3, 3600) in id order, then createGrant(1, ['roblox'], 3600), then refresh; outcome 'applied'; targets [A] with spec [youtube] -> one extend, no create", "if an expired target wedges the offer, tap.test \"acceptOffer retries create on 404\" fails: extendGrant(3) -> 404 -> createGrant with ['youtube','roblox'] once; a 409 from that create -> outcome 'error' and no further calls"]
  status = "done"

