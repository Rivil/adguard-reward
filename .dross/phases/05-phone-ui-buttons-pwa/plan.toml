[[task]]
  id = "t-1"
  wave = 1
  title = "Buttons schema and atomic replace store"
  files = ["internal/store/migrations/0004_buttons.sql", "internal/store/buttons.go", "internal/store/buttons_test.go"]
  description = "0004_buttons.sql: buttons(id INTEGER PRIMARY KEY AUTOINCREMENT, position INTEGER NOT NULL UNIQUE,\nlabel TEXT NOT NULL, child_id INTEGER NOT NULL REFERENCES children(id) ON DELETE CASCADE, duration\nINTEGER NOT NULL CHECK (duration > 0) /* seconds */); button_services(button_id INTEGER NOT NULL\nREFERENCES buttons(id) ON DELETE CASCADE, position INTEGER NOT NULL, service_id TEXT NOT NULL,\nPRIMARY KEY (button_id, service_id)). AUTOINCREMENT so an id is never reused across PUTs; FK cascade\nbecause a button has no reason to outlive its child (unlike grants). buttons.go: Button{ID, ChildID\nint64; Label string; Services []string (given order, deduped on first occurrence, never nil);\nDuration time.Duration}; typed *ErrUnknownChild{ChildID}. ListButtons(ctx) runs BOTH reads inside one\nBeginTx (the read tx holds the single connection, so a concurrent Replace cannot commit between the\nbuttons query and the services query): buttons position ASC, then button_services by (button_id,\nposition), each scanned to completion before the next query (single-connection rule), folded in Go,\nempty -> []Button{}. ReplaceButtons(ctx, in []Button) ([]Button, error) in ONE tx: DELETE FROM\nbuttons (cascade clears services); per item SELECT 1 FROM children WHERE id=? -> *ErrUnknownChild\n(rollback, old list intact); INSERT with position = index; returns the stored list with fresh ids.\nIncoming IDs are ignored.\n"
  covers = ["c-1"]
  test_contract = ["if the replace is not atomic, TestButtons_ReplaceAtomic fails: list [A,B] stored; ReplaceButtons([C, D{ChildID: 999}]) -> *ErrUnknownChild{999} and ListButtons still returns [A,B] with their original ids; likewise a second item with Duration 0 (CHECK) leaves the previous list intact", "if order or persistence breaks, TestButtons_OrderPersists fails: Replace [C,A,B] -> List returns labels [C,A,B] with ids ascending; Close, Open same dir -> identical list (ids, labels, services, durations); schema_migrations lists 0004_buttons.sql exactly once, after 0003_grants.sql", "if services are sorted or not deduped, TestButtons_ServicesOrderKept fails: Services [\"youtube\",\"tiktok\",\"youtube\"] reads back [\"youtube\",\"tiktok\"]; [\"tiktok\",\"youtube\"] reads back in that order (locked button_icon)", "if the FK cascade is missing, TestButtons_ChildCascade fails: buttons for ada (two) and ben; DeleteChild(ada) -> (true, nil); List holds only ben's; SELECT count(*) FROM button_services counts only ben's rows", "if empty lists read back as nil, TestButtons_ReplaceEmpty fails: fresh store -> []Button{} non-nil; Replace(nil) -> [] and button_services is empty; a button with Services [] reads back []string{} never nil", "if the child check is outside the tx, TestButtons_ChildCheckInTx fails: a child deleted on another goroutine between two Replace calls yields *ErrUnknownChild, never a raw \"FOREIGN KEY constraint failed\"", "if ids are reused, TestButtons_FreshIDs fails: after Replace [A] (id 1) then Replace [B], B.ID > 1", "if ListButtons reads outside a single tx and can observe a half-written replace, TestButtons_ReplaceRace fails under go test -race: 10 goroutines each Replace a distinct 3-item list while 5 goroutines List for 200 ms -> every List result equals one submitted list exactly (labels and services, no button with an empty service list that was submitted non-empty), never a mix, finishing within 5 s"]
  status = "done"

[[task]]
  id = "t-2"
  wave = 1
  title = "SPA static handler: resolve table, fallback, caching"
  files = ["internal/spa/spa.go", "internal/spa/spa_test.go"]
  description = "internal/spa: pure resolve(fsys fs.FS, path string) (file string, kind kind) with a table test;\nHandler(fsys) http.Handler is thin: GET/HEAD only (405 with Allow); path.Clean, reject ..; a path\nunder /api/ or equal to /healthz -> 404 JSON {\"error\":\"not_found\"}, never HTML; dotfiles (base\nstarting with \".\") and directories -> treated as missing; an existing file -> http.ServeFileFS with\nCache-Control: no-cache for /, /index.html, /sw.js, /manifest.webmanifest; public,\nmax-age=31536000, immutable under /assets/; public, max-age=3600 otherwise; Content-Type:\napplication/manifest+json forced for .webmanifest. \"Has an extension\" is defined as path.Ext(base)\n!= \"\" — so a missing /.gitkeep, like any missing extensioned path, is 404 (never HTML); any other\nmissing path -> index.html 200 no-cache (SPA fallback); index.html itself absent -> 503 text\n\"frontend not built: run make build-web\". No directory listing ever. Tests use fstest.MapFS only;\nthe real embed is wired in t-14.\n"
  covers = ["c-5", "c-6"]
  test_contract = ["if resolve misroutes any class of path, TestResolve_Table fails on fstest.MapFS{index.html, assets/app-abc.js, sw.js, manifest.webmanifest, icon-192.png, .gitkeep}: / -> index.html; /children, /buttons/deep/path -> index.html; /assets/app-abc.js -> that file, kind immutable; /assets/gone.js, /favicon.ico, /old-hash.js, /.gitkeep, /.env -> 404 (dotfile treated as missing, and it carries an extension); /api/v2/x, /api/, /healthz -> api-404; /sw.js -> file, kind no-cache; /assets/ -> index.html (directory treated as missing, no extension)", "if the SPA fallback breaks, TestSPA_Fallback fails: GET /buttons and /children/7 -> 200 text/html, body == index.html, Cache-Control: no-cache; GET /assets/app-abc.js -> 200 immutable; GET /assets/ -> index.html body containing no \"app-abc.js\" link", "if an API-prefixed miss gets HTML, TestSPA_NeverHTMLForAPI fails: GET /api/v2/x, /api/v1/, /healthz -> 404 application/json {\"error\":\"not_found\"}; body never contains <html", "if a missing extensioned path falls back to HTML, TestHandler_MissingAssetIs404 fails: GET /assets/old-hash.js, /favicon.ico and /.gitkeep -> 404 whose Content-Type is not text/html", "if an unbuilt dist serves silently, TestSPA_NotBuilt fails: MapFS{\".gitkeep\"} -> GET / is 503 with body containing \"make build-web\"; MapFS{} same", "if cache headers or method handling regress, TestSPA_CacheHeaders fails: /sw.js and /manifest.webmanifest -> no-cache; /icon-192.png -> max-age=3600; /assets/app-abc.js -> public, max-age=31536000, immutable; a HEAD carries the same headers and no body; POST / -> 405 with Allow containing GET", "if the manifest is served with the wrong type, TestSPA_ManifestType fails: Content-Type for /manifest.webmanifest == application/manifest+json; GET / Content-Type starts text/html", "if traversal escapes the fs, TestSPA_NoListing fails: /../embed.go and /assets/../index.html -> 200 index.html or 400, never a file outside fsys"]
  status = "done"

[[task]]
  id = "t-3"
  wave = 1
  title = "Embed web/dist, gitkeep, Makefile build/lint plumbing"
  files = ["web/embed.go", "web/embed_test.go", "web/dist/.gitkeep", ".gitignore", "web/.gitignore", "Makefile"]
  description = "web/embed.go: package web, //go:embed all:dist, Dist() fs.FS via fs.Sub. A committed web/dist/.gitkeep\n(root .gitignore: web/dist/* + !web/dist/.gitkeep; web/.gitignore: dist/* + !dist/.gitkeep) keeps the\nembed pattern matching when nothing is built, so go vet/go test compile on a fresh clone. Makefile:\nbuild-web runs pnpm build && touch dist/.gitkeep (vite empties outDir); test-go depends on build-web so\nthe Go suite alone never sees an unbuilt dist; lint/fmt exclude ./web/node_modules and ./web/.stryker-tmp\ninstead of all of ./web so embed.go is gofmt-checked. web/embed_test.go is the compile-time proof that\nthe pattern matches on an unbuilt tree. Note for the verifier: gremlins runs go test without make, so\nif its working tree lacks web/dist the t-14 binary tests fatal — t-14 records the precondition.\n"
  covers = ["c-5"]
  test_contract = ["if the embed pattern breaks on an unbuilt tree, TestEmbed_CompilesWithoutBuild (package web) fails to compile; at runtime it asserts Dist() opens and either contains index.html or only .gitkeep", "if the gitignore exceptions are wrong, TestEmbed_GitkeepTracked fails: git ls-files web/dist/.gitkeep (run from the repo root, skipped when git is absent) prints the path, and git check-ignore -q web/dist/assets/x.js exits 0", "if lint stops covering embed.go, a deliberately misformatted web/embed.go makes make lint exit non-zero (recorded by hand in the commit body, not a Go test)"]
  status = "done"

[[task]]
  id = "t-4"
  wave = 1
  title = "Web manifest, PNG icons and shell metadata"
  files = ["web/public/manifest.webmanifest", "web/public/icon-192.png", "web/public/icon-512.png", "web/index.html", "web/src/pwa.test.ts"]
  description = "manifest.webmanifest: name \"adguard-reward\", short_name \"Reward\", id \"/\", start_url \"/\", scope \"/\"\n(locked pwa_scope), display \"standalone\", background_color/theme_color, icons [{src:\"/icon-192.png\",\nsizes:\"192x192\", type:\"image/png\"}, {src:\"/icon-512.png\", sizes:\"512x512\", type:\"image/png\",\npurpose:\"any maskable\"}] — PNG because Chrome's installability check does not accept SVG-only icon\nsets. PNGs are generated once (solid colour + glyph from the existing mark) and committed; the generator\nis not committed. index.html: <title>adguard-reward</title>, <link rel=\"manifest\"\nhref=\"/manifest.webmanifest\">, <meta name=\"theme-color\">, <link rel=\"apple-touch-icon\"\nhref=\"/icon-192.png\">, viewport unchanged. pwa.test.ts runs under node and reads the static files from\ndisk. SW registration in main.ts lands with the worker in t-9.\n"
  covers = ["c-6"]
  test_contract = ["if the manifest loses an installability field, pwa.test \"manifest is installable\" fails: JSON.parse of public/manifest.webmanifest has display === 'standalone', start_url === '/', scope === '/', non-empty name and short_name, icons containing sizes 192x192 and 512x512 both type image/png with src under /", "if an icon is not a real PNG of the declared size, pwa.test \"icons are real PNGs\" fails: for each manifest icon the file exists under public/, its first 8 bytes are the PNG signature, and the IHDR width/height (bytes 16-23) equal the declared size", "if index.html drops the shell metadata, pwa.test \"shell links the manifest\" fails: index.html contains rel=\"manifest\" href=\"/manifest.webmanifest\", a theme-color meta, an apple-touch-icon link, and a <title> that is not \"web\"", "manual, recorded in the verify notes: Chrome on Android against the TLS listener shows the install prompt / Lighthouse \"installable\" and the installed app opens standalone at / (HTTPS is a precondition the tests cannot supply)"]
  status = "done"

[[task]]
  id = "t-5"
  wave = 1
  title = "API client endpoints, pure grant helpers, api.ts kills"
  files = ["web/src/lib/api.ts", "web/src/lib/api.test.ts", "web/src/lib/grants.ts", "web/src/lib/grants.test.ts"]
  description = "api.ts: Route gains 'buttons' (PATHS.buttons = '/buttons'); ApiError gains readonly grantId?: number\nparsed from a numeric grant_id in the envelope (409); types Grant{id, child_id, services, clients,\nstarted_at, ends_at}, GrantCreated{id, ends_at, applied, failed}, ButtonInput{label, child_id, services,\nduration /* seconds */}, Button extends ButtonInput{id}; listGrants(), createGrant(child_id, services,\nduration), extendGrant(id, duration), endGrant(id), listButtons(), saveButtons(ButtonInput[]) (PUT\n{buttons} -> the stored Button[]). The typeof history/location/window guards stay as they are; the\nrouted api.ts keys (d2e9f9c6, 47163e3c) die by test. grants.ts (pure, node env — best mutation\nattribution): MIN_DURATION = 60, MAX_DURATION = 86400 (mirror grants.go); remainingSeconds(endsAt,\nnowMs) = max(0, ceil); formatCountdown(s) -> h:mm:ss from an hour else m:ss; formatDuration(s) -> 1 h,\n30 min, 1 h 30 min, 24 h; ownDuration(g) = clamp(round((ends - started)/1000), MIN, MAX) —\nVERIFY NOTE: the clamp is a deliberate, panel-recorded bend of locked extend_amount (D14 in\npanel/synthesis.md): the raw span exceeds 24 h only after one extension of a 24 h grant, where the\nserver 422s it, so the literal rule has no working implementation there; score it as compliant.\noverlapsFor(childId, services, grants) -> {overlapping: Grant[] (same child, any shared service, id\nASC), remaining: string[] (services in none of them, input order)}; minutesToSeconds/secondsToMinutes.\n"
  covers = ["c-1", "c-2", "c-3", "c-4", "c-7", "c-8"]
  test_contract = ["if a grants/buttons call hits the wrong URL, method or body, api.test \"grants and buttons endpoints hit the exact URL, method and body\" fails: createGrant(1, ['tiktok'], 1800) -> POST /api/v1/grants body {\"child_id\":1,\"services\":[\"tiktok\"],\"duration\":1800} with X-Requested-With; extendGrant(4, 600) -> POST /api/v1/grants/4/extend {\"duration\":600}; endGrant(4) -> POST /api/v1/grants/4/end, no body, resolves undefined on 204; listGrants() unwraps .grants; listButtons() unwraps .buttons; saveButtons([b]) -> PUT /api/v1/buttons {\"buttons\":[b]} and returns the response's .buttons", "if the 409 envelope loses grant_id, api.test \"409 carries grantId\" fails: a 409 {error:'conflict', message, grant_id: 7} rejects with ApiError status 409, code 'conflict', grantId 7; a 409 without grant_id -> grantId undefined; a string grant_id -> undefined", "if the buttons route is unmapped in either direction, api.test \"maps the buttons route both ways\" fails: navigate('buttons') -> pathname /buttons and get(route) 'buttons'; replaceState('/buttons') + popstate -> 'buttons'; /x -> 'home'; / -> 'home'", "if the same-path guard in navigate is mutated (kills survivor keys d2e9f9c6 and 47163e3c), api.test \"navigate to the current path pushes nothing\" fails: at /, vi.spyOn(history, 'pushState'); navigate('home') -> spy called 0 times; navigate('buttons') -> called exactly once with third arg '/buttons' and location.pathname === '/buttons'; navigate('buttons') again -> still once", "if the initial route stops reflecting the URL, api.test \"route reflects the URL at load\" fails: for each of /, /login, /children, /buttons, /nope: history.replaceState(null, '', p); vi.resetModules(); const m = await import('./api'); get(m.route) === 'home'|'login'|'children'|'buttons'|'home'", "if the login route breaks, api.test \"maps the login route both ways\" fails: navigate('login') -> pathname /login and route 'login'; replaceState('/login') + popstate -> 'login'; navigate('home') -> /", "if remainingSeconds rounds down or goes negative, grants.test \"remainingSeconds\" fails: ends_at = now+90.2 s -> 91; now+0 -> 0; now-5 s -> 0", "if the formatters drift, grants.test \"formatCountdown\"/\"formatDuration\" fail: 3661 -> 1:01:01; 59 -> 0:59; 600 -> 10:00; 0 -> 0:00; 86400 -> 24:00:00; formatDuration 3600 -> 1 h, 1800 -> 30 min, 5400 -> 1 h 30 min, 60 -> 1 min, 86400 -> 24 h", "if ownDuration is unclamped (locked extend_amount, bounded per D14), grants.test \"ownDuration\" fails: a grant spanning 1 h -> 3600; spanning 48 h -> 86400; spanning 10 s -> 60", "if overlapsFor misgroups (locked overlap_offer), grants.test \"overlapsFor\" fails: grants A(child 1, [youtube]), B(child 1, [tiktok]), C(child 2, [youtube]); child 1 [youtube, tiktok, roblox] -> overlapping [A,B], remaining [roblox]; child 1 [roblox] -> [], [roblox]; child 2 [youtube] -> [C], []; child 1 [] -> [], []", "if the minute conversions produce fractions, grants.test \"minutes\" fails: minutesToSeconds(90) -> 5400; secondsToMinutes(5400) -> 90; secondsToMinutes(90) -> 2"]
  status = "done"

