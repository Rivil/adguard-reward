  wave = 2
  title = "Buttons HTTP endpoints, validation, Deps wiring"
  files = ["internal/api/buttons.go", "internal/api/buttons_test.go", "internal/api/api.go", "internal/api/login_test.go", "cmd/adguard-reward/main.go"]
  description = "api.go: ButtonStore interface{ListButtons, ReplaceButtons}, Deps.Buttons, routes GET/PUT\n/api/v1/buttons behind requireSession. buttons.go: view {id, label, child_id, services (never null),\nduration (seconds)}; GET -> {buttons:[...]} never null. PUT body {buttons:[{label, child_id, services,\nduration}]} decoded with decodeGrantBody (16 KiB cap, DisallowUnknownFields so a stray \"id\" is 400;\nsingle object, buttons missing/null -> 400). Validation cheapest-first, stopping at the first bad item\nwith message buttons[i].<field>: ...: label trimmed 1-64 runes; duration via checkDuration's bounds with\nthe index in the message; services trimmed/deduped in given order, empty -> 422; then every distinct\nchild_id via Children.GetChild (ErrChildNotFound -> 422, before any AdGuard call); then ONE\nAdGuard.Services read, skipped when the list is empty (unknown id -> 422 naming it; unreachable -> 502,\nnothing stored); then store.ReplaceButtons (*ErrUnknownChild -> 422 — the in-tx re-check). 200 returns\nthe stored list. login_test.go newHarness passes Buttons: st; main.go passes Buttons: st so the binary\nnever nil-derefs between this task and t-14.\n"
