[[task]]
  id = "t-10"
  wave = 2
  title = "Active-grants store: poll, merge, reachability"
  files = ["web/src/lib/activeGrants.ts", "web/src/lib/activeGrants.test.ts"]
  description = "Svelte store module activeGrants = readable {grants: Grant[]; unreachable: boolean; loaded: boolean}.\nrefresh(): a call while one is in flight returns the same promise (no overlap); success -> grants\nreplaced, unreachable=false, loaded=true; ApiError 401 -> state untouched (the api layer routes to\nlogin; a session lapse is not \"unreachable\"); any other failure -> unreachable=true, grants kept as\nthey were (locked unreachable_countdown). merge(g: Grant): upsert by id — a 201 body is server truth\n(id, ends_at), not optimism, so the entry is visible without a second round trip. remove(id).\nstart(intervalMs = 15000): immediate refresh, setInterval, document visibilitychange -> refresh when\nvisible (a backgrounded phone tab catches up on return); returns stop; a second start while started is\na no-op returning the same stop; stop clears the interval and the listener.\n"
  covers = ["c-2", "c-3"]
  depends_on = ["t-5"]
  test_contract = ["if polling overlaps, double-starts or fails to stop, activeGrants.test \"polls on the interval and stops\" fails (fake timers): start(15000) -> one GET immediately; +45 s -> exactly 4 GETs; a GET that never resolves while +30 s elapse -> still 2 GETs total; stop(); +60 s -> no further GET; start twice -> one interval", "if a failed poll blanks the list (locked unreachable_countdown), activeGrants.test \"failure keeps grants and sets unreachable\" fails: first poll returns [g1]; second rejects with TypeError -> grants still [g1], unreachable true; third succeeds -> unreachable false and grants from the response", "if a 401 is treated as unreachable, activeGrants.test \"401 is not unreachable\" fails: a 401 -> unreachable stays false, grants unchanged, the onUnauthorized spy was called once", "if a returning tab does not catch up, activeGrants.test \"visibilitychange refreshes\" fails: with the interval far away, dispatching visibilitychange with visibilityState 'visible' -> one extra GET; 'hidden' -> none", "if merge duplicates or drops entries, activeGrants.test \"merge upserts by id\" fails: merge(g2) on [g1] -> [g1,g2]; merge(g1') (same id, later ends_at) -> [g1',g2] with one entry for that id; remove(2) -> [g1']; the next successful poll replaces everything"]
  status = "done"

