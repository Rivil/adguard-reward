  files = ["web/src/lib/ActiveGrants.svelte", "web/src/lib/ActiveGrants.test.ts"]
  description = "Reads activeGrants; props childNames: Map<number,string>, serviceNames: Record<string,string>\n(fallback: raw id). <section aria-label=\"Active grants\"> with heading \"Unlocked now\" and\ndata-badge=\"unreachable\" badge \"Can't reach server\" when store.unreachable; empty -> \"Nothing is\nunlocked right now\". Per grant <li data-grant={id}>: child name, service names joined \", \", <time\ndata-countdown> from formatCountdown(remainingSeconds(ends_at, now)), buttons Extend\n{formatDuration(ownDuration(g))} and End. One setInterval(1000) updates now for the whole list;\nonDestroy clears it. The countdown is recomputed from ends_at every tick, never decremented. When a\ngrant's remaining hits 0 it shows 0:00 and triggers ONE refresh() for that id (Set guard); the entry\nleaves only when the server list no longer has it. A row's two buttons are disabled while its own\nrequest is pending. Extend -> extendGrant(id, ownDuration(g)) then refresh(); 404 -> refresh() silently\n(already gone); other error -> <p role=\"alert\"> inside that li with messageFor. End -> endGrant(id)\nthen refresh(); 502 -> alert with the server message (names the clients), entry stays; 404 ->\nrefresh() silently.\n"
  covers = ["c-3"]
  depends_on = ["t-10"]
  test_contract = ["if the countdown decrements instead of recomputing from ends_at, ActiveGrants.test \"countdown follows ends_at\" fails (fake timers + setSystemTime): grant ends in 10 min -> 10:00; advance 1 s -> 9:59; setSystemTime(+5 min) without running timers, then advance 1 s -> 4:58; a 2 h grant reads 2:00:00", "if expiry hides the row without the server, ActiveGrants.test \"expiry asks the server\" fails: at 0:00 exactly one extra GET /api/v1/grants; while the mock still lists the grant it stays rendered at 0:00 and 5 more ticks add no further GET; when the mock drops it, the li disappears and, if it was the only grant, \"Nothing is unlocked right now\" shows", "if extend posts anything but the grant's own (clamped) duration (locked extend_amount), ActiveGrants.test \"extend posts own duration\" fails: started/ends 1 h apart -> button text Extend 1 h and POST body {\"duration\":3600}; 1 h 30 min apart -> Extend 1 h 30 min and {\"duration\":5400}; 48 h apart -> {\"duration\":86400}; then GET is re-issued and the new ends_at is reflected in the countdown", "if a failed end drops the row or swallows the message, ActiveGrants.test \"end 502 keeps the entry\" fails: end -> 502 adguard_unavailable \"could not re-block Kid phone\" -> alert inside li[data-grant] with text containing Kid phone, li still present, no extra GET; end -> 204 -> GET re-issued and the mock's list without it empties the panel", "if row busy-state leaks across rows, ActiveGrants.test \"row is busy while its own request is pending\" fails: click End on row 7 with a never-settling POST -> both of row 7's buttons disabled and row 8's not; after it resolves they are enabled", "if an extend 404 surfaces as an error, ActiveGrants.test \"extend 404 refreshes silently\" fails: extend -> 404 -> no alert, one GET, li gone when the mock omits it", "if a failed poll blanks the panel (locked unreachable_countdown), ActiveGrants.test \"unreachable badge\" fails: poll rejects -> [data-badge=\"unreachable\"] visible, every li still present and the countdown still ticks (advance 1 s -> decremented text); next success -> badge gone", "if the interval outlives the component, ActiveGrants.test \"unmount stops ticking\" fails: unmount(); advance 60 s -> no GET, no thrown error, vi.getTimerCount() is 0", "if name lookup drops a fallback, ActiveGrants.test \"names\" fails: childNames has 1->Ada; serviceNames lacks gone -> li text contains Ada, YouTube and gone"]
