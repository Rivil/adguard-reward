  status = "done"

[[task]]
  id = "t-9"
  wave = 5
  title = "Answer 502 when adoption's client read fails"
  files = ["internal/grants/clients.go", "internal/grants/clients_test.go", "internal/api/children.go", "internal/api/children_test.go", "internal/api/import_adguard_test.go"]
  description = "Verify remediation for the adguard_failure FLAG: when the Clients read inside AdoptClients fails with an error adguardDown does not match, such as an undecodable 200 body, writeAdoptError answers 500, against the locked any-failure-is-502 and its own doc comment. AdoptClients marks that read's failure with a typed error and writeAdoptError answers it through writeAdGuardError. A store read inside the engine stays 500."
  covers = ["c-4"]
  test_contract = ["if AdoptClients returns the read error unmarked, its grants test fails: an undecodable /control/clients body gives the typed read error, and errors.Is still reaches the cause", "if writeAdoptError misses the typed error, the child create test fails: an undecodable clients body on a create with clients is 502 adguard_unavailable with no child row", "if the import path regresses, the import test fails: AdoptClients failing with the typed read error gives 502 and an empty ExportSetup, and a retry gives 200, not 409", "if the 502 widens to store failures, TestChildUpdate_AdoptStoreReadFails fails: a store read failing inside adopt stays 500 internal"]
  status = "done"
