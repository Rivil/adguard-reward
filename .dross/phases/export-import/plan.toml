  description = "Verify remediation for the c-4 FLAG: a 400-class decode problem names the field but not the record (unknown field id with no path; buttons.duration with no index). After the header check, decode the top level strictly into per-list raw messages, then strict-decode each element so a problem reads buttons[2].duration or children[1]: unknown field. A nil list must stay nil so the required-lists check still separates absent or null from []."
