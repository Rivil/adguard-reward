[[task]]
  id = "t-1"
  wave = 1
  title = "Grants schema and CAS store queries"
  files = ["internal/store/migrations/0003_grants.sql", "internal/store/grants.go", "internal/store/grants_test.go"]
  description = "0003_grants.sql: grants(id INTEGER PRIMARY KEY, child_id INTEGER NOT NULL, status TEXT NOT NULL\nCHECK (status IN ('active','expired','ended')), started_at INTEGER NOT NULL, ends_at INTEGER NOT\nNULL, ended_at INTEGER) — Unix seconds UTC like sessions; deliberately no FK to children (a grant\noutlives its child, locked client_set). grant_services(grant_id REFERENCES grants(id) ON DELETE\nCASCADE, child_id, service_id, active INTEGER NOT NULL, PK (grant_id, service_id)) with partial\nUNIQUE INDEX grant_services_live_idx (child_id, service_id) WHERE active = 1; grant_clients(grant_id\n... CASCADE, client_name, PK (grant_id, client_name)); index grants(status, ends_at).\ngrants.go: Grant{ID, ChildID int64; Status string; Services, Clients []string (sorted, never nil);\nStartedAt, EndsAt time.Time}; consts StatusActive/StatusExpired/StatusEnded; sentinels\nErrGrantNotFound and typed *ErrGrantOverlap{ExistingID int64, ServiceID string}.\nCreateGrant(ctx, childID, services, clients, startedAt, endsAt) in one tx: SELECT the live index\nper (child, service) → typed overlap error naming the first collision, else INSERT all three\ntables; lists normalised like normaliseClients. ListActiveGrants(ctx) id ASC, active only, folded\nfrom one query over grant_services then one over grant_clients, each scanned to completion\n(single-connection rule). GetGrant(ctx, id) any status. ExtendGrant(ctx, id, newEndsAt) (Grant,\nerror) WHERE status='active', 0 rows → ErrGrantNotFound. SetGrantStatus(ctx, id, from, to string,\nat time.Time) (bool, error): one tx, UPDATE grants ... WHERE id=? AND status=from, and when a row\nchanged UPDATE grant_services SET active=0 — this CAS is the only exit from active.\n"
  covers = ["c-1", "c-2", "c-6"]
  test_contract = ["if the partial unique index or the overlap SELECT is lost, TestGrants_OverlapPerChildService fails: CreateGrant(ada, [\"youtube\",\"tiktok\"]) then CreateGrant(ada, [\"tiktok\"]) returns *ErrGrantOverlap{ExistingID: first, ServiceID: \"tiktok\"} and one grants row; CreateGrant(ben, [\"tiktok\"]) succeeds; PRAGMA index_list('grant_services') shows grant_services_live_idx partial and unique", "if the CAS does not flip grant_services.active, TestGrants_OverlapClears fails: after SetGrantStatus(id, active, expired) → (true, nil), CreateGrant(ada, [\"tiktok\"]) succeeds; likewise after active→ended", "if SetGrantStatus is not compare-and-set, TestGrants_StatusCAS fails: (active→expired) → true; second call → false; (active→ended) → false and GetGrant still expired; SetGrantStatus(999, …) → (false, nil), not an error", "if ListActiveGrants leaks non-active rows, TestGrants_ListActiveOnly fails: three grants, one expired, one ended → exactly the active one with full Services/Clients; empty store → non-nil empty slice; ids ASC", "if ExtendGrant touches non-active rows, TestGrants_ExtendActiveOnly fails: ExtendGrant(activeID, t+30m).EndsAt == t+30m and GetGrant agrees; ExtendGrant(endedID) and (999) → ErrGrantNotFound, ended row's ends_at unchanged", "if a grant's client list follows the child mapping (locked client_set), TestGrants_ClientsFrozen fails: CreateGrant with clients [\"Kid phone\",\"Kid tablet\"] then DeleteChild(ada) → (true, nil); GetGrant/ListActiveGrants still return both names and ada's old child_id", "if CreateGrant is not atomic, TestGrants_CreateRollsBack fails: a CreateGrant whose second service overlaps leaves no grants, grant_services or grant_clients rows for the attempt", "if rows do not persist or lists are not normalised, TestGrants_CreatePersist fails: CreateGrant(ada, [\"youtube\",\"tiktok\",\"youtube\"], [\" Kid phone\",\"Kid phone\"]) → Services [\"tiktok\",\"youtube\"], Clients [\"Kid phone\"]; Close, Open same dir, ListActiveGrants returns it with identical id/lists and StartedAt/EndsAt equal at second precision; schema_migrations lists 0003_grants.sql exactly once", "if empty lists read back as nil, TestGrants_EmptyLists fails: services [] / clients [] read back as []string{}, never nil", "if ListActiveGrants nests a query on the single connection, TestGrants_ListRace fails under go test -race: 10 goroutines calling ListActiveGrants while another creates/expires for 20 cycles complete within 5 s; every returned grant carries a complete service list, never a partial one"]
  status = "done"

[[task]]
  id = "t-2"
  wave = 1
  title = "AdGuard set-diff/union writes and fake helpers"
  files = ["internal/adguard/clients.go", "internal/adguard/clients_test.go", "internal/adguard/adguardtest/server.go", "internal/adguard/adguardtest/server_test.go"]
  description = "RemoveBlockedServices(ctx, clientName, ids) and AddBlockedServices(ctx, clientName, ids) on\nupdateClient, so the current list is re-read under c.rmw and edited in place inside the mutate\nclosure: Remove = current minus ids; Add = sorted union(current, ids); written as [] never null;\nevery other field verbatim; the existing global-list warn line is kept. Neither path uses a\ncaller-supplied replace list, so a parent's concurrent edit to an unrelated id survives.\nThe no-op skip lives HERE: when the computed list equals the current one (after nonNil/sort/\ndedup) the mutate closure signals skip and updateClient returns nil without POSTing — so every\nAdd/Remove costs exactly one GET /control/clients and at most one POST. adguardtest gains BlockedServices(name) ([]string, bool) (stored own list, decoded, nil-safe,\nok=false for unknown), RemoveClient(name) (later GET omits it; POST /update for it answers 400),\nand CountRequests(method, path) int (exact-match counter).\n"
  covers = ["c-1", "c-3"]
  test_contract = ["if Add replaces instead of unioning, TestAddBlockedServices_Union fails: MutateClient(\"Kid phone\") → [\"youtube\",\"roblox\"]; Add([\"tiktok\",\"youtube\"]) → fake list [\"roblox\",\"tiktok\",\"youtube\"]; update body still carries future_field 42", "if the no-op skip is lost, TestAddBlockedServices_Idempotent fails: Add twice with the same ids → same list; the first call issues one update POST, the second issues none (CountRequests delta 0) while still issuing one GET /control/clients; Remove of ids already absent likewise issues no POST", "if Remove mishandles absent ids or a null list, TestRemoveBlockedServices_Diff fails: \"Kid phone\" after Remove([\"tiktok\",\"nonexistent\"]) → [\"youtube\"]; Remove on \"Old laptop\" (null fixture) does not error and issues no POST (null and [] are the same empty set)", "if an unknown client is written anyway, TestRemoveAdd_NotFound fails: both against \"Nobody\" → errors.Is(err, ErrClientNotFound), CountRequests(\"POST\",\"/control/clients/update\") == 0", "if the new writers bypass the rmw mutex, TestSetBlockedServices_Serialised (extended) fails: Hang(\"/control/clients/update\", 30ms) with 10 goroutines mixing Add/Remove/SetBlockedServices → MaxInFlightUpdates() == 1", "if the fake helpers are wired wrong, TestFake_GrantHelpers fails: RemoveClient(\"Kid tablet\") → GET lists two clients, POST /update for it → 400; BlockedServices(\"Kid phone\") == [\"youtube\",\"tiktok\"] from the fixture and reflects MutateClient; (\"Old laptop\") == [] ok; (\"Nobody\") ok=false; CountRequests counts only exact method+path matches"]
  status = "done"

[[task]]
  id = "t-3"
  wave = 2
  title = "Grant engine: create, timer expiry, extend, end"
  files = ["internal/grants/grants.go", "internal/grants/grants_test.go"]
  description = "Package grants owns every AdGuard write made for a grant and is the only thing that transitions\nstatus. Interfaces Store (CreateGrant, ListActiveGrants, GetGrant, ExtendGrant, SetGrantStatus —\n*store.Store) and AdGuard (Clients, RemoveBlockedServices, AddBlockedServices — *adguard.Client).\nOptions{Now func() time.Time, AfterFunc func(time.Duration, func()) Timer, ApplyTimeout\ntime.Duration (default 4 s), Log}; Timer interface{ Stop() bool }; defaults time.Now/time.AfterFunc.\nEngine{mu sync.Mutex; timers map[int64]Timer}; mu is held across the whole read-decide-write of\nevery mutating operation, and each mutating operation (Create's apply loop, expire/End's revert,\nt-4's pass) derives ONE ApplyTimeout-bounded ctx that every AdGuard call it makes shares — never\none timeout per call — so a hung AdGuard can hold mu for at most ApplyTimeout regardless of client\ncount. List(ctx) ([]store.Grant, error) is ListActiveGrants without taking mu (the store's single\nconnection already serialises it). Exported consts MinDuration = 60 s and MaxDuration = 24 h live\nhere (package grants owns the duration vocabulary); the engine does NOT enforce them — the API\nlayer does. Create(ctx, childID, services, clients, d) (Result{Grant, Applied bool, Failed\n[]string}, error): store.CreateGrant (overlap passes through), then one Clients() read for the\nglobal flag — if that read fails, every stored client goes into Failed, Applied=false, zero update\nPOSTs, row active — then RemoveBlockedServices per stored client in order (the adguard-side skip\nmeans an already-unblocked client costs no POST); a client that errors (incl.\nErrClientNotFound and deadline), or whose live UseGlobalBlockedServices is true (no write issued),\ngoes into Failed; the row is never rolled back (locked partial_apply); arm timers[id]. expire(id):\nunder mu, GetGrant; not active or Now() < EndsAt (extended meanwhile) → re-arm and return; else\nrevert: AddBlockedServices on every stored client, ErrClientNotFound counts as reverted, any other\nfailure → leave active, log warn, no status change; all ok → SetGrantStatus(active→expired), drop\ntimer. Extend(ctx, id, d): under mu, ExtendGrant(EndsAt+d), stop old timer, arm new. End(ctx, id)\nerror: under mu, GetGrant, not active → ErrGrantNotFound; revert; any client failed →\n*ErrRevertFailed{Clients} and the grant stays active with its timer; else\nSetGrantStatus(active→ended), stop timer. Close() stops every timer. Tests use a fake clock\nwhose Advance(d) fires due timers synchronously on the calling goroutine. Every test that\nasserts on Kid tablet's own list first mutates it off the global list (the fixture ships it\nwith use_global_blocked_services: true, under which AdGuard ignores the per-client list).\n"
  covers = ["c-1", "c-3", "c-6"]
  depends_on = ["t-1", "t-2"]
  test_contract = ["if Create does not unblock via the locked RMW, TestEngine_CreateUnblocks fails: Kid tablet first mutated off the global list with own [\"youtube\"]; clients [\"Kid phone\",\"Kid tablet\"], services [\"youtube\"] → BlockedServices(\"Kid phone\") == [\"tiktok\"], (\"Kid tablet\") == [], Applied true, Failed == []string{}, Grant.EndsAt == t0+d; LastUpdate() still carries future_field 42", "if Create writes when nothing changes, TestEngine_CreateNoOpWrite fails: services [\"roblox\"] (absent from Kid phone) → CountRequests(\"POST\",\"/control/clients/update\") == 0 and Applied true", "if a global-list or missing client is silently treated as applied, or a failed pass read attempts blind writes, TestEngine_CreateFailedClients fails: clients [\"Kid tablet\"] untouched (use_global true) → Applied false, Failed [\"Kid tablet\"], zero update POSTs, row active; clients [\"Ghost\"] → Failed [\"Ghost\"], row active; SetStatus(\"/control/clients\", 500) with clients [\"Kid phone\",\"Kid tablet\"] → err nil, Applied false, Failed both names, zero update POSTs, row active", "if a partial apply rolls the row back (locked partial_apply), TestEngine_PartialApply fails: Kid tablet first mutated off the global list with own [\"youtube\"], then SetUpdateStatus(\"Kid tablet\", 500) → err nil, Applied false, Failed [\"Kid tablet\"], Kid phone unblocked, ListActiveGrants holds the grant, and the fake saw an update POST for Kid tablet (the 500 path fired, not the global-list path)", "if ApplyTimeout is per call instead of per operation, TestEngine_CreateDeadline fails: clients [\"Kid phone\",\"Kid tablet\"] (tablet off the global list), Hang(\"/control/clients/update\", 8s) with ApplyTimeout 1 s → Create returns within 1.5 s wall clock (not 2 × 1 s), Applied false, Failed names both clients, row exists", "if List takes mu or a revert holds mu past ApplyTimeout, TestEngine_ListUnblocked fails: ApplyTimeout 200 ms, Hang(\"/control/clients/update\", 5 s); Advance(d) on one goroutine (revert hangs) → List(ctx) on another returns within 50 ms, and a concurrent Create for a different child returns within 1 s wall clock", "if the timer revert is not a set-union or not idempotent, TestEngine_TimerReverts fails: MutateClient adds \"roblox\" to Kid phone mid-grant; Advance(d) → both clients list the granted id again (Kid phone == [\"roblox\",\"tiktok\",\"youtube\"]), status expired; calling expire(id) again issues zero further update POSTs and the lists are identical", "if a failed revert marks the grant expired, TestEngine_RevertFailureStaysActive fails: SetUpdateStatus(\"Kid phone\", 500), Advance(d) → still active, Kid tablet re-blocked, Kid phone not, warn log names \"Kid phone\"; clear fault, expire(id) again → Kid phone re-blocked, expired", "if a deleted device wedges the grant, TestEngine_MissingClientExpires fails: RemoveClient(\"Kid tablet\") after Create, Advance(d) → Kid phone re-blocked, grant expired (not stuck active)", "if Extend does not reschedule, TestEngine_ExtendReschedules fails: Extend(id, 10m) → EndsAt == t0+d+10m; Advance(d) → still active, update count unchanged (stale timer re-armed, not reverted); Advance(10m) → expired and re-blocked; Extend on an expired id and on 999 → ErrGrantNotFound", "if End and the timer are not serialised under mu, TestEngine_EndVsTimerRace fails under go test -race: Hang(\"/control/clients/update\", 20ms); End(id) on one goroutine while Advance(d) fires the timer on another → grant is exactly one of ended/expired, both clients list the id once, neither goroutine errored \"not active\" for a grant it had itself reverted", "if End swallows a failed revert or flips a non-active grant, TestEngine_EndRevertFailure fails: SetUpdateStatus(\"Kid phone\", 500) → End returns *ErrRevertFailed{Clients: [\"Kid phone\"]}, grant still active, Kid tablet re-blocked; End on an ended grant and End(999) → ErrGrantNotFound with zero further update POSTs; after a successful End, Advance past the old EndsAt leaves status \"ended\"", "if engine operations overlap AdGuard writes, TestEngine_Serialised fails under go test -race: Hang(\"/control/clients/update\", 30ms) with Create/End from 8 goroutines keeps MaxInFlightUpdates() == 1"]
  status = "done"

[[task]]
  id = "t-4"
  wave = 3
  title = "Reconciler pass, drift repair, startup pass"
  files = ["internal/grants/reconcile.go", "internal/grants/reconcile_test.go"]
  description = "Reconcile(ctx) (Stats{Grants, Reverted, Repaired, Writes int}, error) on Engine, under mu:\nListActiveGrants; empty → return without touching AdGuard. Else ONE Clients() read for the pass;\nper grant in id order: Now() >= EndsAt → revert+CAS exactly as expire; else per stored client\npresent in the read, ids := granted ∩ client.BlockedServices, non-empty →\nRemoveBlockedServices(client, ids) (one write per drifted client, none otherwise); absent client\n→ skipped with a debug line; a UseGlobalBlockedServices client is never repaired (its own list\nis irrelevant while the flag is set and the global list is never written) — it is reported once,\nin Create's Failed, and the phase-03 migration offer is the remedy; any active grant with no armed\ntimer gets one (post-restart). A Clients() error aborts the pass with no status change and no\nwrites. GET accounting per pass: exactly one pass read plus one per Add/Remove call (each re-reads\nunder the RMW); POSTs only for clients whose list actually changes (t-2's skip). Start(ctx) error:\none Reconcile bounded by ctx; errors returned for main to log, never fatal. Run(ctx, interval):\nticker loop like auth.RunSweeper, each pass under an ApplyTimeout-bounded child ctx, logs errors,\nexits on ctx.Done; passes never overlap (mu).\n"
  covers = ["c-4", "c-5"]
  depends_on = ["t-3"]
  test_contract = ["if drift repair writes the wrong client or the pass reads more than once itself, TestReconcile_DriftRepaired fails: grant [\"tiktok\"] on [\"Kid phone\",\"Kid tablet\"] (Kid tablet first mutated off the global list); MutateClient puts \"tiktok\" back on Kid phone → Reconcile → Kid phone == [\"youtube\"], Stats.Repaired 1, exactly one update POST (Kid tablet untouched), exactly two GET /control/clients in the pass (the pass read + the one RMW re-read)", "if a quiet pass issues writes, TestReconcile_NoopNoWrites fails: an active undrifted grant → zero update POSTs and exactly one GET /control/clients; no active grants → zero requests of any kind", "if a missed timer is not caught, TestReconcile_RevertsOverdue fails: engine built with an AfterFunc that never fires; Advance past EndsAt; Reconcile → both clients re-blocked, status expired, Stats.Reverted 1", "if an already-reverted overdue grant is re-written, TestReconcile_RevertIdempotent fails: a store-seeded overdue grant on two clients whose services are already all present → Reconcile marks it expired with zero update POSTs and exactly 1 + 2 GET /control/clients (pass read + one RMW re-read per client)", "if the reconciler does not converge a partial apply, TestReconcile_ConvergesPartialApply fails: Kid tablet first mutated off the global list, SetUpdateStatus(\"Kid tablet\", 500) during Create, then clear the fault → Reconcile writes exactly one update and Kid tablet is unblocked", "if a hung AdGuard holds mu past ApplyTimeout, TestReconcile_PassBounded fails: ApplyTimeout 200 ms, Hang(\"/control/clients\", 5 s) → Reconcile returns an error within 1 s, no status change; a Create started during the hang returns within 1.5 s wall clock", "if an AdGuard read failure changes state, TestReconcile_AdGuardDown fails: SetStatus(\"/control/clients\", 500) on an overdue grant → Reconcile returns an error, status still active, update count unchanged; clearing the fault and re-running reverts and expires it", "if Reconcile and End interleave, TestReconcile_EndRace fails under go test -race: Hang(\"/control/clients\", 30ms); Reconcile on one goroutine, End(id) on another → grant is ended and \"tiktok\" is on both clients' lists (the pass ran wholly before or wholly after End)", "if Start does not arm timers for live grants, TestReconcile_StartArmsTimers fails: rows created via the store directly (no engine), one overdue and one live with a drifted id; Start → the overdue one reverted+expired, the live one repaired, and Advance to its EndsAt fires a revert with no further Reconcile", "if a deleted device aborts the pass, TestReconcile_MissingClient fails: RemoveClient(\"Kid tablet\"); an overdue grant on both → Kid phone re-blocked, status expired, no error returned", "if Run overlaps passes or ignores ctx, TestReconcile_RunLoop fails: Run with interval 20 ms and Hang(\"/control/clients\", 50 ms) for 300 ms → MaxInFlightUpdates() ≤ 1 and never two concurrent GET /control/clients; cancelling ctx returns Run within 100 ms"]
  status = "done"

[[task]]
  id = "t-5"
  wave = 3
  title = "Grants HTTP endpoints, validation, Deps wiring"
  files = ["internal/api/grants.go", "internal/api/grants_test.go", "internal/api/api.go", "internal/api/errors.go", "internal/api/login_test.go"]
  description = "errors.go: CodeUnprocessable = \"unprocessable\". api.go: api-local Grants interface (Create, List,\nExtend, End over *grants.Engine's signatures), Deps.Grants, routes GET/POST /api/v1/grants,\nPOST /api/v1/grants/{id}/extend, POST /api/v1/grants/{id}/end, all behind requireSession.\ngrants.go: body {child_id int64, services []string, duration int (seconds)} decoded like\ndecodeChild (16 KiB, no unknown fields, single object → 400); bounds are t-3's exported\ngrants.MinDuration / grants.MaxDuration, shared by create and extend; duration outside → 422;\nservices trimmed/deduped, empty → 422; child via Children.GetChild first (404 before any AdGuard\ncall); child with no clients → 422; ids validated against AdGuard.Services (unknown → 422 naming\nit; catalogue unreachable → 502). Create → 201 {id, ends_at, applied, failed};\n*store.ErrGrantOverlap → 409 {error:\"conflict\", message, grant_id}. GET → {grants:[{id, child_id,\nservices, clients, started_at, ends_at}]} with RFC3339 UTC times and never-null arrays. extend:\n{duration} same bounds → 200 {id, ends_at}; ErrGrantNotFound and non-numeric id → 404. end: 204;\nnot found → 404; *grants.ErrRevertFailed → 502 adguard_unavailable naming the clients (grant stays\nactive). login_test.go: newHarness builds a *grants.Engine on the harness store and fake with\nNow: c.Now and ApplyTimeout: harnessApplyTimeout (a package-level test var defaulting to 4 s;\na test overrides it and restores it in Cleanup, mirroring sweepInterval in main_test), Close on\ncleanup, and passes Grants: eng.\n"
  covers = ["c-1", "c-2", "c-6"]
  depends_on = ["t-3"]
  test_contract = ["if any grants route escapes the session or CSRF gate, TestGrants_Gated fails: all four routes without a cookie → 401; the three POSTs with a cookie but no X-Requested-With → 403, grants table empty afterwards and the fake saw no update POST", "if the create/list contract drifts, TestGrants_CreateAndList fails: POST {ada, [\"tiktok\"], 1800} → 201 with id > 0, applied true, failed [], ends_at parsing as RFC3339 == started_at+30m; BlockedServices(\"Kid phone\") lacks \"tiktok\"; GET lists exactly it with clients == ada's clients at creation and ends_at byte-equal to the 201's; after SetGrantStatus(id, active, expired) via the store, raw GET body is {\"grants\":[]}", "if validation order or bounds drift, TestGrants_Validation fails: duration 59 → 422, 86401 → 422, 60 and 86400 → 201 (different children); services [\"nope\"] → 422 whose message contains \"nope\"; services [] and [\"\"] → 422; a child with clients [] → 422; {child_id: 999} → 404 with no /control/blocked_services/all request; unknown field / non-object / 20 KiB body → 400; after every non-201 the store has no new row and no update POST was made", "if the overlap lock is not surfaced as 409, TestGrants_Overlap409 fails: second POST for ada [\"tiktok\",\"roblox\"] → 409 with .error \"conflict\" and .grant_id == first id, GET still lists one; ben [\"tiktok\"] → 201", "if partial apply is not reported (locked partial_apply), TestGrants_PartialApplyBody fails: Kid tablet mutated off the global list with own [\"youtube\"], SetUpdateStatus(\"Kid tablet\", 500) → 201 applied false failed [\"Kid tablet\"], GET lists it, Kid phone unblocked", "if the 5 s bound is not honoured end-to-end, TestGrants_ApplyDeadline fails: harnessApplyTimeout = 100 ms (restored in Cleanup) and Hang(\"/control/clients/update\", 2 s) → POST returns 201 applied false failed [\"Kid phone\"] in under 1 s wall clock", "if an unreadable catalogue creates a row, TestGrants_CatalogueDown fails: SetStatus(\"/control/blocked_services/all\", 500) → 502 adguard_unavailable, no row created", "if extend/end contracts drift, TestGrants_ExtendEnd fails: extend {600} → 200 with ends_at == previous ends_at + 10 m exactly (not from now) and GET reflects it; extend {30} and {86401} → 422 with ends_at unchanged; end → 204 and BlockedServices(\"Kid phone\") lists the id again before the response is read; extend and end on that id → 404; /grants/abc/end, /grants/999/extend → 404", "if a failed end revert is reported as success, TestGrants_EndRevertFails fails: SetUpdateStatus(\"Kid phone\", 500) → POST end is 502 whose message contains \"Kid phone\", GET still lists the grant", "if arrays serialise as null, TestGrants_ViewShape fails: raw GET body contains \"services\":[\"tiktok\"] and \"clients\":[\"Kid phone\"] and never the substring :null"]
  status = "done"

[[task]]
  id = "t-6"
  wave = 4
  title = "Wire engine into main; restart and drift proofs"
  files = ["cmd/adguard-reward/main.go", "cmd/adguard-reward/main_test.go"]
  description = "main.go: var reconcileInterval = 60 * time.Second beside sweepInterval; after store.Open build\neng := grants.New(st, client, grants.Options{Log: log}) (defer Close); eng.Start(ctx) runs BEFORE\nnet.Listen, bounded by a 30 s context so an unreachable AdGuard cannot hold the listener closed;\nits error is logged (\"startup reconcile\", err) and never fatal (startup_probe precedent);\nGrants: eng in api.Deps; go eng.Run(ctx, reconcileInterval) beside the prober and sweeper.\nmain_test.go: helpers seedGrant(t, dataDir, clients, services, endsAt) (opens the store, creates\na child and an active grant, closes) and a startWith(t, args, env, onListen) variant so a test\ncan observe fake state at the instant the listener opens. Restart tests rewind ends_at through\nst.DB() between runs.\n"
  covers = ["c-1", "c-4", "c-5"]
  depends_on = ["t-4", "t-5"]
  test_contract = ["if the startup pass does not run before the listener, TestRun_GrantRestoredAfterRestart fails: run, login, POST child + 60 s grant (Kid phone loses the id), stop (exit 0), UPDATE grants SET ends_at = now-60, start again on the same data_dir: inside the onListen callback, before any HTTP call, BlockedServices(\"Kid phone\") already contains the id; GET /api/v1/grants with the old cookie → {\"grants\":[]}", "if a live grant is lost across restart, TestRun_GrantSurvivesRestart fails: restart with an un-rewound ends_at → GET lists the grant with the same id, services, clients and the same ends_at string", "if Start does not re-arm timers, TestRun_LiveGrantRearmed fails: restart with ends_at rewound to now+2 s and reconcileInterval = 1 h; within 5 s of listening the fake shows the id re-blocked (only the timer could have done it)", "if the reconciler is not wired on reconcileInterval, TestRun_ReconcilerDrift fails: reconcileInterval = 50 ms (restored in Cleanup); after POST grant, MutateClient re-adds the id on Kid phone; within 2 s it is removed again; with no drift the fake sees zero update POSTs over 500 ms; with reconcileInterval at 60 s the same drift is still present after 500 ms", "if an unreachable AdGuard at boot blocks or kills the server, TestRun_StartupAdGuardDown fails: SetStatus(\"/control/clients\", 500) with a seeded overdue grant → run still reaches onListen within 10 s, exit code is not 1, stderr contains \"startup reconcile\", grant still active; clearing the fault with reconcileInterval = 50 ms restores the block within 2 s", "if the startup pass leaks secrets or breaks boot ordering, TestRun_NoSecretsInLogs and the existing healthz test fail: stderr after a startup pass with a seeded grant contains neither svcPass nor aiKey; healthz behaviour unchanged"]
  status = "done"
