[phase]
  id = "06-deploy-nora"
  title = "Deploy on nora: systemd unit, static build, tailnet HTTPS"
  milestone = "v0.1"

[[criteria]]
  id = "c-1"
  text = "deploy/adguard-reward.service runs the binary with DynamicUser=yes, StateDirectory=adguard-reward, ExecStart --config /etc/adguard-reward/config.yaml, LoadCredential for the AdGuard password, and hardening (NoNewPrivileges, ProtectSystem=strict, PrivateTmp); a Go test parses the unit and asserts those keys"

[[criteria]]
  id = "c-2"
  text = "make build-linux produces a statically linked linux/amd64 binary (CGO_ENABLED=0) with the git-describe version stamped via -X main.version and reported by /healthz"

[[criteria]]
  id = "c-3"
  text = "When data_dir is unset and systemd sets $STATE_DIRECTORY, the binary stores its database there; with neither set it keeps the ./data default — both asserted by test"

[[criteria]]
  id = "c-4"
  text = "make deploy-nora builds, copies the binary to nora over ssh, installs the unit and (first run only) the example config and credential file, restarts the service, and fails unless /healthz on nora answers 200 reporting the just-built version"

[[criteria]]
  id = "c-5"
  text = "From a phone on the tailnet, https://nora.<tailnet>.ts.net/ serves the app through tailscale serve: the install prompt appears and the app launches standalone; the login rate limiter sees the phone's address, not 127.0.0.1 (trusted_proxies honours the proxy's X-Forwarded-For — asserted by test)"

[[criteria]]
  id = "c-6"
  text = "The 3 gremlins survivors routed here from phase 04 (internal/grants/reconcile.go:133 CONDITIONALS_NEGATION, :135 CONDITIONALS_BOUNDARY, :135 CONDITIONALS_NEGATION) are killed — the verify mutation run reports none of them surviving"

[[criteria]]
  id = "c-7"
  text = "Real use observed on the deployed instance: from a phone, one button tap unblocks the service on a child's real device within 5 s and the block returns at expiry without intervention — recorded with date and device in verify.toml"

[[decisions]]
  key = "tls_path"
  choice = "The binary listens plain HTTP on 127.0.0.1:8080; tailscale serve terminates HTTPS on 443 with the auto-renewed tailnet cert and proxies to it. config: base_url https://nora.<tailnet>.ts.net, trusted_proxies [127.0.0.1]. The app never sees a cert on nora"
  why = "Secure context for PWA install with zero cert rotation in-app; the tailnet already reaches nora from the phone; the app's own ServeTLS stays available for other deployments"
  locked = true

[[decisions]]
  key = "nora_target"
  choice = "nora is linux/amd64, AdGuard Home listens at http://127.0.0.1:80 from nora's point of view, and deploy goes over ssh to host alias nora with sudo"
  why = "Confirmed by the user; fixes the build target and the deploy transport so the plan does not hedge across arches"
  locked = true

[[decisions]]
  key = "secret_placement"
  choice = "config.yaml lives at /etc/adguard-reward/config.yaml (root:root 0644) and carries no secrets; the AdGuard password lives in /etc/adguard-reward/adguard_password (root:root 0600) and reaches the process via LoadCredential=adguard_password:… with password_file: /run/credentials/adguard-reward.service/adguard_password"
  why = "DynamicUser has no stable uid to chown a secret to; LoadCredential is systemd's answer and keeps rule r-03 (no secrets in config) intact"
  locked = true

[[decisions]]
  key = "real_use_evidence"
  choice = "c-5's install prompt and c-7's tap-to-revert are manual observations recorded in verify.toml (date, device, result), not tests; the testable clauses beside them are what the suite asserts"
  why = "The milestone criterion is 'the household uses it for real'; no test on this machine can observe nora or a phone, and pretending otherwise would be theatre"
  locked = true

[[deferred]]
  text = "PWA served under a subpath: base_url with a path prefix behind a proxy — manifest scope/start_url and SPA fallback honour the prefix"
  why = "tailscale serve fronts the app at root on nora; subpath deployments become real with the M4 Docker/proxy release, not yet scoped"
