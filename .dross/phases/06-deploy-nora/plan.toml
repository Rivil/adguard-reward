task_seq = 8

[phase]
  id = "06-deploy-nora"

[[task]]
  id = "t-1"
  wave = 1
  title = "Resolve data_dir from $STATE_DIRECTORY"
  files = ["internal/config/config.go", "internal/config/config_test.go", "deploy/config.example.yaml"]
  description = "Defaults().DataDir becomes \"\" and Load resolves it last, after the env pass: explicit (yaml or\nADGUARD_REWARD_DATA_DIR) wins; else the first \":\"-separated entry of lookupEnv(\"STATE_DIRECTORY\");\nelse \"./data\". Empty string from any source means \"unset\". STATE_DIRECTORY is a fallback, not a\nconfig key — it is NOT added to envTable. config.example.yaml drops the literal `data_dir: \"./data\"`\nfor a commented-out key explaining the systemd fallback (a literal ./data in the installed config\nwould beat STATE_DIRECTORY and, with cwd=/ under ProtectSystem=strict, crash-loop the unit).\n"
  covers = ["c-3"]
  test_contract = ["if the STATE_DIRECTORY fallback is dropped, TestLoad_StateDirectory fails: yaml with no data_dir + STATE_DIRECTORY=/var/lib/x -> cfg.DataDir == \"/var/lib/x\"", "if Defaults() is emptied without the resolver, TestLoad_Defaults fails: no data_dir, no STATE_DIRECTORY -> cfg.DataDir == \"./data\" after Load (unchanged assertion)", "if precedence is inverted, TestLoad_StateDirectory/explicit fails: yaml data_dir \"/var/lib/reward\" + STATE_DIRECTORY=/other -> \"/var/lib/reward\"", "if set-but-empty env is treated as a value, TestLoad_StateDirectory/env fails: ADGUARD_REWARD_DATA_DIR=\"\" + STATE_DIRECTORY=/s -> \"/s\"; ADGUARD_REWARD_DATA_DIR=\"/e\" + STATE_DIRECTORY=/s -> \"/e\"", "if the colon list is not split, TestLoad_StateDirectory/list fails: STATE_DIRECTORY=\"/a:/b\" -> \"/a\" (a DataDir containing \":\" fails); STATE_DIRECTORY=\"\" (set but empty) -> \"./data\"", "if a literal data_dir creeps back into deploy/config.example.yaml, TestExampleConfigLoads fails: with no STATE_DIRECTORY cfg.DataDir == \"./data\", with STATE_DIRECTORY=/s it equals \"/s\"", "if STATE_DIRECTORY is added to envTable, TestEnvTable fails: the table must not list it"]
  status = "done"

[[task]]
  id = "t-2"
  wave = 1
  title = "Kill reconcile Run log-line mutants"
  files = ["internal/grants/reconcile.go", "internal/grants/reconcile_test.go"]
  description = "Add TestReconcile_RunLogs driving Engine.Run at a 20 ms interval against e.logs (newEnv already\nwires a TextHandler over a locked buffer), one subtest per branch of the switch at\nreconcile.go:131-137. No production change: the survivors only select which log line Run emits.\nPhase-04 verify.toml lists five survivor entries at :133/:135 (both operands of each condition);\nthe subtests pin every operand so all of them die, not only the three the spec names. Run gremlins\non internal/grants by hand before committing and record the observed result in the commit body.\n"
  covers = ["c-6"]
  test_contract = ["if the :133 CONDITIONALS_NEGATION on `err == nil` survives, subtest \"failed\" fails: fake SetStatus(\"/control/clients\", 500), one tick -> buffer contains msg=\"reconcile failed\" within 300 ms (the mutant makes a failing pass silent, and logs spuriously in \"quiet\")", "if the :133 CONDITIONALS_NEGATION on `ctx.Err() == nil` survives, subtest \"cancelled\" fails: fake Hang(\"/control/clients\", 200 ms), cancel ctx at 50 ms, wait for Run to return -> buffer does NOT contain \"reconcile failed\"", "if a :135 CONDITIONALS_BOUNDARY `>= 0` mutant on either operand survives, subtest \"quiet\" fails: consistent state, three ticks -> neither \"reconcile failed\" nor a msg=\"reconcile\" line (exact msg match so \"startup reconcile\" cannot mask it)", "if the :135 CONDITIONALS_NEGATION `<= 0` mutant on Reverted survives, subtest \"reverted\" fails: seedOverdue grant with withNoTimers, one tick -> exactly one msg=\"reconcile\" line with reverted=1 repaired=0", "if the mutants on the second operand of the || survive, subtest \"repaired\" fails: parent re-blocks a granted service via MutateClient, one tick -> msg=\"reconcile\" with repaired=1 reverted=0", "if any of them survives, the phase-06 verify mutation run (gremlins over internal/grants) reports a reconcile.go:133/135 CONDITIONALS_* survivor and c-6 fails"]
  status = "done"

[[task]]
  id = "t-3"
  wave = 1
  title = "Systemd unit, nora config template, parse tests"
  files = ["deploy/adguard-reward.service", "deploy/config.nora.yaml", "cmd/adguard-reward/deploy_test.go"]
  description = "Unit: [Unit] After=network-online.target AdGuardHome.service, Wants=network-online.target;\n[Service] Type=simple, DynamicUser=yes, StateDirectory=adguard-reward,\nLoadCredential=<id>:<file> with id adguard_password and file /etc/adguard-reward/adguard_password,\nExecStart=/usr/local/bin/adguard-reward --config /etc/adguard-reward/config.yaml,\nNoNewPrivileges=yes, ProtectSystem=strict, ProtectHome=yes, PrivateTmp=yes, Restart=on-failure,\nRestartSec=5s; [Install] WantedBy=multi-user.target. Template (no secrets, no data_dir key):\nlisten \"127.0.0.1:8080\", base_url \"https://nora.TAILNET.ts.net\", trusted_proxies [\"127.0.0.1\"],\nadguard.url http://127.0.0.1:80, adguard.username \"CHANGE-ME\",\nadguard.password_file /run/credentials/adguard-reward.service/adguard_password.\ndeploy_test.go (new, beside main_test.go's TestDockerfileCMD) carries a ~30-line INI reader\n(sections, repeated keys) reused by t-6.\n"
  covers = ["c-1", "c-5"]
  test_contract = ["if any hardening key is removed or misspelled, TestServiceUnit fails: DynamicUser=yes, StateDirectory=adguard-reward, NoNewPrivileges=yes, ProtectSystem=strict, PrivateTmp=yes, Restart=on-failure each asserted by exact section+key+value and named on failure", "if ExecStart loses its absolute path or the --config flag, or LoadCredential changes source, TestServiceUnit fails: ExecStart starts with an absolute binary path and contains `--config /etc/adguard-reward/config.yaml`; LoadCredential equals exactly <id>:<file> with id adguard_password and file /etc/adguard-reward/adguard_password", "if a `User=` or `WorkingDirectory=` key appears in the unit, TestServiceUnit fails (either defeats DynamicUser / reintroduces a cwd-relative data dir)", "if the credential id is renamed in one file only, TestUnitConfigAgree fails: expected password_file is built as \"/run/credentials/\" + <unit filename> + \"/\" + <LoadCredential id> and the raw template's adguard.password_file must equal it", "if the template drifts from the locked tls_path/nora_target decisions, TestNoraConfigLoads fails: config.Load over deploy/config.nora.yaml (env-overriding only username and password_file to a temp file) asserts Listen == \"127.0.0.1:8080\", TrustedProxyNets() == [127.0.0.1/32], BaseURL has prefix \"https://\", AdGuard.URL == \"http://127.0.0.1:80\", and the raw yaml has no `data_dir` key", "if trusted_proxies stops honouring the proxy, TestNoraConfigClientIP fails: api.ClientIP(cfg.TrustedProxyNets()) with RemoteAddr 127.0.0.1:x + X-Forwarded-For 100.64.0.7 -> 100.64.0.7; RemoteAddr 100.64.0.9:x + same header -> 100.64.0.9 (untrusted peer keeps the peer)", "if a secret lands in the template (rule r-03), TestNoraConfigNoSecrets fails: no non-empty `password:` and no non-empty `api_key:` value in deploy/config.nora.yaml"]
  status = "done"

[[task]]
  id = "t-4"
  wave = 1
  title = "make build-linux with static ELF test"
  files = ["Makefile", "cmd/adguard-reward/build_test.go"]
  description = "Makefile: `LINUX_BIN ?= bin/$(BIN)-linux-amd64`; `build-linux-bin` runs `CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build $(GOFLAGS) -ldflags '$(LDFLAGS)' -o $(LINUX_BIN) ./cmd/$(BIN)` with NO web prerequisite; `build-linux: build-web build-linux-bin` is the shipped chain; .PHONY/help entries; VERSION pinned once per make invocation; `test-go` exports ADGUARD_REWARD_BUILD_TEST=1. build_test.go runs the real `make build-linux-bin VERSION=test-0.0.0-gdeadbee LINUX_BIN=<tmp>` (never build-linux: its build-web prereq empties web/dist while other packages may be compiling their embed under go test ./...) and inspects the artefact with debug/elf, debug/buildinfo and a byte scan, never executing it. Fact (verified by the panel judge with `go version -m`): under GOFLAGS=-trimpath the -ldflags setting is NOT recorded in buildinfo, so the stamp is proven by recipe text, the byte scan, TestRun_Healthz (already pins version -> /healthz) and t-6's deploy gate."
  covers = ["c-2"]
  test_contract = ["if the recipe loses a cross-build flag, TestMakeBuildLinuxRecipe (always on) fails: `make -n build-linux` output contains `CGO_ENABLED=0`, `GOOS=linux`, `GOARCH=amd64` and `-X main.version=` on the go build line, and a pnpm build line precedes it (the build-web prerequisite is intact)", "if VERSION is hard-coded, TestMakefileVersion fails: the Makefile's VERSION default line contains \"git describe --tags\"", "if the build targets the wrong platform, TestBuildLinux (skips unless ADGUARD_REWARD_BUILD_TEST=1 and make is on PATH; drives `make build-linux-bin`, which must not touch web/dist) fails: elf.Open reports Class ELFCLASS64 and Machine EM_X86_64", "if the binary is dynamically linked, TestBuildLinux fails: no PT_INTERP program header and DynString(DT_NEEDED) is empty", "if CGO or the target leaks into buildinfo wrong, TestBuildLinux fails: buildinfo.ReadFile settings contain CGO_ENABLED=0, GOOS=linux, GOARCH=amd64 — and the test must NOT assert an -ldflags setting (absent under -trimpath)", "if -X main.version stops reaching the linked binary, TestBuildLinux fails: the built file's bytes contain the sentinel \"test-0.0.0-gdeadbee\" (survives -s -w)", "if the env gate is lost, `make test` no longer runs TestBuildLinux: test-go must export ADGUARD_REWARD_BUILD_TEST=1; plain `go test ./...` skips it with a visible SKIP line so a skip is never mistaken for a pass", "if build-linux-bin regains a web prerequisite, TestMakeBuildLinuxRecipe fails: `make -n build-linux-bin` output contains no pnpm line"]
  status = "done"

[[task]]
  id = "t-5"
  wave = 2
  title = "Nora config end-to-end through run()"
  files = ["cmd/adguard-reward/main_test.go"]
  description = "TestRun_NoraConfig starts run() with `--config ../../deploy/config.nora.yaml` and env\n{STATE_DIRECTORY: tmp, ADGUARD_REWARD_LISTEN: 127.0.0.1:0, ADGUARD_REWARD_ADGUARD_URL: fake,\nADGUARD_REWARD_ADGUARD_USERNAME, ADGUARD_REWARD_ADGUARD_PASSWORD_FILE: tmp file} — the real\nshipped template, the real ClientIP wiring, the real limiter — simulating tailscale serve by sending\nfrom 127.0.0.1 with X-Forwarded-For set to a CGNAT tailnet address.\n"
  covers = ["c-3", "c-5"]
  depends_on = ["t-1", "t-3"]
  test_contract = ["if data_dir resolution regresses or a data_dir key creeps back into the template, TestRun_NoraConfig fails: after onListen, <STATE_DIRECTORY>/<store.FileName> exists (no chdir, no assertion about ./data — it pre-exists on dev machines and the package's tests run in parallel)", "if trusted_proxies is dropped from the template or ClientIP ignores a bare-IP entry, TestRun_NoraConfig fails: 5 bad logins with X-Forwarded-For: 100.64.0.5 from peer 127.0.0.1 -> the 6th is 429 and stderr has `ip=100.64.0.5`, not `ip=127.0.0.1` (a limiter keyed on the peer yields 401)", "if the limiter is keyed on the proxy instead of the phone, TestRun_NoraConfig fails: immediately after, 1 bad login with X-Forwarded-For: 100.64.0.6 -> 401 not 429", "if IPv6 forwarding is mishandled, TestRun_NoraConfig fails: X-Forwarded-For: fd7a:115c:a1e0::1 is logged as that address, not 127.0.0.1", "if the template's base_url loses https://, TestRun_NoraConfig fails: the Set-Cookie on a successful login carries Secure and the listening line reports secure_cookie=true"]
  status = "done"

[[task]]
  id = "t-6"
  wave = 2
  title = "install-nora.sh with health gate and stub tests"
  files = ["deploy/install-nora.sh", "cmd/adguard-reward/deploy_test.go"]
  description = "deploy/install-nora.sh, run on nora as root via `sudo -n env VERSION=... bash -s` (the Makefile side is t-8). set -euo pipefail; honours DESTDIR, HEALTH_TIMEOUT, HEALTH_INTERVAL; finds systemctl/curl/tailscale/journalctl on PATH so tests can stub them. Steps: install -m 0755 /tmp/adguard-reward.new -> /usr/local/bin/adguard-reward (unlink-then-create); install unit 0644 -> /etc/systemd/system; if /etc/adguard-reward/config.yaml is absent, install the template 0644 with TAILNET replaced by the MagicDNS suffix from `tailscale status --json`; if the credential file is absent, create it 0600 containing CHANGE-ME; if config still holds CHANGE-ME or TAILNET, or the credential is CHANGE-ME -> print exactly what to edit and exit 3 before touching the service; daemon-reload; enable --now / restart; `tailscale serve --bg --https=443 http://127.0.0.1:8080` (literal 127.0.0.1); poll curl http://127.0.0.1:8080/healthz until 200 or HEALTH_TIMEOUT (default 45 s), then grep -F the version once — mismatch exits 4 naming both versions; any health failure prints `journalctl -u adguard-reward -n 20` before exiting. The script never reads or prints the credential file's contents."
  covers = ["c-4", "c-5"]
  depends_on = ["t-3"]
  test_contract = ["if the first-run guard breaks, TestInstallNora_FirstRun (DESTDIR=tmp, stub systemctl/curl/tailscale/journalctl on PATH) fails: config.yaml 0644 with TAILNET replaced by the stub's suffix, adguard_password 0600 containing CHANGE-ME, binary 0755 at usr/local/bin, unit under etc/systemd/system, exit code 3, and the systemctl stub log is empty (no restart with a placeholder credential)", "if either file is installed unconditionally, TestInstallNora_SecondRunPreservesEdits fails: pre-seed config.yaml with a marker line and a real-looking credential, run the script -> both files byte-identical to the seed (sha256), binary and unit replaced", "if the version compare is skipped, downgraded to HTTP 200, or done before restart, TestInstallNora_HealthGate fails: with a valid config the curl stub returning {\"status\":\"ok\",\"version\":\"other\"} -> exit 4, stderr names both versions, systemctl log shows daemon-reload then restart (in that order) before the curl; returning {\"version\":\"<VERSION>\"} -> exit 0", "if the health check is one-shot, TestInstallNora_PollsUntilUp fails: with HEALTH_TIMEOUT=2 HEALTH_INTERVAL=0.2 the curl stub fails its first 2 invocations (counter file) then answers 200 with the right version -> exit 0", "if a failed gate is silent, TestInstallNora_Unhealthy fails: curl stub exits 22 for every attempt under HEALTH_TIMEOUT=1 -> non-zero exit and the journalctl stub log shows `-u adguard-reward` was requested", "if the script ever echoes the credential, TestInstallNora_NoSecretOutput fails: the seeded credential file contains a sentinel that appears in no stub log and in neither captured stdout nor stderr (boolean contains check, never printed)", "if tailscale serve targets anything but the loopback address the template trusts, TestInstallNora_TailscaleServe fails: the tailscale stub's recorded argv contains `serve`, `--bg` and the literal `http://127.0.0.1:8080` (`localhost` fails)"]
  status = "done"

[[task]]
  id = "t-7"
  wave = 4
  title = "Deploy to nora, record real-use observations"
  files = ["Makefile"]
  description = "Run `make deploy-nora` for real. First run exits 3; the USER then writes the AdGuard password into the 0600 credential file on nora's own terminal (`umask 077; cat > /etc/adguard-reward/adguard_password`) and sets adguard.username — the agent never handles the value (no secret in argv, in ssh, or in the conversation) and only re-runs `make deploy-nora` afterwards, confirming exit 0 and that nora's tailscale accepted `serve --bg --https=443`. Then the phone observations. Observations (date, phone model/OS, child's device name, service, grant length, tap-to-resolve seconds, expiry time, deployed version) are captured in the task's commit body and carried into [[criterion]].notes for c-4/c-5/c-7 by `dross verify` — verify.toml is generated, never hand-written (locked real_use_evidence: manual records, not tests). Makefile is listed only so the task has a commit anchor if the chain needs a fix during the live run; otherwise no code changes."
  covers = ["c-4", "c-5", "c-7"]
  depends_on = ["t-5", "t-8"]
  test_contract = ["if the deploy was not observed green in-session, c-4 fails: verify notes record the observed `make deploy-nora` exit 0 and the /healthz version string equal to `git describe --tags --always --dirty` of the deployed commit, with date — never recorded from memory (global rule 1)", "if the install prompt record is missing, c-5 fails: verify notes record date, phone model/OS, \"https://nora.<tailnet>.ts.net/ showed the install prompt\" and \"launched standalone (no browser chrome)\"", "if the real-use record is missing or latency exceeds 5 s, c-7 fails: verify notes record date, child's device name as known to AdGuard, service tapped, grant length, seconds from tap to the service resolving on the device (<= 5), and \"block returned at expiry without intervention\" with the expiry time", "if a secret value lands in verify.toml, the commit body or the conversation, r-03 and the global secret rules fail: the credential is written by the user on nora, never by the agent; proven by a `grep -q` boolean against a sentinel, never by printing"]
  status = "done"

[[task]]
  id = "t-8"
  wave = 3
  title = "make deploy-nora chain and path agreement tests"
  files = ["Makefile", "cmd/adguard-reward/deploy_test.go"]
  description = "`deploy-nora: build-linux` (Makefile, NORA_HOST ?= nora): `ssh $(NORA_HOST) uname -m` must print x86_64 (wrong-host guard); scp $(LINUX_BIN) to nora:/tmp/adguard-reward.new; scp unit + template to /tmp; then `ssh $(NORA_HOST) sudo -n env VERSION=$(VERSION) bash -s < deploy/install-nora.sh`. .PHONY/help entries. deploy_test.go gains the two chain/agreement tests below, reusing t-3's INI reader."
  covers = ["c-4"]
  depends_on = ["t-4", "t-6"]
  test_contract = ["if the deploy chain loses its build prerequisite or renames the build output in one place, TestMakeDeployNoraChain fails: `make -n deploy-nora VERSION=v` output contains `GOOS=linux GOARCH=amd64` before `install-nora.sh`, contains `uname -m`, `sudo -n`, `bash -s` and `VERSION=`, and the scp'd binary path equals $(LINUX_BIN) from the same -n output", "if the install path and the unit disagree, TestInstallPathMatchesUnit fails: the script's `install` target path equals the unit's ExecStart binary path parsed by t-3's INI reader"]
  status = "done"
