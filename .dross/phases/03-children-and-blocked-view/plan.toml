[[task]]
  id = "t-1"
  wave = 1
  title = "Children schema, store queries, c-8 Delete error test"
  files = ["internal/store/migrations/0002_children.sql", "internal/store/children.go", "internal/store/children_test.go", "internal/store/sessions_test.go"]
  description = "0002_children.sql: children(id INTEGER PRIMARY KEY, name TEXT NOT NULL UNIQUE COLLATE NOCASE,\ncreated_at INTEGER NOT NULL); child_clients(client_name TEXT PRIMARY KEY, child_id INTEGER NOT\nNULL REFERENCES children(id) ON DELETE CASCADE) + index on child_id. Only persistent-client\nnames are stored (locked: client_identity). children.go: Child{ID int64, Name string, Clients\n[]string}; sentinels ErrChildNotFound, ErrNameTaken, and typed *ErrClientTaken{Client, ChildID,\nChildName}. ListChildren(ctx) ([]Child, error) ordered id ASC as ONE query — children LEFT JOIN\nchild_clients ORDER BY children.id, client_name — so there is no consistency window between\ntwo reads and no nested query on the single connection (store.go); GetChild(ctx, id);\nCreateChild(ctx, name, clients) (Child, error); UpdateChild(ctx, id, name, clients) (Child,\nerror) — full replace of name and client set (DELETE child_clients WHERE child_id, re-INSERT);\nDeleteChild(ctx, id) (bool, error) like DeleteByUser. Create/Update run in one BeginTx: SELECT\nthe name conflict (excluding own id) → ErrNameTaken, SELECT each client's owner (excluding own\nid) → *ErrClientTaken naming the owner, then write; the UNIQUE/PK constraints stay as the safety\nnet and any constraint error still rolls the tx back. Clients are trimmed, empties dropped,\nsorted, deduped before the write; returned sorted and never nil. Nothing is ever auto-pruned\n(locked: dangling_client). sessions_test.go gains TestSessions_DeleteExecError for c-8.\n"
  covers = ["c-1", "c-8"]
  test_contract = ["if the UNIQUE on children.name or its NOCASE collation is dropped, TestChildren_NameUnique fails: CreateChild(\"Ada\") then CreateChild(\"ada\") returns errors.Is(err, ErrNameTaken) and ListChildren has one row; UpdateChild(ben.ID, \"Ada\", nil) also returns ErrNameTaken and GetChild(ben.ID) still says \"Ben\"", "if a client can be mapped to two children, TestChildren_ClientOneOwner fails: Ada has [\"Kid phone\"]; CreateChild(\"Ben\", [\"Kid phone\",\"Old laptop\"]) returns *ErrClientTaken with ChildName \"Ada\" and Client \"Kid phone\", and no \"Ben\" row exists (the tx rolled back, not just the second insert); PRAGMA index_list shows child_clients.client_name unique", "if UpdateChild is not atomic, TestChildren_UpdateRollsBack fails: UpdateChild(ada.ID, \"Renamed\", [<client owned by Ben>]) returns *ErrClientTaken and GetChild(ada.ID) still has name \"Ada\" and her previous clients", "if the self-exclusion is missing, TestChildren_UpdateSameName fails: UpdateChild(ada.ID, \"Ada\", ada.Clients) succeeds; UpdateChild(ada.ID, \"Ada\", [\"Kid phone\",\"Kid phone\"]) where Ada already owns \"Kid phone\" succeeds with Clients == [\"Kid phone\"]", "if update is not a full replace, TestChildren_UpdateReplaces fails: Ada [\"Kid phone\",\"Kid tablet\"] → UpdateChild(ada.ID, \"Ada M\", [\"Old laptop\"]) → GetChild returns Name \"Ada M\", Clients exactly [\"Old laptop\"]; SELECT count(*) FROM child_clients WHERE child_id=ada.ID is 1", "if ON DELETE CASCADE or foreign_keys is lost, TestChildren_DeleteFrees fails: DeleteChild(ada.ID) returns (true, nil), SELECT count(*) FROM child_clients WHERE child_id=ada.ID is 0, GetChild(ada.ID) → ErrChildNotFound, and CreateChild(\"Cy\", [\"Kid phone\"]) then succeeds; DeleteChild(999) returns (false, nil)", "if the payload is not normalised, TestChildren_ClientsNormalised fails: CreateChild(\"A\", [\" Kid phone\", \"Kid phone\", \"\", \"Kid tablet\"]) stores exactly [\"Kid phone\", \"Kid tablet\"] in that order", "if ListChildren nulls or misorders, TestChildren_ListShape fails: an empty store returns a non-nil empty slice; children created in order \"ben\",\"Ada\",\"Cy\" come back in that order; a child with no clients has Clients == []string{} not nil", "if ListChildren is split into two reads or nests a query, TestChildren_ListRace fails under go test -race: 10 goroutines calling ListChildren while another does 20 CreateChild/DeleteChild cycles complete within 5s with no error (a nested query on the single connection deadlocks), and every returned child is internally consistent — no child carries a client it did not own at the moment of the read, which the reader checks by asserting each result's Clients is either the pre-cycle or post-cycle set for that id, never a mix", "if rows do not persist, TestChildren_Persist fails: CreateChild x2, Close, Open on the same dir, ListChildren returns both with identical ids, names and client lists; schema_migrations lists 0002_children.sql exactly once", "if an unknown id is not signalled, TestChildren_NotFound fails: GetChild(999) and UpdateChild(999, ...) return ErrChildNotFound", "if the wrap at sessions.go:79 is removed (survivor 7682485717754728), TestSessions_DeleteExecError fails: Insert two sessions, Delete(id1) → nil and ListByUser lists only id2; then s.DB().Exec(\"DROP TABLE sessions\") and Delete(id2) → err != nil with strings.HasPrefix(err.Error(), \"delete session: \"), errors.Unwrap(err) != nil and the text containing \"no such table\""]
  status = "done"

[[task]]
  id = "t-2"
  wave = 1
  title = "adguard.MigrateFromGlobal + fake per-client update fault"
  files = ["internal/adguard/clients.go", "internal/adguard/clients_test.go", "internal/adguard/adguardtest/server.go", "internal/adguard/adguardtest/server_test.go"]
  description = "Factor SetBlockedServices' locked read-modify-write into updateClient(ctx, name, mutate\nfunc(data map[string]json.RawMessage) error) (same c.rmw mutex, same ErrClientNotFound, same\nverbatim copy of every other field). SetBlockedServices keeps its signature and behaviour on\ntop of it; its existing tests pass unchanged. New MigrateFromGlobal(ctx, clientName string,\nids []string) error: one RMW that sets data[\"blocked_services\"] = sorted, deduplicated,\nnever-null ids AND data[\"use_global_blocked_services\"] = false, touching nothing else. It\nnever calls /control/blocked_services/set. adguardtest gains SetUpdateStatus(name string,\ncode int): handleUpdate answers code for that client name only (0 clears), so a multi-client\nwrite can fail on the second client.\n"
  covers = ["c-7"]
  test_contract = ["if the flag flip or the list write is lost, TestMigrateFromGlobal_Body fails: MigrateFromGlobal(\"Kid tablet\", [\"tiktok\",\"roblox\",\"tiktok\"]) makes the fake's LastUpdate() decode to name \"Kid tablet\" with data.blocked_services == [\"roblox\",\"tiktok\"], data.use_global_blocked_services == false, and every other key (safe_search, tags, blocked_services_schedule, upstreams_cache_size 0, ids, ...) byte-for-byte equal to the fixture object", "if the shared helper drops fields, the existing TestSetBlockedServices_Preserves still fails: the update body for \"Kid phone\" carries future_field 42 and the unchanged use_global_blocked_services false", "if the global list is touched, TestMigrateFromGlobal_GlobalUntouched fails: the fake's Requests() after the call contain exactly one GET /control/clients and one POST /control/clients/update and nothing under /control/blocked_services/; GET /control/blocked_services/get still returns [\"tiktok\",\"roblox\"]", "if a missing client is written anyway, TestMigrateFromGlobal_NotFound fails: MigrateFromGlobal(\"Nobody\", [\"tiktok\"]) returns errors.Is(err, ErrClientNotFound) and LastUpdate() is nil; SetResponse(\"/control/clients\", 200, {\"clients\":[]}) then migrating \"Kid tablet\" likewise", "if the refactor breaks serialisation, TestSetBlockedServices_Serialised (extended to mix both writers) fails: Hang(\"/control/clients/update\", 30ms) with 10 goroutines mixing SetBlockedServices and MigrateFromGlobal leaves MaxInFlightUpdates() == 1", "if the fake's per-name fault is wired wrong, TestFake_SetUpdateStatus fails: SetUpdateStatus(\"Kid tablet\", 500) makes an update to \"Kid tablet\" 500 and to \"Kid phone\" 200; SetUpdateStatus(\"Kid tablet\", 0) clears it"]
  status = "done"

[[task]]
  id = "t-3"
  wave = 1
  title = "Pure blocked-state fold and migration offer"
  files = ["internal/blocked/blocked.go", "internal/blocked/blocked_test.go"]
  description = "Package blocked, no I/O and no store import (so it compiles in wave 1). Constants\nStateBlocked/StatePartial/StateUnblocked. Input{Clients []adguard.PersistentClient, Global\n[]string, Services []adguard.Service, Mapped []string}. Compute(Input) View{Clients\n[]ClientState{Name, Missing, UsesGlobal}, Services []ServiceState{ID, Name, Icon, State,\nDiffers}}. For each Mapped name in order: present iff a persistent client of that name\nexists; Missing otherwise and excluded from the fold; a UsesGlobal client's effective set is\nGlobal, else its own BlockedServices (nil-safe). For each catalogue service in catalogue\norder: blocked when every present client's set contains it, unblocked when none does (and\nwhen there are no present clients — no vacuous truth), partial otherwise with Differs = names\nof present clients whose set lacks it, sorted by name; Differs is []string{} otherwise. Ids\nblocked on a client but absent from the catalogue are ignored (the catalogue is the view).\nOffer(clients, global, mapped) []Step{Client, Gains, Target}: empty when global is empty; one\nstep per mapped, present client with UseGlobalBlockedServices true, in mapped order; Gains =\nsorted global ids not in the client's own list, Target = sorted union(own, global); a client\nwith Gains empty is still a step (its flag must flip). Slices never nil.\n"
  covers = ["c-4", "c-7"]
  test_contract = ["if the three-way rule drifts, TestCompute_Fixture fails: Mapped [\"Kid phone\",\"Kid tablet\"] over the embedded fixtures (Kid phone own [youtube,tiktok]; Kid tablet global [tiktok,roblox]; catalogue youtube,tiktok,roblox): youtube partial Differs [\"Kid tablet\"]; tiktok blocked Differs []; roblox partial Differs [\"Kid phone\"]; services in catalogue order; Clients [{Kid phone,false,false},{Kid tablet,false,true}]", "if global-list clients are read from their own (ignored) list, TestCompute_UsesGlobal fails: Kid tablet alone with Global [tiktok,roblox] → tiktok and roblox blocked, youtube unblocked; the same client with Global [] → all three unblocked", "if missing clients are folded, TestCompute_MissingExcluded fails: Mapped [\"Kid phone\",\"Ghost\"] gives youtube and tiktok blocked (not partial), roblox unblocked, Ghost only in Clients with Missing true, and no Differs ever names Ghost", "if the fold is vacuous, TestCompute_NoPresentClients fails: Mapped [] and Mapped [\"Ghost\"] both yield every service unblocked with Differs == []string{} (not nil)", "if a null AdGuard list leaks, TestCompute_NullList fails: Mapped [\"Old laptop\"] (fixture blocked_services null) gives every service unblocked and no panic", "if ordering is nondeterministic, TestCompute_Order fails: services come back in catalogue order regardless of client list order, Differs sorted by name regardless of Mapped order", "if unknown ids leak into the view, TestCompute_UnknownID fails: a client blocking \"zzz-new\" yields exactly the three catalogue services and nothing else", "if the offer targets the wrong clients, TestOffer_Scope fails: Mapped [\"Kid tablet\",\"Kid phone\",\"Ghost\"] with Global [tiktok,roblox] gives exactly one step (Kid tablet: Gains [\"roblox\",\"tiktok\"], Target [\"roblox\",\"tiktok\"]); Global [] gives no steps; an unmapped global client gives no steps", "if the target drops the client's own list, TestOffer_Union fails: a global client whose own list is [\"youtube\"] with Global [\"tiktok\"] yields Gains [\"tiktok\"], Target [\"tiktok\",\"youtube\"]; one whose list already holds every global id yields a step with Gains [] and Target equal to its list"]
  status = "done"

[[task]]
  id = "t-4"
  wave = 1
  title = "Web API client: endpoints, types, children route, dismissal store"
  files = ["web/src/lib/api.ts", "web/src/lib/api.test.ts"]
  description = "Method gains 'PUT'. Route gains 'children' (pathname '/children'); routeFor/navigate map it\nboth ways. Types Child, ClientView, Service, ServiceState, BlockedView, MigrationOffer exactly\nas in the wire contract. Functions: listChildren(), createChild(name, clients), updateChild(id,\nname, clients), deleteChild(id), listClients(), listServices(), childBlocked(id),\nmigrationOffer(), applyMigration(); iconUrl(icon) returns 'data:image/svg+xml;base64,' + icon.\nmessageFor keeps its cases; a 409 conflict reaches the default branch, which already echoes the\nserver's message verbatim (it names the child/client) — no new case, but the behaviour is now\npinned by a test. Exported writable store migrationDismissed (false), reset to false inside\nlogin() on success and inside logout() — the \"not now\" is per login, nothing persisted\n(locked: migration_offer_ux).\n"
  covers = ["c-5", "c-6", "c-7"]
  test_contract = ["if a route or method is wrong, api.test.ts 'children endpoints' fails: each function's recorded fetch has the exact URL and method — createChild → POST /api/v1/children with body {\"name\":\"Ada\",\"clients\":[\"Kid phone\"]}; updateChild(3, \"A\", [\"x\"]) → PUT /api/v1/children/3 with body {\"name\":\"A\",\"clients\":[\"x\"]}; deleteChild(3) → DELETE /api/v1/children/3 resolving undefined on 204; listClients → GET /api/v1/clients; listServices → GET /api/v1/services; childBlocked(3) → GET /api/v1/children/3/blocked; migrationOffer → GET /api/v1/migration; applyMigration → POST /api/v1/migration with no body; every call carries X-Requested-With: adguard-reward", "if the children route is unmapped, 'routing' fails: navigate('children') pushes '/children' and the route store reads 'children'; a popstate at '/children' sets the store to 'children', at '/x' to 'home'", "if the icon prefix drifts, 'iconUrl' fails: iconUrl('PHN2Zy8+') === 'data:image/svg+xml;base64,PHN2Zy8+'", "if the default branch of messageFor stops echoing the server message (e.g. someone adds a generic 'conflict' case), 'messageFor conflict' fails: ApiError(409, 'conflict', 'a child named Ada already exists') → that exact string, and ApiError(409, 'conflict', 'client Kid phone is already assigned to Ben') → that exact string", "if the dismissal is not reset on login, 'login resets migrationDismissed' fails: migrationDismissed.set(true), login() with a 204 leaves get(migrationDismissed) false; logout() likewise", "if the 401 hook regresses, the existing '401 calls onUnauthorized' test still fails for childBlocked(1) against a 401"]
  status = "done"

[[task]]
  id = "t-5"
  wave = 2
  title = "Children CRUD endpoints, Deps widening, main wiring, restart proof"
  files = ["internal/api/children.go", "internal/api/children_test.go", "internal/api/api.go", "internal/api/errors.go", "internal/api/login_test.go", "cmd/adguard-reward/main.go", "cmd/adguard-reward/main_test.go"]
  description = "errors.go: CodeConflict = \"conflict\". api.go: ChildStore interface (ListChildren, GetChild,\nCreateChild, UpdateChild, DeleteChild over store.Child / store sentinels), Deps.Children\nChildStore, and the AdGuard interface widened once here to Clients(ctx)\n(adguard.ClientsResult, error), Services(ctx) ([]adguard.Service, error) and\nMigrateFromGlobal(ctx, name, ids) error (all on *adguard.Client after t-2), so t-7 and t-10\nonly append route lines. Routes GET/POST /api/v1/children, GET/PUT/DELETE\n/api/v1/children/{id}, all behind requireSession. children.go: childView {id,name,clients};\nbody decoded as handleLogin does (16 KiB MaxBytesReader, DisallowUnknownFields, single\nobject); name TrimSpace'd, empty or > 64 runes → 400 bad_request; clients an array of strings,\ntrimmed, empties dropped, deduplicated, each ≤ 256 chars, may be empty. ErrNameTaken /\n*ErrClientTaken → 409 conflict with a message naming the child (and client); ErrChildNotFound\nand a non-numeric id → 404 not_found; other store errors → 500. CRUD never calls AdGuard.\nlogin_test.go's newHarness passes Children: st. main.go passes Children: st. main_test.go\ngains TestRun_ChildrenSurviveRestart modelled on TestRun_SessionSurvivesRestart.\n"
  covers = ["c-1"]
  depends_on = ["t-1", "t-2"]
  test_contract = ["if auth or CSRF gating is missing, TestChildren_Gated fails: all five routes without a cookie → 401; POST, PUT and DELETE with a cookie but no X-Requested-With → 403 and the store stays unchanged", "if the CRUD round-trip drifts, TestChildren_CRUD fails: POST {name:\"Ada\", clients:[\"Kid phone\"]} → 201 with id>0 and the same name/clients; POST {name:\"Ben\"} (clients omitted) → 201 with clients [] not null; GET lists both oldest first ({\"children\":[...]}; raw body on a fresh store is {\"children\":[]}); PUT /children/{ada} {name:\"Ada M\",clients:[]} → 200 with clients [] and GET /children/{ada} reflects both; DELETE → 204 then GET /children/{ada} → 404 not_found and DELETE again → 404", "if conflicts are not 409, TestChildren_Conflicts fails: second POST \"Ada\" → 409 {error:\"conflict\"} whose message contains \"Ada\"; POST \"Cy\" with [\"Kid phone\"] (owned by Ada) → 409 whose message contains both \"Kid phone\" and \"Ada\"; PUT ben with name \"Ada\" → 409; the store still has exactly the pre-call rows", "if PUT half-applies, TestChildren_PutAtomic fails: PUT Ada → {name:\"Alicia\", clients:[<Ben's client>]} is 409 and GET Ada still shows \"Ada\" with her previous clients", "if validation is loose, TestChildren_Validation fails: {name:\"  \"}, a 65-rune name, {name:\"A\",extra:1} → 400, a 20 KiB body → 400, a non-object body → 400, and no row is created by any 400; {name:\"A\",clients:[\"\"]} is treated as [] (201, clients []); {name:\"Ada\",clients:[\"Kid phone\",\" Kid phone \"]} → 201 with clients [\"Kid phone\"]; GET/PUT/DELETE /children/abc and /children/999 → 404 not_found", "if CRUD starts depending on AdGuard, TestChildren_NoAdGuard fails: with fake.SetStatus(\"/control/clients\", 500) the whole CRUD sequence still succeeds and fake.Requests() holds no path other than /control/login", "if rows do not survive the process, TestRun_ChildrenSurviveRestart fails: run, login, POST a child, stop with exit 0, run again on the same data_dir and port, GET /api/v1/children with the same cookie lists the child with the same id, name and clients"]
  status = "done"

[[task]]
  id = "t-6"
  wave = 2
  title = "Home page: per-child blocked list, error state"
  files = ["web/src/lib/Home.svelte", "web/src/lib/Home.test.ts", "web/src/App.test.ts"]
  description = "Home keeps \"Signed in as\" and Log out, adds a \"Children\" button that navigate('children')\n(App.svelte's route for it lands in t-8). On mount: listChildren(), then childBlocked(id) for\nevery child (Promise.all); every mount re-fetches (no cache, no module store). Renders one\n<section data-child={id}> per child: h2 name; a client list with a \"uses global list\" badge\n(data-badge=\"global\") when uses_global and \"missing\" when missing (locked:\nglobal_list_clients); a <ul> of services whose state is blocked or partial, each with <img\nalt=\"\" src={iconUrl(icon)}> and the name, partial ones suffixed \"— unblocked on <differs\njoined>\" with data-state=\"partial\". No children → \"No children yet\". Any rejected fetch\n(ApiError or network) → <p role=\"alert\" data-error={code|'network'}> \"Can't reach AdGuard Home\n— showing nothing rather than a stale list\" and NO section renders, even if listChildren had\nsucceeded. Home.test.ts and App.test.ts switch to a URL-keyed fetch stub (path → Response\nfactory) so extra requests from later components (t-9's banner) cannot reorder a queue;\nApp.test's 'log out' asserts the calls include POST /api/v1/logout rather than equal a fixed\nlist.\n"
  covers = ["c-6"]
  depends_on = ["t-4"]
  test_contract = ["if the list is not per child or drops icons, Home.test 'lists blocked services per child' fails: two children (Ada id 1, Ben id 2) with stubbed /blocked answers render two sections; Ada's lists YouTube and TikTok (blocked) with img src 'data:image/svg+xml;base64,PHN2Zy8+' and omits Roblox (unblocked); Ben's lists nothing and says nothing is blocked", "if partial drift is hidden, 'marks partial services' fails: a partial roblox with differs [\"Kid phone\"] renders with data-state=\"partial\" and text containing \"unblocked on Kid phone\"", "if the global badge is dropped, 'shows the uses-global badge' fails: a client {name:\"Kid tablet\",uses_global:true} renders an element with data-badge=\"global\" next to \"Kid tablet\"; a missing client renders \"missing\"", "if a stale list survives an error, 'AdGuard down shows an error state' fails: render with 200s (names visible), unmount, render again with /children 200 then /children/1/blocked 502 adguard_unavailable → a role=\"alert\" with data-error=\"adguard_unavailable\", queryAllByRole('list') is empty and no service name from the first render is in the document; a fetch that throws TypeError → alert with data-error=\"network\"", "if the page caches, 'refetches on every mount' fails: render, unmount, render again → the stub counts /api/v1/children twice", "if navigation breaks, 'Children button routes' fails: clicking \"Children\" sets location.pathname to '/children' and get(route) to 'children'"]
  status = "done"

[[task]]
  id = "t-7"
  wave = 3
  title = "Clients, services and blocked-view endpoints"
  files = ["internal/api/clients.go", "internal/api/clients_test.go", "internal/api/blocked.go", "internal/api/blocked_test.go", "internal/api/api.go"]
  description = "api.go: routes GET /api/v1/clients, GET /api/v1/services, GET /api/v1/children/{id}/blocked\nbehind requireSession (interface already widened in t-5). clients.go: handleClients calls\nClients() then ListChildren() and answers the wire shape with child = the owning child or null\n(auto_clients never appear); handleServices maps Services() 1:1 with icon echoed as served.\nblocked.go: handleBlocked: GetChild (404 not_found, no AdGuard call), Clients(), Services(),\nblocked.Compute → 200 in the wire shape. Any adguard error on these three routes → 502\nadguard_unavailable with one Warn line — including ErrBadCredentials, which is the service\ncredential, not the parent's; a store error → 500. Nothing is memoised; every request goes to\nAdGuard.\n"
  covers = ["c-2", "c-3", "c-4"]
  depends_on = ["t-3", "t-5"]
  test_contract = ["if /clients stops being live or gains a cache, TestClients_LiveEveryCall fails: three GET /api/v1/clients leave exactly three GET /control/clients (and three GET /control/blocked_services/get) in fake.Requests(); after fake.MutateClient(\"Kid phone\", ids → [\"10.0.0.9\"]) the next GET shows the new id", "if the child join is wrong, TestClients_ChildAssignment fails: Ada owns [\"Kid phone\"]; the response has Kid phone.child == {id:ada, name:\"Ada\"}, Kid tablet.child == null (raw body contains \"child\":null), use_global_blocked_services true only for Kid tablet, ids matching the fixture, and the auto_client \"printer\" absent", "if /services vendors or caches, TestServices_Live fails: two GET /api/v1/services leave exactly two GET /control/blocked_services/all; the body lists youtube, tiktok, roblox in fixture order with icon \"PHN2Zy8+\"; after fake.SetResponse(\"/control/blocked_services/all\", 200, <one-entry doc>) the very next call returns one service", "if the view is wrong end-to-end, TestBlocked_View fails: Ada [Kid phone, Kid tablet, Ghost] → 200 whose services are youtube partial [\"Kid tablet\"], tiktok blocked [], roblox partial [\"Kid phone\"]; clients include {Ghost, missing:true} and Kid tablet uses_global true; the raw body has \"differs\":[] (never null); each call records one GET /control/clients, one blocked_services/get and one blocked_services/all", "if the fold is not re-run per request, TestBlocked_Live fails: GET /blocked, MutateClient adds \"roblox\" to \"Kid phone\", GET /blocked again shows roblox blocked", "if a dangling client errors or is pruned, TestBlocked_MissingIsNotAnError fails: a child with only [\"Ghost\"] → 200 with every service unblocked, and GET /children/{id} still lists Ghost afterwards", "if AdGuard failure is not 502, TestBlocked_AdGuardDown fails: with fake.SetStatus(\"/control/clients\", 500) /clients and /children/{id}/blocked answer 502 {error:\"adguard_unavailable\"}; SetStatus(\"/control/blocked_services/all\", 503) makes /services and /blocked 502; SetStatus(\"/control/blocked_services/get\", 500) makes /clients and /blocked 502 with no partial body; with the fake closed (transport error) the same; fake.SetAuth(false) → 502 as well, never 401", "if ids are not checked, TestBlocked_NotFound fails: /children/999/blocked → 404 not_found and fake.Requests() records no /control/ hit for it"]
  status = "done"

[[task]]
  id = "t-8"
  wave = 3
  title = "Children settings page + route"
  files = ["web/src/lib/Children.svelte", "web/src/lib/Children.test.ts", "web/src/App.svelte", "web/src/App.test.ts"]
  description = "App.svelte routes 'children' to <Children onBack={() => navigate('home')} /> when signed in,\nand refresh() keeps the current non-login route on success (navigate($route === 'login' ?\n'home' : $route)) so a reload on /children stays there. Children.svelte: load() =\nPromise.all(listChildren(), listClients()); one <form data-child={id}> per child with a name\n<input aria-label=\"Name\">, a checkbox per AdGuard client (label = client name, checked when in\nthe child's clients; disabled with the text \"assigned to <other child>\" when client.child is\nanother child), and for each of the child's clients absent from /clients a <s data-missing>\nentry with a \"Remove\" button that drops it from the pending list (locked: dangling_client);\n\"Save\" → updateChild(id, name, clients) then load(); \"Delete\" → deleteChild(id) then load().\nAn \"Add child\" form → createChild(name, []) then load(). Every mutation re-renders from the\nserver's answer, never from local state. ApiError → <p role=\"alert\"\ndata-error={code}>messageFor(e)</p> and the reload reverts any unsaved checkbox. \"Back\" →\nonBack().\n"
