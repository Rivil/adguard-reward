[[task]]
  id = "t-5"
  wave = 2
  depends_on = ["t-1"]
  title = "AdGuard writes: add, rename, adopt baseline"
  files = ["internal/adguard/clients_write.go", "internal/adguard/clients_write_test.go"]
  description = """
All three run under the rmw mutex with a fresh read. AddClient(NewClient{Name, IDs, Blocked *[]string}) pre-checks name
(ErrClientExists) and ids (*ErrIDTaken) before posting, and always sends use_global_settings=true plus explicit
use_global_blocked_services. RenameClient(old, new) via updateClient. AdoptBlockedServices(name, ids) writes effective
set ∪ ids with the flag false and skips the write when nothing changes. An AdGuard 400 on add surfaces as a distinct
input-rejected error carrying AdGuard's message.
"""
  covers = ["c-2", "c-6", "c-7"]
  test_contract = [
    "if the add body flags drift, TestAddClient_Body fails: Blocked=nil sends use_global_settings=true and use_global_blocked_services=true; Blocked=&[\"tiktok\"] sends use_global_settings=true, use_global_blocked_services=false, blocked_services sorted and never null",
    "if the name pre-check is skipped, TestAddClient_DuplicateName fails: duplicate name -> ErrClientExists with zero POST /control/clients/add",
    "if the id pre-check is skipped, TestAddClient_IDTaken fails: id \"192.168.1.50\" -> *ErrIDTaken{Owner:\"Kid phone\"} with zero adds",
    "if an AdGuard 400 is mapped as unavailable, TestAddClient_Rejected fails: fake 400 on add -> the input-rejected error type with AdGuard's message, not *StatusError-as-unavailable",
    "if rename loses unknown fields, TestRenameClient_PreservesRaw fails: RenameClient(\"Kid phone\",\"Ada phone\") update body has name \"Kid phone\", data.name \"Ada phone\", data.future_field == 42, every other raw field byte-identical; next Clients() lists \"Ada phone\" not \"Kid phone\"",
    "if rename skips its checks, TestRenameClient_Errors fails: rename to an existing name -> ErrClientExists with 0 updates; unknown old -> ErrClientNotFound",
    "if the inherited branch is dropped, TestAdopt_InheritsGlobal fails: Adopt on Kid tablet (use_global=true, global [tiktok, roblox]) with [\"youtube\"] must write [roblox, tiktok, youtube] with the flag false",
    "if union becomes replace or no-op writes happen, TestAdopt_Superset fails: Adopt on Kid phone with [\"tiktok\"] (already blocked, flag false) -> 0 update POSTs and youtube kept",
    "if the rmw mutex is bypassed, TestWrites_Serialised fails: concurrent AddClient + AddBlockedServices -> MaxInFlightUpdates() == 1",
  ]
  status = "pending"

