task_seq = 12

[phase]
  id = "auto-client-labelling"

# Pinned wire contract (shared by t-3, t-6, t-8, t-10, t-11, t-12 — the UI never waits on the backend):
#   GET  /api/v1/clients        -> {clients: clientView[], unlabelled: [{ip, hostname, source, suggested_ids: string[]}]}
#                                  unlabelled sorted by hostname (case-insensitive, blank last, IP tie-break);
#                                  suggested_ids = [ip] or [ip, mac] when a DHCP lease maps the ip
#   POST /api/v1/clients        {name, ids, child_id: number|null|absent} -> 201 clientView
#                                  400 empty name / empty ids / AdGuard rejected input (AdGuard's message passed through),
#                                  404 unknown child_id, 409 name or id exists in AdGuard or name owned by another
#                                  child's stale mapping, 502 AdGuard unreachable/timeout/5xx
#   POST /api/v1/clients/rename {from, to} -> 200 clientView
#                                  400 empty/oversized to, 404 unknown from, 409 to taken, 502 AdGuard down
#   PUT  /api/v1/children/{id}  unchanged shape; added clients get the child baseline
# Baseline (spec new_client_blocked_set, revised 2026-11-01) = ∪ effective blocked sets of siblings that stay with
# the child (old ∩ new on PUT), or AdGuard's global list when there are none, ∪ services under the child's active grants.
# Panel audit trail: panel/{risk,mvp,verification,synthesis}.md

[[task]]
  id = "t-1"
  wave = 1
  title = "Extend fake AdGuard: add, DHCP, rename"
  files = ["internal/adguard/adguardtest/server.go", "internal/adguard/adguardtest/server_test.go", "internal/adguard/adguardtest/testdata/clients.json", "internal/adguard/adguardtest/testdata/dhcp_status.json"]
  description = """
Serve POST /control/clients/add (400 on duplicate name or an id another client holds), GET /control/dhcp/status from a
new fixture (leases + static_leases), and a 400 when clients/update renames onto an existing name. Extend auto_clients:
192.168.1.50 (Kid phone's id), an IP leased to aa:bb:cc:dd:ee:02 (Kid tablet's MAC), a blank-hostname row, mixed-case
ARP/rDNS/DHCP/WHOIS rows. Add SetAutoClients/SetLeases knobs, an AddedClients() observer, and count
/control/clients/add in the in-flight rmw set.
"""
  covers = ["c-1", "c-2", "c-6"]
  test_contract = ["if add skips the duplicate-name check, TestFake_AddDuplicateName fails: add {name:\"Kid phone\"} must answer 400 and the next GET /control/clients lists exactly one \"Kid phone\"", "if add skips the id-ownership check, TestFake_AddDuplicateID fails: add with ids [\"192.168.1.50\"] must answer 400 and the client count is unchanged", "if clients/update allows renaming onto an existing name, TestFake_RenameCollision fails: {name:\"Kid tablet\", data:{name:\"Kid phone\"}} must answer 400 with both clients unchanged", "if add does not persist or the re-encode drops the top-level doc, TestFake_AddPersists fails: after adding \"Printer\", GET /control/clients lists it and auto_clients is still present", "if SetAutoClients(nil) serialises null, TestFake_AutoClientsEmpty fails: the response must contain \"auto_clients\": []", "if the DHCP route is wired wrong, TestFake_DHCPStatus fails: GET /control/dhcp/status returns the fixture leases; SetStatus(\"/control/dhcp/status\", 501) fails only that read while GET /control/clients still answers 200", "if /control/clients/add is not counted as an in-flight update, TestFake_AddCountsInFlight fails: two overlapping add requests must raise MaxInFlightUpdates() to 2 (keeps t-5 serialisation contract non-vacuous)", "if the fixture extension alters persistent clients, TestClients_Fixture (internal/adguard/clients_test.go) fails unchanged: still exactly 3 persistent clients, Kid phone ids [aa:bb:cc:dd:ee:01, 192.168.1.50] and blocked [youtube, tiktok], Kid tablet use_global=true, global [tiktok, roblox]; new rows go only into auto_clients and dhcp_status.json"]
  status = "pending"

[[task]]
  id = "t-2"
  wave = 1
  title = "Store: atomic client rename + targeted assign"
  files = ["internal/store/clients.go", "internal/store/clients_test.go"]
  description = "RenameClient(old, new) in one tx: renames the child_clients row and grant_clients rows of status='active' grants (deduped when that grant already holds new); *ErrClientTaken when another child holds new; when the same child already holds new (a stale self-mapping) the old row is deleted and the existing row kept; unmapped old is a no-op. AddChildClient(childID, name) is a single INSERT with the existing ownership-conflict check (never a list replace); the child already holding name is a no-op (insert-or-ignore)."
  covers = ["c-3", "c-6"]
  test_contract = ["if the child_clients UPDATE is dropped, TestRenameClient_Mapping fails: rename \"Kid phone\"->\"Ada phone\" with an active grant on it must leave ListChildren and ListActiveGrants showing \"Ada phone\" and neither showing \"Kid phone\"", "if the status='active' filter is removed, TestRenameClient_ExpiredUntouched fails: an expired grant's grant_clients must keep \"Kid phone\"", "if dedupe is missing, TestRenameClient_Dedupe fails: an active grant holding stale \"Old tab\" and \"Kid phone\" renamed Kid phone->\"Old tab\" must leave one \"Old tab\" row and raise no PK error", "if the conflict is not rolled back, TestRenameClient_Taken fails: renaming onto \"Old tab\" held by child B returns *ErrClientTaken naming B and both tables are byte-identical to before", "if an unmapped rename errors or writes, TestRenameClient_Unmapped fails: RenameClient on a name nobody owns returns nil and ListChildren is unchanged", "if AddChildClient replaces instead of inserting, TestAddChildClient_Appends fails: AddChildClient(ada, \"New tv\") while Ada holds [\"Kid phone\"] must leave [\"Kid phone\", \"New tv\"]", "if AddChildClient skips its checks, TestAddChildClient_Errors fails: a client Ben owns -> *ErrClientTaken; unknown child -> ErrChildNotFound", "if a stale self-mapping hits the child_clients PK, TestRenameClient_SelfStale fails: Ada holds [\"Kid phone\", \"TV\"] (TV unknown to AdGuard); RenameClient(\"Kid phone\",\"TV\") returns nil and Ada holds exactly [\"TV\"], with active grant_clients renamed and deduped", "if AddChildClient is not idempotent for the same child, TestAddChildClient_SelfStale fails: AddChildClient(ada, \"TV\") while Ada already holds \"TV\" returns nil and Ada still holds one \"TV\" row"]
  status = "pending"

