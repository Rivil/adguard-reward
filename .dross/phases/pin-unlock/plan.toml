  depends_on = ["t-9"]
  test_contract = ["if unlock touches AdGuard or reuses the session, TestUnlock_OK fails: correct PIN, no session cookie -> 204, a new session cookie differing from the old, GET /me 200 with the device's username, /control/login count unchanged", "if the minted session is untagged, TestUnlock_SessionTagged fails: 15m idle after unlock -> GET /me 401 pin_required", "if strikes are miscounted, TestUnlock_FiveStrikes fails: wrong PINs -> 401 bad_pin with attempts_remaining 4,3,2,1; the 5th -> 401 device_revoked, devices row gone, device cookie Max-Age<0; a 6th with the same cookie (even the right PIN) -> device_revoked", "if a correct PIN does not reset, TestUnlock_ResetOnSuccess fails: 3 wrong, 1 correct, 1 wrong -> attempts_remaining 4", "if parallel guesses exceed the cap, TestUnlock_Parallel fails: 20 parallel wrong unlocks -> exactly four bad_pin carrying {4,3,2,1} and sixteen device_revoked", "if revocation leaves the live session, TestUnlock_RevokeKillsSession fails: an unexpired session tagged to the device gets 401 on its next GET /me after the 5th strike", "if the 90-day slide is wrong, TestUnlock_DeviceLifetime fails: unlock at device age 89d23h -> 204, expires_at = now+90d, device cookie Max-Age 90d; at 90d+1s with no unlock in between -> device_revoked", "if bad bodies spend attempts or go unlogged, TestUnlock_BadBody fails: malformed JSON or >4 KiB body -> 400, failed_attempts unchanged, and exactly one unlock log line with outcome bad_request (username set when the device cookie resolves, \"\" otherwise); \"12a4\" -> bad_pin and one attempt consumed", "if logging is wrong or leaks, TestUnlock_Log fails: each outcome ok|bad_pin|device_revoked (unknown token and 5th strike)|no_device|bad_request emits exactly one info line {event:unlock, username, ip, outcome} (username \"\" for no_device, ip = trusted-proxy-resolved client IP); with time stripped, the log contains neither the PIN, the raw device token, nor the new raw session token"]
  status = "done"

