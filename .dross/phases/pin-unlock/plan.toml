[[task]]
  id = "t-4"
  wave = 1
  title = "Route 401 by code; pause idle polling"
  files = ["web/src/lib/api.ts", "web/src/lib/api.test.ts", "web/src/lib/activeGrants.ts", "web/src/lib/activeGrants.test.ts"]
  description = "request(): 401 pin_required -> onPinRequired (sets a `locked` store); other 401 -> onUnauthorized; neither for /api/v1/unlock or /api/v1/login. ApiError.attemptsRemaining. Client calls unlock, pinStatus, setPin, changePin, removePin; Route 'settings' <-> /settings; messageFor bad_pin, device_revoked, reauth_required, bad_credentials. activeGrants.start() skips interval refreshes once 1 minute has passed without pointerdown/keydown, and refreshes immediately on the next input or visibilitychange-to-visible, so an untouched open screen stops sliding the 15-minute window (review FLAG 1)."
  covers = ["c-3", "c-4", "c-5", "c-6"]
  test_contract = ["if pin_required is treated as signed-out, the pin_required routing test fails: 401 {error:\"pin_required\"} from GET /api/v1/children calls the pin spy and NOT the login spy", "if unlock errors trigger global handlers, the unlock error test fails: 401 bad_pin {attempts_remaining:3} from POST /api/v1/unlock calls neither spy and the ApiError has attemptsRemaining 3 (non-integer or missing -> undefined); 401 device_revoked and 401 unauthorized from /api/v1/unlock also call neither spy", "if a re-auth failure logs the parent out, the 403 test fails: 403 bad_credentials and 403 reauth_required from changePin or removePin call neither spy", "if request bodies drift from the wire shape, the PIN client test fails: setPin(\"0123\") sends exactly {\"pin\":\"0123\"} with no password key; changePin sends {pin,password}; removePin sends DELETE /api/v1/pin with {password}; all carry the CSRF header", "if the settings route is missing, the navigate test fails: navigate(\"settings\") pushes /settings and routeFor(\"/settings\") is \"settings\"", "if background polling keeps sliding the idle window, the activeGrants idle test fails: fake timers, start(15000), no input for 60s -> no further GET /api/v1/grants for the next 20 minutes of ticks; a pointerdown or keydown then triggers one GET immediately and resumes the 15s interval; a visibilitychange to visible also triggers one GET"]
  status = "done"

[[task]]
  id = "t-5"
  wave = 2
  title = "Tag sessions with a device; 15-minute idle"
  files = ["internal/auth/auth.go", "internal/auth/auth_test.go", "internal/store/sessions.go", "internal/store/sessions_test.go"]
  description = '''Session.DeviceID (nullable); the store persists and scans device_id. Authenticate slides a tagged session by 15m and an untagged one by 30d. Manager.IssueForDevice, AttachDevice (sets device_id AND expires_at=now+15m), DetachDevice (clears it AND sets expires_at=now+30d).'''
  covers = ["c-3", "c-5"]
  depends_on = ["t-2"]
  test_contract = [
    '''if the idle window does not slide or the boundary is off, TestAuthenticate_PinIdleWindow fails: fake clock, tagged session -> Authenticate at +14m59s OK with ExpiresAt=now+15m, again +14m59s later still OK, then exactly +15m00s idle -> ErrNoSession and the row is deleted''',
    '''if the lock applies globally, TestAuthenticate_UntaggedUnaffected fails: an untagged session at +16m still authenticates with ExpiresAt=now+30d''',
    '''if issuance ignores the device, TestIssueForDevice fails: IssueForDevice(..., 7) -> ExpiresAt=now+15m, DeviceID=7; plain Issue still now+30d''',
    '''if attaching does not reset expiry, TestAttachDevice_StartsWindow fails: AttachDevice at T with no further request -> Authenticate at T+15m01s returns ErrNoSession''',
    '''if detaching does not restore 30d, TestDetachDevice_RestoresSliding fails: DetachDevice at T with no further request -> Authenticate at T+16m OK with ExpiresAt now+30d''',
    '''if an absent device is stored as 0, TestSession_DeviceIDRoundTrip fails: DeviceID 7 reads back 7; DeviceID 0 stores SQL NULL (raw query asserts device_id IS NULL)''',
  ]
  status = "done"

