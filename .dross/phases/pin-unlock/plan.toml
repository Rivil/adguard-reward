task_seq = 13

[phase]
  id = "pin-unlock"

# Wire conventions (agreed in panel synthesis, panel/synthesis.md; all 10 disagreements took the provisional default):
# - schema 0010: devices(id PK, username, token_hash UNIQUE, pin_hash CHECK LIKE '$argon2id$%',
#   failed_attempts CHECK 0..5, created_at, expires_at); sessions.device_id NULL REFERENCES devices ON DELETE SET NULL.
# - A session is a "PIN session" iff sessions.device_id IS NOT NULL (server state, never cookie presence).
#   Tagged sessions slide 15m; untagged slide 30d. AttachDevice sets expires_at=now+15m; DetachDevice sets now+30d.
# - Revocation (5th strike, logout) = RevokeDevice: deletes the device AND every session tagged to it in one tx (D-1).
#   PIN remove = DetachDevice + DeleteDevice (session survives, untagged, 30d).
# - Strike counter: ReserveAttempt increments in SQL BEFORE Argon2 (CHECK caps at 5); a correct PIN resets to 0 (D-2).
# - Password re-check for change/remove: shared recheckPassword extracted from handleLogin, same limiter budget (D-7).
#   Wrong password -> 403 bad_credentials; missing -> 403 reauth_required (D-3). SPA 401 routing unchanged otherwise.
# - Unlock: POST /api/v1/unlock outside requireSession. No/malformed device cookie -> plain 401 unauthorized, logged
#   outcome=no_device (D-9); well-formed but no live row -> 401 device_revoked + cookie cleared; wrong -> 401 bad_pin
#   {attempts_remaining}; ok -> 204, TouchDevice(+90d), IssueForDevice(device.username). Device expiry slides only here.
# - Logic lives in handlers over thin auth/store primitives; API split first-set (t-9) / unlock (t-10) /
#   change-remove (t-12) (D-4).
# - SPA lock is a `locked` store with PinPad as an overlay; URL is kept and the route refetches on unlock (D-6).
# - Full login with a live same-user device cookie tags the new session; another user's device cookie is cleared (D-8).
# - RunSweeper also deletes expired device rows (D-10).
# - New dependency: golang.org/x/crypto (argon2), pinned to an exact version.

[[task]]
  id = "t-1"
  wave = 1
  title = "Add PIN validation and Argon2id PHC hashing"
  files = ["internal/auth/pin.go", "internal/auth/pin_test.go", "go.mod", "go.sum"]
  description = '''ValidatePIN (bytes '0'-'9' only, length 4-6). HashPIN -> $argon2id$v=19$m=..,t=..,p=..$salt$hash with a random 16-byte salt, defaults no lower than m=19456 KiB, t=2, p=1. VerifyPIN parses params from the stored string and compares in constant time. Adds golang.org/x/crypto pinned to an exact version.'''
  covers = ["c-1"]
  test_contract = [
    '''if validation uses unicode.IsDigit or trims input, TestValidatePIN fails: it rejects "١٢٣٤" (Arabic-Indic), "１２３４" (fullwidth), " 1234", "1234\n", "123", "1234567", "12a4", "" and accepts "0000", "000000", "0123"''',
    '''if the hash is not salted PHC Argon2id, TestHashPIN_Format fails: output matches ^\$argon2id\$v=19\$m=\d+,t=\d+,p=\d+\$[A-Za-z0-9+/]+\$[A-Za-z0-9+/]+$, does not contain the PIN, and two hashes of the same PIN differ''',
    '''if verification coerces or is lax about the stored string, TestVerifyPIN fails: VerifyPIN("0123", HashPIN("123")) is false; a tampered salt is false; an $argon2i$ string, a v=16 string or a truncated PHC returns an error, never true, never panics''',
    '''if VerifyPIN reads params from constants instead of the stored hash, TestVerifyPIN_StoredParams fails: a hash built with m=8192,t=1,p=1 still verifies''',
  ]
  status = "done"

[[task]]
  id = "t-2"
  wave = 1
  title = "Add devices schema, store and attempt reservation"
  files = ["internal/store/migrations/0010_devices.sql", "internal/auth/device.go", "internal/store/devices.go", "internal/store/devices_test.go", "internal/store/store_test.go"]
  description = '''Migration 0010 per the header. auth.Device (LogValue = id + username only) and the auth.DeviceStore interface; store implements ReserveAttempt (atomic increment-first), ResetAttempts, ReplacePIN, RevokeDevice (tagged sessions + device in one tx), DeleteDevice, DeleteOtherDevices(username, keepID), DeleteExpiredDevices, TouchDevice.'''
  covers = ["c-1", "c-4", "c-5", "c-6"]
  test_contract = [
    '''if the reservation is read-then-write, TestReserveAttempt_Concurrent fails: 20 goroutines on one device -> exactly 5 succeed returning 1..5 once each and 15 are refused''',
    '''if the counter is not persisted, TestReserveAttempt_SurvivesReopen fails: 3 reservations, Close, re-Open on the same dir -> the next ReserveAttempt returns 4''',
    '''if revocation only detaches sessions, TestRevokeDevice_DeletesTaggedSessions fails: RevokeDevice deletes the device and every session whose device_id points at it, and leaves other sessions untouched''',
    '''if remove deletes the session, TestDeleteDevice_DetachesSession fails: after DeleteDevice the tagged session row remains with device_id NULL''',
    '''if reset or replace keep the counter, TestResetAndReplacePIN fails: ResetAttempts after 3 reservations and ReplacePIN both leave failed_attempts 0; ReplacePIN swaps pin_hash and keeps token_hash''',
    '''if the schema guards are missing, TestMigrate0010_Checks fails: pin_hash "583920" or failed_attempts 6 is rejected by CHECK; a duplicate token_hash is rejected by UNIQUE; schema_migrations lists 0010_devices.sql directly after 0009_grant_history.sql''',
    '''if DeleteOtherDevices crosses users or ignores keepID, TestDeleteOtherDevices fails: mum has A, B, C and dad has D -> DeleteOtherDevices("mum", A) removes B and C, keeps A and D, returns 2; keepID 0 removes all of mum's''',
    '''if Device logs its hashes, TestDevice_LogValue fails: slog of a Device renders exactly {id, username}''',
  ]
  status = "done"

