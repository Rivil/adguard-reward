  depends_on = ["t-4"]
  test_contract = [
    '''if pin_required shows the login page, the App lock test fails: on /children, GET /api/v1/me -> 401 pin_required renders the pad (no "Sign in" button) and pathname stays /children; 401 unauthorized renders "Sign in"''',
    '''if the pad sends the wrong body, the PinPad submit test fails: tapping 1,2,3,4 and submitting POSTs /api/v1/unlock with exactly {pin:"1234"}''',
    '''if bad_pin is mishandled, the wrong PIN test fails: "4 attempts left" is visible, the pad is still shown, the input is cleared and the location is unchanged''',
    '''if revocation does not fall back to login, the device_revoked test fails: 401 device_revoked from unlock renders Login and pathname is /login''',
    '''if unlock does not refetch, the unlock success test fails: 204 -> pad gone, /api/v1/children fetched again and Children renders''',
    '''if concurrent locks stack, the double-lock test fails: two concurrent 401 pin_required from Home's fetches render exactly one pad''',
    '''if input validation is missing, the PinPad input test fails: submit is disabled below 4 digits and a non-digit keystroke never reaches the input value''',
  ]
  status = "done"

[[task]]
  id = "t-7"
  wave = 3
  title = "Add device cookie and pin_required gate"
  files = ["internal/auth/device.go", "internal/auth/middleware.go", "internal/auth/auth.go", "internal/auth/middleware_test.go"]
  description = '''Options.Devices + DeviceLifetime (90d). IssueDevice (256-bit token, SHA-256 stored via newToken), LookupDevice (expired -> deleted on sight), DeviceCookie/ClearDeviceCookie with single-Set-Cookie dedupe. RequireSession's 401 path: live device cookie -> pin_required (session cookie cleared, device cookie kept); otherwise plain unauthorized + device cookie cleared. RunSweeper also deletes expired devices.'''
  covers = ["c-2", "c-3"]
  depends_on = ["t-5"]
  test_contract = ["if the token is short or stored raw, TestIssueDevice fails: the raw token is 43 chars (256 bits base64url) and the stored token_hash = sha256(decoded bytes)", "if an expired PIN session gets a plain 401, TestRequireSession_PinRequired fails: expired tagged session + live device cookie -> 401 pin_required, session cookie cleared, no device Set-Cookie", "if the request after the first lock loses pin_required, TestRequireSession_NoSessionCookie fails: no session cookie + live device cookie -> 401 pin_required", "if the 90-day lifetime is not enforced, TestRequireSession_ExpiredDevice fails: a device row past 90d -> 401 unauthorized, device cookie cleared (Max-Age<0), row deleted", "if bad device cookies linger, TestRequireSession_BadDeviceCookie fails: a malformed or unknown device cookie -> 401 unauthorized and the device cookie is cleared", "if ordinary requests slide the device, TestRequireSession_NoDeviceSlide fails: a successful authenticated request leaves the device's expires_at unchanged", "if cookie attributes are wrong, TestDeviceCookie_Attributes fails: HttpOnly, SameSite=Strict, Path=/, Max-Age=7776000, Secure iff Options.Secure (both ways), name differs from the session cookie; set-then-clear on one response leaves exactly one device Set-Cookie", "if store errors are masked as logged-out, TestRequireSession_DeviceStoreError fails: a DeviceStore error on the 401 path -> 500 internal and neither cookie cleared", "if the sweeper skips devices, TestRunSweeper_Devices fails: a tick removes a device with expires_at<=now and keeps one at now+1s", "if a nil device store panics or changes behaviour, TestRequireSession_NilDevices fails: with Options.Devices nil, sessions slide 30d, a missing or expired session gets plain 401 unauthorized, a device cookie on the request is ignored (never cleared, never pin_required), and nothing panics"]
  status = "done"

