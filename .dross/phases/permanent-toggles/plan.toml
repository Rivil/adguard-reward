    '''if drift is not undone, TestReconcile_ToggleDrift fails: youtube unblocked, MutateClient re-adds it -> one pass removes it; tiktok blocked, parent removes it -> one pass re-adds it''',
    '''if a converged pass writes, TestReconcile_ToggleNoop fails: second pass -> 0 POSTs''',
    '''if AdGuard-owned services are touched, TestReconcile_UntoggledUntouched fails: no toggle rows, parent changes netflix -> 0 update POSTs''',
    '''if the reconciler fights a grant, TestReconcile_BlockYieldsToGrant fails: A blocked youtube, C's live grant covers shared tv -> tv keeps youtube absent across 3 passes''',
    '''if an overdue grant's services stay open, TestReconcile_OverdueThenBlock fails: overdue grant on tiktok + block toggle on tiktok -> one pass leaves tiktok present''',
    '''if partial apply never converges, TestReconcile_ConvergesToggle fails: toggle row seeded via store.SetServiceToggle with kid-tablet still carrying youtube, fault cleared -> one pass removes it (store-seeded so this task does not need t-8)''',
    '''if a read failure converges from partial data, TestReconcile_ToggleReadFailure fails: ListServiceToggles error -> 0 toggle writes, grant half and region half still run''',
    '''if a new device ignores toggles, TestCreateClient_BaselineToggles fails: youtube unblocked, tiktok blocked, sibling still blocks youtube -> new client excludes youtube, includes tiktok; same through AdoptClients''',
  ]
  status = "pending"

