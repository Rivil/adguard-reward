[[task]]
  id = "t-8"
  wave = 3
  title = "Engine Toggle for built-ins: trim, write, mutex"
  files = ["internal/grants/toggle.go", "internal/grants/toggle_test.go"]
  description = "Toggle(ctx, childID, serviceID, state) (ToggleResult{Applied, Failed, Clients, Grant *{ID, Ended}}, error) under e.mu with one ApplyTimeout context: custom id must exist (*ErrUnknownService, nothing stored); SetServiceToggle; stop an Ended grant's timer. Both built-in directions write through applyPlan, so a use_global client lands in Failed either way: unblock -> applyPlan(togglePlan(...)), whose remove covers every mapped client; block -> applyPlan(togglePlan for the child's mapped clients ∪ dropOpen(revertPlan(pre-trim grant restricted to the blocked service, active), permanentOpen)) so the trimmed grant's stored (even unmapped) clients are re-blocked, best-effort for the unmapped ones per the toggle_partial_apply exception. Clients = the clients on which the requested state now holds by this toggle (failed ones included; a client held open by another owner's unblock or a live grant is excluded); t-11 derives the shared report from it. Known limitation (accepted, phase 04 precedent): a use_global client is reported in Failed and stays unconverged until migrated off the global list. Custom ids store intent and trim here; their region write is t-12."
  covers = ["c-1", "c-2", "c-3"]
  depends_on = ["t-5"]
  test_contract = ["if unblock misses a client, TestToggle_UnblockAll fails: child on kid-phone, tablet, tv (shared) -> youtube absent on all three, Applied true, Clients all three", "if unblock_during_grant writes or trims, TestToggle_UnblockDuringGrant fails: grant on youtube over all the child's clients -> 0 /control/clients/update POSTs, services/ends_at unchanged, timer armed; at expiry youtube stays absent", "if block_during_grant leaves it covered, TestToggle_BlockDuringGrant fails: grant [youtube,tiktok] -> youtube present on every grant client in-call, tiktok absent, grant active [tiktok], timer armed; expiry re-adds only tiktok", "if an emptied grant keeps its timer, TestToggle_BlockEndsGrant fails: grant [youtube] -> Grant{Ended:true}, fakeClock.pending()==0, later Advance issues no update POST", "if a trimmed grant's old device stays open, TestToggle_BlockOldDevice fails: grant stored on old-tablet (since unmapped) -> youtube added on old-tablet too", "if a block overrides a co-owner, TestToggle_BlockSharedHeldOpen fails: B unblocked youtube, A blocks -> a-phone present, tv untouched and not in Failed", "if partial failure strands intent, TestToggle_PartialApply fails: SetUpdateStatus(tablet,500) -> Applied false, Failed [tablet], row stored, nil error; clients read 502 -> Failed every client, 0 update POSTs; use_global client -> in Failed, global list unwritten", "if the custom check races delete, TestToggle_UnknownCustom fails: DeleteService(1) then Toggle custom:1 (and custom:99) -> *ErrUnknownService, no row", "if the mutex is skipped, TestToggle_RaceExpiry fails: 50 runs of unblock youtube concurrent with expiry -> youtube absent on every client every run", "if re-toggling rewrites, TestToggle_Idempotent fails: second identical unblock -> 0 update POSTs", "if the 5 s budget is unbounded, TestToggle_Deadline fails: Hang /control/clients/update 10 s with default ApplyTimeout (4 s) -> returns within 4.5 s, Applied false", "if Clients over-reports, TestToggle_ClientsGoverned fails: B unblocked youtube on shared tv, A blocks -> Clients [a-phone]; C's live youtube grant on tv, A blocks -> Clients excludes tv; A unblocks -> Clients every mapped client incl. tv; tablet 500 -> tablet in both Failed and Clients", "if the off-owner exception is mis-scoped, TestToggle_BlockOldDeviceFails fails: grant stored on old-tablet (since unmapped), SetUpdateStatus(old-tablet,500), block youtube -> Applied false, old-tablet in Failed, grant trimmed; after clearing the fault a Reconcile issues 0 update POSTs to old-tablet (best-effort per toggle_partial_apply exception)", "if an unblock on a global-list device reports success, TestToggle_GlobalBothDirections fails: kid-tablet use_global_blocked_services true; unblock youtube -> Applied false, Failed [kid-tablet], no write to kid-tablet; block youtube -> same; the global blocked_services list is never written"]
  status = "done"

