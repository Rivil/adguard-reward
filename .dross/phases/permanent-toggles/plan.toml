task_seq = 12

[phase]
  id = "permanent-toggles"

# Wire conventions (agreed in panel synthesis, panel/synthesis.md; all 8 disagreements took the provisional default):
# - store: service_toggles(child_id FK children ON DELETE CASCADE, service_id TEXT, state CHECK IN ('blocked','unblocked'),
#   updated_at, PK(child_id, service_id)) + AFTER DELETE ON custom_services trigger dropping 'custom:' || OLD.id
# - SetServiceToggle(ctx, childID, serviceID, state, at) (ToggleChange{Trimmed *store.Grant (pre-trim), Ended bool}, error);
#   at most one grant trimmed (grant_services_live_idx). ListServiceToggles(ctx) ordered by (child_id, service_id)
# - engine: Toggle(ctx, childID, serviceID, state) (ToggleResult{Applied, Failed []string, Clients []string, Grant *{ID, Ended}}, error)
# - HTTP: POST /api/v1/children/{id}/toggles {service_id, state} -> 200 {service_id, state, applied, failed[],
#   shared[{client, others}], grant:{id, ended}|null}; 404 unknown child, 400 bad body/state, 422 unknown service,
#   502 catalogue unreadable (nothing stored)
# - blocked view: each service gains toggle "blocked"|"unblocked"|null; unblocked_by[] entries gain permanent:bool (grant_id 0);
#   view reads toggles via ChildStore.ListServiceToggles (no new Deps field)
# - precedence per (client, toggled built-in): OPEN if any current owner has it unblocked or any active grant covers it there;
#   else BLOCK if any owner has it blocked; else AdGuard-owned (no write)
# - a block writes the child's mapped clients ∪ the trimmed grant's stored clients
# - partial rows offer both Unblock and Block

[[task]]
  id = "t-1"
  wave = 1
  title = "Store toggles with atomic grant trim"
  files = ["internal/store/migrations/0008_service_toggles.sql", "internal/store/toggles.go", "internal/store/toggles_test.go", "internal/store/custom_services_test.go"]
  description = '''service_toggles table + AFTER DELETE ON custom_services trigger. SetServiceToggle upserts; for state=blocked the SAME tx deletes the child's active grant_services row for that service and ends a grant left with none (status ended, ended_at=at), returning the pre-trim grant. ListServiceToggles lists all.'''
  covers = ["c-2", "c-4"]
  test_contract = [
    '''if trim is not atomic with the upsert, TestSetToggle_TrimAtomic fails: an injected failure after the upsert leaves neither the toggle row nor a trimmed grant; state "maybe" -> error, no row, grant still [tiktok,youtube]''',
    '''if an emptied grant stays active, TestSetToggle_EndsEmptyGrant fails: grant {youtube} + block youtube -> Ended true, GetGrant status "ended", ListActiveGrants empty, CreateGrant(child, [youtube]) then succeeds instead of *ErrGrantOverlap''',
    '''if trimming is mis-scoped, TestSetToggle_TrimScope fails: grant {tiktok,youtube} -> block youtube leaves [tiktok] active with ends_at unchanged and Trimmed carrying the pre-trim stored clients; child 2's active youtube grant and child 1's expired youtube grant untouched; state=unblocked trims nothing (Trimmed nil, Ended false)''',
    '''if set is not an upsert, TestSetToggle_Upsert fails: blocked then unblocked -> one row, unblocked''',
    '''if bad input persists, TestSetToggle_Invalid fails: unknown child 99 -> ErrChildNotFound, no row''',
    '''if toggles dangle, TestToggles_Cascade fails: DeleteChild(1) drops only child 1's rows; DeleteCustomService(1) drops custom:1 rows, keeps custom:10 (no prefix LIKE) and built-ins''',
    '''if intent does not persist, TestToggles_Persist fails: set, Close, store.Open same dir -> identical ListServiceToggles; the custom_services_test migration-order check fails unless 0008_service_toggles.sql is last''',
  ]
  status = "done"

[[task]]
  id = "t-2"
  wave = 1
  title = "Pure intent planner: open-wins and revert-v2"
  files = ["internal/grants/shared.go", "internal/grants/shared_test.go", "internal/grants/intent.go", "internal/grants/intent_test.go"]
  description = "Grants-local toggle{childID int64; serviceID, state string} type (t-5 maps store rows onto it). permanentOpen(children, toggles) -> client -> services any CURRENT owner has unblocked. dropOpen(plan, open) removes those per client (a client left empty drops out); revertPlan's signature is unchanged. togglePlan(children, toggles, active) -> per client {remove, add} under the precedence: OPEN if any current owner has it unblocked or any active grant covers it there; else BLOCK if any owner has it blocked; else AdGuard-owned (no write). Built-in toggled services only. Pure, no I/O."
  covers = ["c-3"]
  test_contract = ["if revert ignores permanent unblocks, TestRevertPlan_PermanentOpen fails: grant [youtube,tiktok] on [kid-phone], youtube unblocked for the owner -> dropOpen(revertPlan(...), permanentOpen(...)) == {kid-phone:[tiktok]}", "if \"any owner\" is read from the grant, TestRevertPlan_SharedOwner fails: tv owned by A+B, B unblocked youtube, A's grant covers tv+a-phone -> tv omitted, a-phone [youtube]; B unmapped from tv -> tv re-blocked", "if dropOpen leaves empty entries, TestDropOpen_EmptiesClient fails: {tv:[youtube]} with tv open on youtube -> tv key absent (so revert issues no Add for tv)", "if ref-counting regresses, the existing TestRevertPlan_* cases pass byte-for-byte unmodified (revertPlan signature unchanged)", "if block beats open, TestTogglePlan_OpenWins fails: A blocks, B unblocks youtube, shared tv -> tv remove contains youtube, add lacks youtube; a-phone add contains youtube", "if a block fights a live grant, TestTogglePlan_GrantHolds fails: C's active grant covers youtube on shared tv, A blocks -> tv add lacks youtube", "if custom ids reach blocked_services, TestTogglePlan_BuiltinOnly fails: custom:1 toggles appear in no remove/add list", "if untoggled services are touched, TestTogglePlan_AdGuardOwned fails: no toggle rows -> empty plan for every client"]
  status = "done"

[[task]]
  id = "t-3"
  wave = 1
  title = "Fold permanent toggles into the blocked view"
  files = ["internal/blocked/blocked.go", "internal/blocked/blocked_test.go"]
  description = '''Input gains Toggles. ServiceState gains Toggle (self's intent or ""). Custom service open on a present client iff a grant covers it OR an owner of that client has it unblocked. UnblockedBy adds {client, child, GrantID:0, Permanent:true} for another owner's permanent unblock on a shared client.'''
  covers = ["c-5"]
  test_contract = [
    '''if self intent is lost, TestCompute_ToggleState fails: self unblocked youtube (absent everywhere) -> State "unblocked", Toggle "unblocked"; self blocked tiktok -> Toggle "blocked"; untoggled -> ""''',
    '''if a custom permanent reads wrong, TestCompute_CustomPermanent fails: custom:1, no grants, self unblocked -> unblocked; self blocked -> blocked; only B's unblock on shared tv -> partial, Differs [tv]''',
    '''if attribution is lost, TestCompute_PermanentUnblockedBy fails: B unblocked youtube, tv shared -> A's UnblockedBy [{tv, B, GrantID:0, Permanent:true}]; self's own toggle never in UnblockedBy''',
    '''if ordering drifts, TestCompute_PermanentAndGrant fails: B's toggle + B's grant 5 on tv -> two entries, permanent (id 0) first, then grant 5''',
    '''if a non-owner's toggle leaks, TestCompute_ForeignToggle fails: toggle by a child owning none of the mapped clients changes no state and adds no UnblockedBy''',
    '''if nil Toggles changes today's output, TestCompute_NoToggles fails: existing fixtures with Toggles nil produce byte-identical Views''',
  ]
  status = "done"

