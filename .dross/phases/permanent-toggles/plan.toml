  description = '''Toggle under e.mu with one ApplyTimeout context: custom id must exist (*ErrUnknownService, nothing stored); SetServiceToggle; stop an Ended grant's timer. Built-in: unblock -> Remove on every mapped client (adguard skips unchanged lists); block -> Add per togglePlan over mapped ∪ trimmed grant's stored clients. Custom or trimmed-custom -> syncRules. Missing/global/AdGuard error -> Failed.'''
  covers = ["c-1", "c-2", "c-3"]
  depends_on = ["t-5"]
  test_contract = [
    '''if unblock misses a client, TestToggle_UnblockAll fails: child on kid-phone, tablet, tv (shared) -> youtube absent on all three, Applied true, Clients all three''',
    '''if unblock_during_grant writes or trims, TestToggle_UnblockDuringGrant fails: grant on youtube over all the child's clients -> 0 /control/clients/update POSTs, services/ends_at unchanged, timer armed; at expiry youtube stays absent''',
    '''if block_during_grant leaves it covered, TestToggle_BlockDuringGrant fails: grant [youtube,tiktok] -> youtube present on every grant client in-call, tiktok absent, grant active [tiktok], timer armed; expiry re-adds only tiktok''',
    '''if an emptied grant keeps its timer, TestToggle_BlockEndsGrant fails: grant [youtube] -> Grant{Ended:true}, fakeClock.pending()==0, later Advance issues no update POST''',
    '''if a trimmed grant's old device stays open, TestToggle_BlockOldDevice fails: grant stored on old-tablet (since unmapped) -> youtube added on old-tablet too''',
    '''if a block overrides a co-owner, TestToggle_BlockSharedHeldOpen fails: B unblocked youtube, A blocks -> a-phone present, tv untouched and not in Failed''',
    '''if partial failure strands intent, TestToggle_PartialApply fails: SetUpdateStatus(tablet,500) -> Applied false, Failed [tablet], row stored, nil error; clients read 502 -> Failed every client, 0 update POSTs; use_global client -> in Failed, global list unwritten''',
    '''if a custom toggle skips the region, TestToggle_Custom fails: unblock custom:1 -> one @@ line over the child's clients, block line unchanged; block under a {custom:1} grant -> @@ gone, grant ended; set_rules 500 or malformed region -> Applied false, Failed = child's clients, row stored, nil error''',
    '''if the custom check races delete, TestToggle_UnknownCustom fails: DeleteService(1) then Toggle custom:1 (and custom:99) -> *ErrUnknownService, no row''',
    '''if the mutex is skipped, TestToggle_RaceExpiry fails: 50 runs of unblock youtube concurrent with expiry -> youtube absent on every client every run''',
    '''if re-toggling rewrites, TestToggle_Idempotent fails: second identical unblock -> 0 update POSTs''',
    '''if the 5 s budget is unbounded, TestToggle_Deadline fails: Hang /control/clients/update 10 s with default ApplyTimeout (4 s) -> returns within 4.5 s, Applied false''',
  ]
  status = "pending"

