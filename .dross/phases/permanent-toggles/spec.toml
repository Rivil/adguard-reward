[phase]
  id = "permanent-toggles"
  title = "permanent-toggles"
  milestone = "v0.2"

[[criteria]]
  id = "c-1"
  text = "From a child's blocked view a parent can permanently unblock a blocked or partial service (built-in or custom); within 5 s none of the child's mapped clients is blocked from it in AdGuard (built-in: absent from blocked_services; custom: no blocking rule for those clients in the managed region)."

[[criteria]]
  id = "c-2"
  text = "From a child's view a parent can permanently block any built-in or custom service that is unblocked or partial; within 5 s every mapped client of the child is blocked from it in AdGuard (built-in: present in blocked_services; custom: covered by the managed region's block rule)."

[[criteria]]
  id = "c-3"
  text = "When a grant expires or is ended early, a service that is permanently unblocked for that child stays unblocked on every client the grant covered; the grant's other services re-block as before (ref-counting on shared clients unchanged)."

[[criteria]]
  id = "c-4"
  text = "Permanent toggle state persists across restarts: a grant that expires while the app is down is reverted by the startup pass without re-blocking permanently unblocked services, and the managed region keeps a custom service's permanent unblock after restart and every reconcile tick."

[[criteria]]
  id = "c-5"
  text = "The child's view lists permanently unblocked services with an 'unblocked' state and a block control, instead of hiding them as it does today, so every toggle can be reversed from the same page."

[[decisions]]
  key = "drift_enforcement"
  choice = "A toggle stores per-(child, service) intent in both directions; every reconcile pass converges AdGuard to it (blocked_services for built-ins, managed region for custom). Services never toggled via the app stay AdGuard-owned."
  why = "Core value is no drift; matches how custom services and grants already converge."
  locked = true

[[decisions]]
  key = "revert_baseline_v2"
  choice = "Supersedes phase 04 revert_baseline: revert re-blocks a grant's services except those permanently unblocked for an owner of that client; still set-union, still no pre-grant snapshot."
  why = "Milestone requires an expiring grant never re-block a permanently unblocked service."
  locked = true

[[decisions]]
  key = "shared_client_scope"
  choice = "A toggle applies to all the child's mapped clients, shared ones included. A shared client is open if any owning child has the service permanently unblocked. Other owners' views show it as unblocked-by that child. The toggle response names the shared devices it affected."
  why = "Same 'any owner opens' rule as grants on shared devices; one consistent mental model."
  locked = true

[[decisions]]
  key = "block_during_grant"
  choice = "A permanent block on a service under an active grant blocks immediately and removes that service from the grant's coverage; the grant's other services keep running; a grant left with no services ends early."
  why = "The tap must do what it says now; a 409 would make it two taps."
  locked = true

[[decisions]]
  key = "unblock_during_grant"
  choice = "A permanent unblock on a service under an active grant just records the intent; the grant runs on unchanged and the service stays open at its end (c-3)."
  why = "The service is already open; nothing to write, only the revert changes."
  locked = true

[[decisions]]
  key = "toggle_partial_apply"
  choice = "If a toggle's AdGuard write fails on some clients, the intent is stored, the response reports applied=false with the failed client names, and the reconciler converges them."
  why = "Mirrors phase 04 partial_apply; stored intent plus convergence means nothing is stranded."
  locked = true

[[decisions]]
  key = "block_picker"
  choice = "A 'Block a service…' control at the foot of the child's view opens a searchable picker over the catalogue (built-in + custom, already-blocked excluded); picking one permanently blocks it."
  why = "Reaches any of ~100 built-ins without a long phone scroll; the view stays focused on what's blocked or toggled."
  locked = true

[[deferred]]
  text = "Record 'ended by permanent block' (a grant trimmed or ended by block_during_grant) as a grant end reason in the history."
  why = "The history store arrives with grant-history."
  target = "grant-history"

[[deferred]]
  text = "Export/import carries permanent toggle state alongside children, buttons and custom services."
  why = "export-import owns the file format; nothing to export until this phase lands."
  target = "export-import"
