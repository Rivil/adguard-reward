[phase]
  id = "grant-history"
  title = "grant-history"
  milestone = "v0.2"

[[criteria]]
  id = "c-1"
  text = "Every finished grant records how it ended — expired (at its scheduled time), ended early (parent End), or ended by permanent block (a block toggle removed its last service) — and its actual end time."
  deferred = ["516cf6ca4fdbf874"]

[[criteria]]
  id = "c-2"
  text = "Every extension of a grant is recorded with the time it happened and the old and new end times; a grant extended twice shows two extension entries, not only its latest end time."

[[criteria]]
  id = "c-3"
  text = "When a permanent block trims one service from a live grant that keeps other services, the history still lists that service on the grant, marked removed with the time and reason (permanent block)."
  deferred = ["f3282d0d14e58aec"]

[[criteria]]
  id = "c-4"
  text = "A parent can view one child's grant history: grants newest first, each with service names, start time, end time, how it ended and any extensions; a live grant shows as ongoing."

[[criteria]]
  id = "c-5"
  text = "History survives an app restart; a grant that became overdue while the app was down is recorded as expired once the startup pass reverts it."

[[criteria]]
  id = "c-6"
  text = "Grants that finished before the upgrade still appear in the child's history with their services, start and end times, and whatever end status the old rows carry."

[[decisions]]
  key = "history_location"
  choice = "Dedicated history screen per child (own route, e.g. history?child=N, with a back button), reached from a 'History' link for that child."
  why = "Keeps Home fast and focused on one-tap rewards; history is an occasional look-back."
  locked = true

[[decisions]]
  key = "retention"
  choice = "History is never pruned. The screen shows the newest 50 grants and a 'load more' control pages further back."
  why = "Rows are tiny (thousands a year at most); paging keeps the screen fast without losing records."
  locked = true

[[decisions]]
  key = "legacy_end_reason"
  choice = "Pre-upgrade 'expired' rows show as expired; pre-upgrade 'ended' rows show as ended with reason unknown — never backfilled as ended early or ended by permanent block."
  why = "Old rows cannot tell a parent End from a permanent-block trim; history must not claim what it doesn't know."
  locked = true

[[decisions]]
  key = "service_names"
  choice = "Each service's display name is snapshotted when the grant starts and shown forever after. Pre-upgrade grants with no snapshot resolve to the current name, or the bare service id if the service no longer exists."
  why = "History should read as the parent saw it, unaffected by later custom-service renames/deletes or AdGuard catalogue changes."
  locked = true

[[decisions]]
  key = "deleted_child_history"
  choice = "Deleting a child does not delete its grant rows (grants keep no FK to children), but its history is no longer reachable from the UI."
  why = "History is viewed per child; keeping rows matches the existing grants-outlive-child design."
  locked = true

[[deferred]]
  text = "Combined grant-history view across all children."
  why = "Per-child view meets the milestone criterion; cross-child overview is a separate screen."
  target = "history-overview"

[[deferred]]
  text = "History filters / search by service, date range or end reason."
  why = "Paged newest-first list is enough until history volume makes it painful."
  target = "history-overview"

[[deferred]]
  text = "Include grant history in the export-import JSON file."
  why = "Milestone scopes export to children, buttons and custom services; export-import decides whether history joins."
  target = "export-import"
