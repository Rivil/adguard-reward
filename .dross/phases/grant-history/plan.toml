[[task]]
  id = "t-9"
  wave = 4
  title = "Serve GET child history endpoint"
  files = ["internal/api/history.go", "internal/api/history_test.go", "internal/api/api.go"]
  description = '''Route GET /api/v1/children/{id}/history behind requireSession. ChildStore gains ListGrantHistory (already wired as Children: st). endStatus maps (status, reason) to the wire status; names resolve snapshot -> live catalogue -> bare id, reading the catalogue only when a snapshot is missing.'''
  covers = ["c-1", "c-2", "c-3", "c-4", "c-6"]
  depends_on = ["t-6", "t-7"]
  test_contract = [
    '''if legacy or reasoned ends map wrongly, TestEndStatus fails its row: (ended, NULL) -> "ended_unknown" never "ended_early"; (expired, NULL) and (expired, 'expired') -> "expired"; (ended, 'ended_early') -> "ended_early"; (ended, 'permanent_block') -> "permanent_block"; (active, *) -> "ongoing"''',
    '''if history names follow later edits, TestHistory_NameSnapshotEndToEnd fails: through the real store and engine, POST a grant for custom:1 'Roblox', rename it 'Games' -> GET history shows 'Roblox'; DELETE custom:1 after the grant ends -> still 'Roblox'; changing the fake catalogue's built-in name -> snapshot still wins; a legacy grant naming deleted custom:7 shows "custom:7"''',
    '''if the catalogue is a hard dependency, TestHistory_CatalogueDown fails: AdGuard Services() returning 500 still gives 200 with snapshot names intact and bare ids for unsnapshotted services; with all names snapshotted no catalogue request is made''',
    '''if extensions or removals are lost on the wire, TestHistory_ExtendedAndTrimmed fails: a real-store grant extended twice then ended returns "ended_early", two extensions and ended_at set; a trimmed service is listed with removed_reason''',
    '''if the cursor does not chain, TestHistory_Paging fails: 51 grants give 50 + next_before, and following it returns 1 + null''',
    '''if input/auth errors are wrong, TestHistory_Errors fails: non-numeric, unknown or deleted child id -> 404; ?before=abc, -1 or 0 -> 400; no session -> 401''',
    '''if the wire shape drifts from the pinned contract, TestHistory_GoldenKeys fails: the response JSON has exactly the pinned field names and lists are [], never null''',
  ]
  status = "done"

[[task]]
  id = "t-10"
  wave = 5
  title = "Prove history across restart and downtime"
  files = ["cmd/adguard-reward/main_test.go"]
  description = '''End-to-end through run(), reusing the rewindGrant/startWith helpers: restart survival, a grant that went overdue during downtime, and AdGuard down at startup.'''
  covers = ["c-1", "c-2", "c-5"]
  depends_on = ["t-9"]
  test_contract = [
    '''if history is not persisted, TestRun_HistorySurvivesRestart fails: a grant ended early after two extensions still shows "ended_early" with two extensions via GET history after a restart''',
    '''if the startup pass does not record expiry, TestRun_OverdueGrantExpiredAtStartup fails: a grant whose ends_at passes while the app is stopped reads "expired" after restart with ended_at >= restart time (set by the startup pass, not ends_at)''',
    '''if expiry is recorded before AdGuard confirms the revert, TestRun_AdGuardDownAtStartup fails: with AdGuard unreachable at startup the overdue grant reads "ongoing", not "expired", until a later pass reverts it''',
  ]
